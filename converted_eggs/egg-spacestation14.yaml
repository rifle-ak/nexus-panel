metadata:
  id: spacestation-14
  name: Spacestation 14
  version: PTDL_v2
  game: generic
  author: josdekurk@gmail.com
  description: Space Station 14 tells the story of an ordinary shift on a space station gone wrong. Immerse yourself into your role, tinker with detailed systems, and survive the chaos in this round-based multiplayer role playing game.
container:
  image: ghcr.io/parkervcp/yolks:dotnet_8
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./Robust.Server
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: SERVER_NAME
  description: The server hostname
  default: MyServer
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_TICK
  description: The tickrate of the server. Default is 60
  default: '60'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 1
    - 80
- name: SERVER_MAX_PLAYERS
  description: ''
  default: '256'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
  rules:
  - type: port
    range:
    - 1
    - 256
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
