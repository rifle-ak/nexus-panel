metadata:
  id: 5e-tools
  name: 5e Tools
  version: PTDL_v2
  game: generic
  author: pterodactyl@demi.cloud
  description: A suite of tools for 5th Edition Dungeons & Dragons players and Dungeon Masters.
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - cd ~/5e-tools && git pull && cd && ./caddy run --config ~/caddy.json
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: REPOSITORY
  description: Git Repository to use for cloning 5e Tools
  default: https://github.com/5etools-mirror-1/5etools-mirror-1.github.io
  required: true
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
