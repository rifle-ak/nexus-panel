metadata:
  id: cuberite
  name: Cuberite
  version: PTDL_v2
  game: minecraft
  author: parker@parkervcp.com
  description: A lightweight, fast and extensible game server for Minecraft
  tags:
  - eula
  - java_version
  - pid_limit
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 2Gi
    max: 4Gi
    swap: 512Mi
  disk:
    min: 10Gi
    io_priority: normal
startup:
  command: ./Cuberite
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: SERV_DESC
  description: Server Description
  default: Cuberite on Pterodactyl!
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: ADMIN_PASS
  description: The password for the webadmin panel 'admin' user
  default: ChangeMe
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: WEB_PORT
  description: Port for the cuberite webadmin panel.
  default: '8080'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
  rules:
  - type: port
    range:
    - 1
    - 65535
networking:
  ports:
  - name: WebAdmin Port
    internal: '{{WEB_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{WEB_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
