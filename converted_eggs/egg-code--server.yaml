metadata:
  id: code-server
  name: Code-Server
  version: PTDL_v2
  game: generic
  author: mario.franze@gmail.com
  description: Run VS Code on any machine anywhere and access it in the browser.
container:
  image: ghcr.io/parkervcp/yolks:nodejs_16
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: sh
  args:
  - .local/lib/code-server-{{VERSION}}/bin/code-server
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: PASSWORD
  description: Password to login to your Code-Server instance
  default: changeme
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: VERSION
  description: Version for (re)installation such as 3.9.3. Defaults to latest version if no valid version is provided
  default: latest
  required: false
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
