metadata:
  id: wine-generic
  name: Wine Generic
  version: PTDL_v2
  game: generic
  author: parker@parkervcp.com
  description: a generic egg to run servers with wine
container:
  image: ghcr.io/parkervcp/yolks:wine_latest
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: wine
  args:
  - '{{SERVER_EXECUTABLE}}'
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: DOWNLOAD_URL
  description: URL to use to download a servers files.
  default: https://beamng-mp.com/server/BeamMP_Server.zip
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: SERVER_EXECUTABLE
  description: The server executable to run.
  default: BeamMP-Server.exe
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: INSTALL_DIR
  description: "for example is the server needs to get installed into /home/container/server/bin/\r\n\r\nuse server/bin/"
  default: ''
  required: false
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
