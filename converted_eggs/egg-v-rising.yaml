metadata:
  id: v-rising
  name: V Rising
  version: PTDL_v2
  game: generic
  author: rehlmgaming@gmail.com
  description: Awaken as a vampire. Hunt for blood in nearby settlements to regain your strength and evade the scorching sun to survive. Raise your castle and thrive in an ever-changing open world full of mystery. Gain allies online and conquer the land of the living.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/yolks:wine_staging
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: wine
  args:
  - ./VRisingServer.exe
  - -persistentDataPath
  - save-data
  - -address
  - 0.0.0.0
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n\r\n## File: Pterodactyl V Rising Egg - egg-v-rising.json\r\n## Authors: David Wolfe (Red-Thirten), Kapatheus\r\n## Date: 2023/05/18\r\n## License: MIT License\r\n## Image to install with is 'ghcr.io/pterodactyl/installers:debian'\r\n\r\n# Install required packages.\r\napt -y update && apt -y --no-install-recommends install dos2unix\r\n\r\n# Download and install SteamCMD\r\nexport HOME=/mnt/server\r\ncd /tmp\r\nmkdir -p $HOME/steamcmd $HOME/steamapps\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C $HOME/steamcmd\r\ncd $HOME/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\n\r\n# Install game server using SteamCMD\r\n./steamcmd.sh +force_install_dir $HOME +login anonymous $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} +quit\r\n\r\n# Set up 32 and 64 bit libraries\r\nmkdir -p $HOME/.steam/sdk{32,64}\r\ncp -v linux32/steamclient.so $HOME/.steam/sdk32/steamclient.so\r\ncp -v linux64/steamclient.so $HOME/.steam/sdk64/steamclient.so\r\n\r\n## V Rising Setup\r\nmkdir -p $HOME/save-data/Settings\r\n# Check for successful installation.\r\ncd $HOME/VRisingServer_Data/StreamingAssets/Settings\r\nif [[ -f ServerHostSettings.json ]]; then\r\n    # Copies default ServerHostSettings file to save-data directory.\r\n    # Also converts the contents to use Unix newlines so Ptero's JSON parser does not fail.\r\n    dos2unix -n ServerHostSettings.json $HOME/save-data/Settings/ServerHostSettings.json\r\nelse\r\n    echo -e \"\\n\\nSteamCMD failed to install the V Rising Dedicated Server!\"\r\n    echo -e \"\\tTry reinstalling the server again.\\n\"\r\n    exit 1\r\nfi\r\n\r\necho -e \"\\nV Rising Dedicated Server successfully installed!\\n\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: QUERY_PORT
  description: UDP port for Steam server list features.
  default: '9877'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: AUTO_UPDATE
  description: Quickly checks for any server updates on startup, and updates if necessary.
  default: '1'
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: GAME_SETTINGS_PRESET
  description: What preset of game settings the server should run. Some settings may not apply after the save file is first created. Leave empty/null if you are using a single-player uploaded save or a custom ServerGameSettings.json file in the `~/save-data/Settings/` directory.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - ''
    - DuoPvP
    - HardcorePvP
    - Level30PvE
    - Level30PvP
    - Level50PvE
    - Level50PvP
    - Level70PvE
    - Level70PvP
    - SoloPvP
    - StandardPvE_Easy
    - StandardPvE_Hard
    - StandardPvE
    - StandardPvP_Easy
    - StandardPvP_Hard
    - StandardPVP
- name: SERVER_NAME
  description: Name of the server that will appear in the server list.
  default: V Rising Dedicated Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: DESCRIPTION
  description: Short description of server purpose, rules, and the message of the day.
  default: Welcome to the server!
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_PLAYERS
  description: Max number of concurrent players on the server.
  default: '40'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_ADMINS
  description: Max number of admins to allow connection even when the server is full.
  default: '4'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_PASSWORD
  description: Password required to join the server. Leave blank to have no password.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: SAVE_NAME
  description: Name of save file / directory.
  default: world1
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SAVE_COUNT
  description: Number of autosaves to keep.
  default: '50'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SAVE_INTERVAL
  description: Interval in seconds between each autosave.
  default: '600'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: LIST_STEAM
  description: Set to true to list on the Steam server list, else set to false.
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: LIST_EOS
  description: Set to true to list on the Epic Online Services server list, else set to false.
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: VALIDATE
  description: 'Leave empty (no value) for OFF or type "true" or "1" for ON. Validates all server files when Automatic Updates is enabled. Note: This will significantly increase server startup times, so it is recommended to only enable this when needed.'
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: FPS
  description: 'How often the server refreshes. (Default: 30)'
  default: '30'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: COMPRESS_SAVES
  description: Set to true to compress world save files, else set to false.
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: ENABLE_API
  description: Set to true to allow responses to public API requests to the server, else set to false.
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: RCON
  description: 'See the following link for info on how to connect and use RCON: https://github.com/StunlockStudios/vrising-dedicated-server-instructions#rcon'
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: RCON_PASS
  description: Password required to connect to RCON if it is enabled.
  default: somepassword
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: RCON_PORT
  description: Port used to connect to RCON. Must be allocated to the server for RCON to work.
  default: '25575'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: SERVER_SECURE
  description: (true or false)
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: ADMIN_ONLY_DEBUG_EVENTS
  description: (true or false)
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: DEBUG_EVENTS
  description: (true or false)
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: SRCDS_APPID
  description: Used for installation and updates. Rarely needs to be changed.
  default: '1829350'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINDOWS_INSTALL
  description: Tells the installer/updater to only download the Windows branch of the server (the only branch currently available) so that it can run on Wine. Cannot be changed.
  default: '1'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '1'
- name: WINEDEBUG
  description: Used to suppress WINE FIXME messages. Rarely needs to be changed.
  default: -all
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINEARCH
  description: Used for compatibility. Cannot be changed.
  default: win64
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - win64
- name: WINEPATH
  description: Used for compatibility. Cannot be changed.
  default: /home/container
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - /home/container
networking:
  ports:
  - name: '[REQUIRED] Server Query Port'
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  - name: '[Advanced] RCON Port'
    internal: '{{RCON_PORT}}'
    protocol: tcp
    required: true
    firewall_default: deny
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: rcon
    command: status
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
