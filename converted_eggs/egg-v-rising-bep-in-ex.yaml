metadata:
  id: v-rising-bepinex
  name: V Rising BepInEx
  version: PTDL_v2
  game: generic
  author: rehlmgaming@gmail.com
  description: Awaken as a vampire. Hunt for blood in nearby settlements to regain your strength and evade the scorching sun to survive. Raise your castle and thrive in an ever-changing open world full of mystery. Gain allies online and conquer the land of the living.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/yolks:wine_staging
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - WINEDLLOVERRIDES="winhttp=n,b"; xvfb-run wine ./VRisingServer.exe -persistentDataPath save-data -address 0.0.0.0
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n\r\n## File: Pterodactyl V Rising Egg - egg-v-rising.json\r\n## Authors: David Wolfe (Red-Thirten), Kapatheus\r\n## Date: 2022/05/28\r\n## License: MIT License\r\n## Image to install with is 'ghcr.io/parkervcp/installers:debian'\r\n\r\nclear\r\nRED='\\033[0;31m'\r\nGREEN='\\033[0;32m'\r\nYELLOW='\\033[1;33m'\r\nBLUE='\\033[0;34m'\r\nNC='\\033[0m'\r\n\r\n# Install packages. Default packages below are skipped if using image noted above, thus speeding up the install process.\r\napt -y update\r\napt -y --no-install-recommends install curl jq unzip wget\r\n# Download and install SteamCMD\r\necho -e \"${YELLOW}download and install steamcmd${NC}\"\r\n\r\nexport HOME=/mnt/server\r\ncd /tmp\r\nmkdir -p $HOME/steamcmd $HOME/steamapps\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C $HOME/steamcmd\r\ncd $HOME/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\n\r\n# Install game server using SteamCMD\r\necho -e \"${YELLOW}install V Rising with SteamCMD${NC}\"\r\n\r\n./steamcmd.sh +force_install_dir $HOME +login anonymous $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} +quit\r\n\r\n# Set up 32 and 64 bit libraries\r\nmkdir -p $HOME/.steam/sdk{32,64}\r\ncp -v linux32/steamclient.so $HOME/.steam/sdk32/steamclient.so\r\ncp -v linux64/steamclient.so $HOME/.steam/sdk64/steamclient.so\r\n\r\n# Enable BEPINEX (Credits to: https://github.com/ricin/vrising-bepinex-linux/blob/main/scripts/start-server.sh)\r\necho -e \"${YELLOW}installing BepInex${NC}\"\r\n\r\n#variables\r\nBEPINEX_VR_TS_URL=https://v-rising.thunderstore.io/package/BepInEx/BepInExPack_V_Rising/\r\nCUR_V=\"$(find ${HOME} -maxdepth 1 -name \"BepInEx-*\" | cut -d '-' -f2)\"\r\nBEPINEX_VR_API_DATA=\"$(curl -s -X GET https://thunderstore.io/c/v-rising/api/v1/package/b86fcaaf-297a-45c8-82a0-fcbd7806fdc4/ -H \"accept: application/json\")\"\r\nLAT_V=\"$(echo ${BEPINEX_VR_API_DATA} | jq -r '.versions[0].version_number')\"\r\n\r\nif [ -z \"${LAT_V}\" ] && [ -z \"${CUR_V}\" ]; then\r\n    echo -e \"${RED}Can't get latest version of BepInEx for V Rising!${NC}\"\r\n    echo -e \"${RED}Please try to run without BepInEx for V Rising. Exiting.${NC}\"\r\n    exit 1\r\nfi\r\n\r\nif [ -f ${HOME}/BepInEx.zip ]; then\r\n    rm -rf ${HOME}/BepInEx.zip\r\nfi\r\nif [ -f ${HOME}/doorstop_config.ini ]; then\r\n    sed -i \"/enabled=false/c\\enabled=true\" ${HOME}/doorstop_config.ini\r\nfi\r\n\r\necho -e \"${YELLOW}BepInEx for V Rising Version Check${NC}\"\r\necho -e \"${YELLOW}More info: ${BEPINEX_VR_TS_URL}${NC}\"\r\n\r\nBEPINEX_VR_TS_DOWNLOAD_URL=\"$(echo ${BEPINEX_VR_API_DATA} | jq -r '.versions[0].download_url')\"\r\nif [ -z \"${CUR_V}\" ]; then\r\n    echo -e \"${YELLOW}BepInEx for V Rising not found, downloading and installing v${LAT_V} ...${NC}\"\r\n    \r\n    cd ${HOME}\r\n    rm -rf ${HOME}/BepInEx-*\r\n    if wget -q -nc --show-progress --progress=bar:force:noscroll -O ${HOME}/BepInEx.zip --user-agent=Mozilla --content-disposition -E -c \"${BEPINEX_VR_TS_DOWNLOAD_URL}\" ; then\r\n        echo -e \"${GREEN}Successfully downloaded BepInEx for V Rising v${LAT_V}${NC}\"\r\n    else\r\n        echo -e \"${RED}Something went wrong, can't download BepInEx for V Rising v${LAT_V}. Exiting.${NC}\"\r\n        exit 1\r\n    fi\r\n    \r\n    mkdir -p /tmp/BepInEx\r\n    unzip -o ${HOME}/BepInEx.zip -d /tmp/BepInEx\r\n    if [ $? -eq 0 ];then\r\n        touch ${HOME}/BepInEx-${LAT_V}\r\n        cp -rf /tmp/BepInEx/BepInEx*/* ${HOME}/\r\n        cp /tmp/BepInEx/README* ${HOME}/README_BepInEx_for_VRising.txt\r\n        rm -rf ${HOME}/BepInEx.zip /tmp/BepInEx\r\n    else\r\n        echo -e \"${RED}Unable to unzip BepInEx archive! Exiting.${NC}\"\r\n        exit 1\r\n    fi\r\nelif [ \"$CUR_V\" != \"${LAT_V}\" ]; then\r\n    echo -e \"${YELLOW}Version missmatch, BepInEx v$CUR_V installed, downloading and installing v${LAT_V}  ...${NC}\"\r\n    \r\n    cd ${HOME}\r\n    rm -rf ${HOME}/BepInEx-$CUR_V\r\n    mkdir /tmp/Backup\r\n    cp -R ${HOME}/BepInEx/config /tmp/Backup/\r\n    if wget -q -nc --show-progress --progress=bar:force:noscroll -O ${HOME}/BepInEx.zip --user-agent=Mozilla --content-disposition -E -c \"${BEPINEX_VR_TS_DOWNLOAD_URL}\" ; then\r\n        echo -e \"${GREEN}Successfully downloaded BepInEx for V Rising v${LAT_V}${NC}\"\r\n    else\r\n        echo -e \"${RED}Unable to download BepInEx for V Rising v${LAT_V}. Exiting.${NC}\"\r\n        exit 1\r\n    fi\r\n    \r\n    unzip -o ${HOME}/BepInEx.zip -d /tmp/BepInEx \r\n    \r\n    if [ $? -eq 0 ];then\r\n        cp -rf /tmp/BepInEx/BepInEx*/* ${HOME}/\r\n        cp /tmp/BepInEx/README* ${HOME}/README_BepInEx_for_VRising.txt\r\n        touch ${HOME}/BepInEx-${LAT_V}\r\n        cp -R /tmp/Backup/config ${HOME}/BepInEx/\r\n        rm -rf ${HOME}/BepInEx.zip /tmp/BepInEx /tmp/Backup\r\n    else\r\n        echo -e \"${RED}Unable to unzip BepInEx archive! Exiting.${NC}\"\r\n        exit 1\r\n    fi\r\nelif [ \"${CUR_V}\" == \"${LAT_V}\" ]; then\r\n    echo -e \"${GREEN}BepInEx v$CUR_V up-to-date!${NC}\"\r\nfi\r\n\r\n## V Rising Setup\r\nmkdir -p $HOME/save-data/Settings && cd \"$_\"\r\ncat > ServerHostSettings.json << EOF\r\n{\r\n  \"Name\": \"${SERVER_NAME}\",\r\n  \"Description\": \"${DESCRIPTION}\",\r\n  \"Port\": ${SERVER_PORT},\r\n  \"QueryPort\": ${QUERY_PORT},\r\n  \"MaxConnectedUsers\": ${MAX_PLAYERS},\r\n  \"MaxConnectedAdmins\": ${MAX_ADMINS},\r\n  \"ServerFps\": ${FPS},\r\n  \"SaveName\": \"${SAVE_NAME}\",\r\n  \"Password\": \"${SERVER_PASSWORD}\",\r\n  \"Secure\": ${SERVER_SECURE},\r\n  \"ListOnMasterServer\": ${SERVER_LIST},\r\n  \"AutoSaveCount\": ${SAVE_COUNT},\r\n  \"AutoSaveInterval\": ${SAVE_INTERVAL},\r\n  \"GameSettingsPreset\": \"${GAME_SETTINGS_PRESET}\",\r\n  \"AdminOnlyDebugEvents\": ${ADMIN_ONLY_DEBUG_EVENTS},\r\n  \"DisableDebugEvents\": ${DEBUG_EVENTS},\r\n  \"Rcon\": {\r\n    \"Enabled\": ${RCON},\r\n    \"Password\": \"${RCON_PASS}\",\r\n    \"Port\": ${RCON_PORT}\r\n  }\r\n}\r\nEOF\r\n\r\necho -e \"${BLUE}-----------------------${NC}\"\r\necho -e \"${GREEN}Installation completed${NC}\"\r\necho -e \"${BLUE}-----------------------${NC}\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: QUERY_PORT
  description: UDP port for Steam server list features.
  default: '9877'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: AUTO_UPDATE
  description: Quickly checks for any server updates on startup, and updates if necessary.
  default: '1'
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: GAME_SETTINGS_PRESET
  description: What preset of game settings the server should run. Some settings may not apply after the save file is first created. Leave empty/null if you are using a single-player uploaded save or a custom ServerGameSettings.json file in the `~/save-data/Settings/` directory.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - ''
    - DuoPvP
    - HardcorePvP
    - Level30PvE
    - Level30PvP
    - Level50PvE
    - Level50PvP
    - Level70PvE
    - Level70PvP
    - SoloPvP
    - StandardPvE_Easy
    - StandardPvE_Hard
    - StandardPvE
    - StandardPvP_Easy
    - StandardPvP_Hard
    - StandardPVP
- name: SERVER_NAME
  description: Name of the server that will appear in the server list.
  default: V Rising Dedicated Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: DESCRIPTION
  description: Short description of server purpose, rules, and the message of the day.
  default: Welcome to the server!
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_PLAYERS
  description: Max number of concurrent players on the server.
  default: '40'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_ADMINS
  description: Max number of admins to allow connection even when the server is full.
  default: '4'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_PASSWORD
  description: Password required to join the server. Leave blank to have no password.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: SAVE_NAME
  description: Name of save file / directory.
  default: world1
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SAVE_COUNT
  description: Number of autosaves to keep.
  default: '50'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SAVE_INTERVAL
  description: Interval in seconds between each autosave.
  default: '600'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_LIST
  description: Set to true to list on the server list, else set to false.
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: VALIDATE
  description: 'Leave empty (no value) for OFF or type "true" or "1" for ON. Validates all server files when Automatic Updates is enabled. Note: This will significantly increase server startup times, so it is recommended to only enable this when needed.'
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: FPS
  description: 'How often the server refreshes. (Default: 30)'
  default: '30'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: RCON
  description: 'See the following link for info on how to connect and use RCON: https://github.com/StunlockStudios/vrising-dedicated-server-instructions#rcon'
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: RCON_PASS
  description: Password required to connect to RCON if it is enabled.
  default: somepassword
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: RCON_PORT
  description: Port used to connect to RCON. Must be allocated to the server for RCON to work.
  default: '25575'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: SERVER_SECURE
  description: (true or false)
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: ADMIN_ONLY_DEBUG_EVENTS
  description: (true or false)
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: DEBUG_EVENTS
  description: (true or false)
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: SRCDS_APPID
  description: Used for installation and updates. Rarely needs to be changed.
  default: '1829350'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINDOWS_INSTALL
  description: Tells the installer/updater to only download the Windows branch of the server (the only branch currently available) so that it can run on Wine. Cannot be changed.
  default: '1'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '1'
- name: WINEDEBUG
  description: ''
  default: -all
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINEPATH
  description: ''
  default: /home/container
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: XVFB
  description: ''
  default: '1'
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: WINETRICKS_RUN
  description: ''
  default: mono vcrun2022
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINEARCH
  description: ''
  default: win64
  required: true
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports:
  - name: '[REQUIRED] Server Query Port'
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  - name: '[Advanced] RCON Port'
    internal: '{{RCON_PORT}}'
    protocol: tcp
    required: true
    firewall_default: deny
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: rcon
    command: status
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
