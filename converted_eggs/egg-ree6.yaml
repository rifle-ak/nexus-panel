metadata:
  id: ree6
  name: Ree6
  version: PTDL_v2
  game: generic
  author: presti@presti.me
  description: All-in-one, open source and 100% free Discord Bot!
container:
  image: ghcr.io/pterodactyl/yolks:java_17
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: java
  args:
  - -Dnogui=true
  - -jar
  - Ree6.jar
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: BOT_TOKEN
  description: 'The token for your Discord bot. Learn how to obtain a token and configure your bot application properly here: https://jmusicbot.com/getting-a-bot-token/'
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: DAGPI_TOKEN
  description: Your Dagpi.xyz API-Token, for tweet image generation!
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: SENTRY_DSN
  description: Your Sentry DSN, for error reporting!
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: SPOTIFY_CLIENT_ID
  description: Spotify Application Configuration, used to parse Spotify Tracks/Playlists to YouTube search queries.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: SPOTIFY_CLIENT_SECRET
  description: Spotify Application Configuration, used to parse Spotify Tracks/Playlists to YouTube search queries.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: HEARTBEAT_URL
  description: The URL to the Heartbeat-Server
  default: none
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: HEARTBEAT_INTERVAL
  description: The interval between the heartbeats.
  default: '60'
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: AMARI_TOKEN
  description: Your Amari API-Token, for Amari Level imports!
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: TWITCH_CLIENT_ID
  description: Twitch Application Configuration, used for the StreamTools and Twitch Notifications.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: TWITCH_CLIENT_SECRET
  description: Twitch Application Configuration, used for the StreamTools and Twitch Notifications.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: TWITTER_BEARER
  description: Twitter Application Configuration, used for the Twitter Notifications.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: REDDIT_CLIENT_ID
  description: Reddit Application Configuration, used for the Reddit Notification.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: REDDIT_CLIENT_SECRET
  description: Reddit Application Configuration, used for the Reddit Notification.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: INSTAGRAM_USERNAME
  description: Instagram Application Configuration, used for the Instagram Notification.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: INSTAGRAM_PASSWORD
  description: Instagram Application Configuration, used for the Instagram Notification.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: DATABASE_USER
  description: Username for the SQL connection.
  default: root
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: DATABASE_DB
  description: Database for the SQL Connection
  default: root
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: DATABASE_PW
  description: Password for the SQL connection.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: DATABASE_PORT
  description: Port for the SQL connection.
  default: '3306'
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: DATABASE_TYP
  description: "The Typ of the Database Ree6 should use!\r\nPossible typs:\r\n- mariadb\r\n- sqlite\r\n- h2\r\n- postgres"
  default: sqlite
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - mariadb
    - sqlite
    - postgres
    - postregsql
    - h2
- name: DATABASE_FILE
  description: The location of the storagefile if sqlite is being used.
  default: storage/Ree6.db
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: DATABASE_POOL
  description: The Database connection pool size!
  default: '10'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: DATABASE_HOST
  description: The Host address of the Database connection.
  default: localhost
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: AI_TOKEN
  description: Your Authentication token that should be used in the AI API calls.
  default: OpenAI API-Token
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: AI_URL
  description: The URL that should receive the API calls.
  default: https://api.openai.com/v1/chat/completions
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: AI_MODEL
  description: The AI model that should be used in the API calls.
  default: gpt-3.5-turbo-0301
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MISC_STATUS
  description: The Activity status of the Bot that will be shown.
  default: ree6.de | %guilds% Servers. (%shard%)
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MISC_FEEDBACK
  description: The Channel Id of the Feedback channel.
  default: '0'
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MISC_OWNER
  description: The ID of the Bot Owner, this will be used internally on some checks.
  default: '321580743488831490'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MISC_INVITE
  description: The Invite link to invite the Bot.
  default: https://invite.ree6.de
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MISC_PREDEF
  description: The Information for the AI.
  default: You are Ree6 a Discord bot.
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MISC_SUPPORT
  description: The Url link for users to receive support.
  default: https://support.ree6.de
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MISC_WEB
  description: The Url to the Website of the Bot.
  default: https://ree6.de
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MISC_INTERFACE
  description: The Url to the Webinterface.
  default: https://cp.ree6.de
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MISC_RECORD
  description: The Url that uses can access to get their recording.
  default: https://cp.ree6.de/external/recording
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MISC_TWITCH
  description: The Url used to connect a Twitch Account with the Ree6 System.
  default: https://cp.ree6.de/external/twitch
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MISC_ADV
  description: The Advertisement in Embed Footers and the rest.
  default: powered by Tube-hosting
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MISC_NAME
  description: The Name of the Bot.
  default: Ree6
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MISC_SHARD
  description: The amount of shards that should be created.
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: SQL Port
    internal: '{{DATABASE_PORT}}'
    protocol: udp
    required: false
  - name: Support Link
    internal: '{{MISC_SUPPORT}}'
    protocol: udp
    required: false
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{DATABASE_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
