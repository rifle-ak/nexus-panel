metadata:
  id: singleplayer-tarkov
  name: Singleplayer Tarkov
  version: PTDL_v2
  game: ark
  author: dino@papertots.page
  description: The Stay in Tarkov project was born due to Battlestate Games' (BSG) reluctance to create the pure PvE version of Escape from Tarkov. The project's aim is simple, create a Cooperation PvE experience that retains progression.
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 4000
    max: 6000
    shares: 1024
  memory:
    min: 8Gi
    max: 16Gi
    swap: 512Mi
  disk:
    min: 50Gi
    io_priority: normal
startup:
  command: ./Aki.Server.exe
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: SPT_VERSION
  description: "Version of the SPT-AKI version to use, by git hash/tag\r\n\r\nSPT-AKI: https://dev.sp-tarkov.com/SPT-AKI/Server"
  default: 40b999d04c68f1f52ab152d163c086a1c50f489b
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SIT_VERSION
  description: "Version of the SIT co-op mod for the server. Use \"latest\" for latest release, or the github release/tag/hash.\r\n\r\nSITCoop: https://github.com/stayintarkov/SIT.Aki-Server-Mod"
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SIT_PACKAGE
  description: "Github package for the SIT Aki server co-op mod. \r\n\r\nSITCoop: https://github.com/stayintarkov/SIT.Aki-Server-Mod"
  default: stayintarkov/SIT.Aki-Server-Mod
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: SIT_NAME
  description: SIT mod release file's asset name.
  default: SITCoop.zip
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: GITHUB_USER
  description: Optional, a github username to use to avoid Github API rate limit
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: false
- name: GITHUB_OAUTH_TOKEN
  description: Optional, A Github OAuth token to use to avoid API rate limit.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: false
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
