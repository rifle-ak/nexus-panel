metadata:
  id: the-front
  name: The Front
  version: PTDL_v2
  game: generic
  author: eggs@goover.dev
  description: The Front is a survival open-world crafting shooter. You play the role of a resistance fighter sent back in time to stop the rise of a tyrannical empire.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/steamcmd:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./ProjectWar/Binaries/Linux/TheFrontServer
  args:
  - ProjectWar_Start?DedicatedServer
  - -server
  - -game
  - -log
  - -ServerTags="{{SRV_TAGS}}"
  - -UseSteamSocket={{STEAMSOCKET}}
  - -Port="{{SERVER_PORT}}"
  - -BeaconPort="{{BEACON_PORT}}"
  - -ShutDownServicePort="{{SHUTDOWN_PORT}}"
  - -QueryPort="{{QUERY_PORT}}"
  - -ConfigServerName="{{CFG_NAME}}"
  - -OutIPAddress={{SERVER_IP}}
  - -UserDir="/home/container/TheFrontManager/{{CFG_NAME}}/"
  - -ServerName="{{SRV_NAME}}"
  - -EnableParallelCharacterMovementTickFunction
  - -EnableParallelCharacterTickFunction
  - -UseDynamicPhysicsScene
  - -Game.PhysicsVehicle=false
  - -ansimalloc
  - -Game.MaxFrameRate=35
  - -MaxQueueSize=50
  - -QueueValidTime=120
  - -QueueThreshold={{MAX_PLAYERS}}
  - -ServerFightModeType={{GAMEMODE}}
  - -IsCanSelfDamage={{SELFDMG}}
  - -IsCanFriendDamage={{DMGALLIES}}
  - -SaveWorldInterval={{SRV_SAVETIME}}
  - -GMOverlapRatio=2
  - -GreenHand={{GREENHAND}}
  - -SensitiveWords={{SENSITIVE_WORDS}}
  - -UseACE={{ANTI_CHEAT}}
  - -ServerAdminAccounts={{SRV_ADMIN}}
  - -IsShowGmTitle={{ADMIN_LABEL}}
  - -ServerPassword={{SRV_PW}}
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\nclear\r\nRED='\\033[0;31m'\r\nGREEN='\\033[0;32m'\r\nYELLOW='\\033[1;33m'\r\nBLUE='\\033[0;34m'\r\nNC='\\033[0m'\r\n\r\necho -e \"${BLUE}-------------------------------------------------${NC}\"\r\necho -e \"${YELLOW}The Front  Installscript${NC}\"\r\necho -e \"${YELLOW}Egg by gOOvER | https://goover.dev${NC}\"\r\necho -e \"${BLUE}-------------------------------------------------${NC}\"\r\n\r\n#apt -y update\r\n#apt -y --no-install-recommends install curl lib32gcc-s1 ca-certificates jq dos2unix\r\n\r\necho -e \"${BLUE}-------------------------------------------------${NC}\"\r\necho -e \"${YELLOW}download and install steamcmd. please wait...${NC}\"\r\necho -e \"${BLUE}-------------------------------------------------${NC}\"\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\necho -e \"${GREEN}..done..${NC}\"\r\n\r\n## install game using steamcmd\r\necho -e \"${BLUE}-------------------------------------------------${NC}\"\r\necho -e \"${YELLOW}install game using steamcmd. please wait...${NC}\"\r\necho -e \"${BLUE}-------------------------------------------------${NC}\"\r\n\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update 1007 +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\necho -e \"${GREEN}..done..${NC}\"\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## install end\r\necho -e \"${BLUE}-------------------------------------------------${NC}\"\r\necho -e \"${GREEN}Installation completed...${NC}\"\r\necho -e \"${BLUE}-------------------------------------------------${NC}\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: SRV_NAME
  description: no spaces und special signs
  default: Pterodactyl hosted Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_PLAYERS
  description: The max number of players on your server.
  default: '10'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 1
    - 80
- name: CFG_NAME
  description: Name of the savefile. NO SPACE or SPECIAL signs
  default: new
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SRV_PW
  description: ''
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: GAMEMODE
  description: off = PvP; on = PvE
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: STEAMSOCKET
  description: Use Steam servers for network penetration. Enable this if you don't have a public IP but you want to allow players from outside your network to join your server. If disabled, only you and other players on your LAN can join. If you have a public IP, you do not need to enable this. Enabling this feature will affect latency. When Steam servers are busy, you may not be able to join this server.
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SELFDMG
  description: Allows players to damage themselves.
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: DMGALLIES
  description: Allows squadmates to damage each other.
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: SRV_ADMIN
  description: Enter a 17-digit Steam ID. Use semicolons between each ID. GM level defaults to highest level (Lv. 25)
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: ADMIN_LABEL
  description: Toggles special admin icon.
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: SRV_SAVETIME
  description: Server archive interval (in seconds)
  default: '300'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 150
    - 600
- name: GREENHAND
  description: When enabled, new characters will receive novice protection.
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: SRV_TAGS
  description: "MAX 5 -> \r\n\r\n0= PVP |   \r\n1= PVE | \r\n2= EXP Multiplikator |  \r\n3= GatheringRate |  \r\n4= KeepInventory |  \r\n5= 45d wipe |  \r\n6= 15d wipe |  \r\n7= 30d wipe |  \r\n8= 60d wipe |"
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: ANTI_CHEAT
  description: Toggles anticheat.
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: SENSITIVE_WORDS
  description: When disable, profanity will be blocked.
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: AUTO_UPDATE
  description: Autoupdate your Server on start/restart
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_APPID
  description: ''
  default: '2334200'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: BEACON_PORT
  description: port+1
  default: '27016'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: QUERY_PORT
  description: port+2
  default: '27017'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: SHUTDOWN_PORT
  description: port +3
  default: '27017'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: WINDOWS_INSTALL
  description: DO NOT REMOVE !!!
  default: '1'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports:
  - name: '[SERVER] BeaconPort'
    internal: '{{BEACON_PORT}}'
    protocol: udp
    required: true
  - name: '[SERVER] QueryPort'
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  - name: '[SERVER] ShutDownServicePort'
    internal: '{{SHUTDOWN_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{BEACON_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
