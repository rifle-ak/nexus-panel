metadata:
  id: neoforge
  name: NeoForge
  version: PTDL_v2
  game: minecraft
  author: glorantv@icloud.com
  description: NeoForge Server. NeoForge is a modding API (Application Programming Interface), which makes it easier to create mods, and also make sure mods are compatible with each other. NeoForge is a fork of Minecraft Forge.
  tags:
  - eula
  - java_version
  - pid_limit
container:
  image: ghcr.io/pterodactyl/yolks:java_17
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 2Gi
    max: 4Gi
    swap: 512Mi
  disk:
    min: 10Gi
    io_priority: normal
startup:
  command: java
  args:
  - -Xms128M
  - -XX:MaxRAMPercentage=95.0
  - -Dterminal.jline=false
  - -Dterminal.ansi=true
  - '@unix_args.txt'
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: MC_VERSION
  description: "The version of Minecraft you want to install for.\r\n\r\nLeaving latest will install the latest version."
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: NEOFORGE_VERSION
  description: "The full exact version.\r\n\r\nEx. 20.4.194 or 1.20.1-47.1.95\r\n\r\nOverrides MC_VERSION. If it fails to download the server files it will fail to install."
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: regex
    pattern: /^[0-9\.\-]+$/
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
