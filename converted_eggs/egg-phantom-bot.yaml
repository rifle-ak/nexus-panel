metadata:
  id: phantombot
  name: PhantomBot
  version: PTDL_v2
  game: generic
  author: mail@wuffy.eu
  description: PhantomBot is an actively developed open source interactive Twitch bot with a vibrant community that provides entertainment and moderation for your channel, allowing you to focus on what matters the most to you - your game and your viewers.
container:
  image: ghcr.io/parkervcp/yolks:java_16
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: java
  args:
  - --add-opens
  - java.base/java.lang=ALL-UNNAMED
  - -Djava.security.policy=config/security
  - -Dinteractive
  - -Xms1m
  - -Dfile.encoding=UTF-8
  - -jar
  - PhantomBot.jar
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: exit
      timeout: 30s
variables:
- name: RELEASE_VERSION
  description: "latest = Latest Stable\r\nmaster = latest Github\r\n3.9.0.7 = Latest known working with Java 16"
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: CHANNEL_NAME
  description: Enter the Twitch channel name where the bot will connect to
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: CHANNEL_OWNER
  description: ''
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BOT_TWITCH_USERNAME
  description: Please enter the bot's Twitch username
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WEBPANEL_USERNAME
  description: Please enter a custom username for the web panel
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WEBPANEL_PASSWORD
  description: Please enter a custom password for the web panel
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: YOUTUBE_API_KEY
  description: https://phantombot.dev/guides/#guide=content/integrations/youtubesetup
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: DISCORD_BOT_TOKEN
  description: https://phantombot.dev/guides/#guide=content/integrations/discordintegrationsetup
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
