metadata:
  id: ksp-dmp
  name: KSP DMP
  version: PTDL_v2
  game: ark
  author: rufanyin29@gmail.com
  description: Dark Multiplayer mod server for Kerbal Space Program
container:
  image: ghcr.io/parkervcp/yolks:mono_latest
  environment: {}
resources:
  cpu:
    min: 4000
    max: 6000
    shares: 1024
  memory:
    min: 8Gi
    max: 16Gi
    swap: 512Mi
  disk:
    min: 50Gi
    io_priority: normal
startup:
  command: mono
  args:
  - DMPServer.exe
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: /exit
      timeout: 30s
variables:
- name: MODPACKMODE
  description: Specify the modpack type.
  default: NONE
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - NONE
    - CKAN
    - GAMEDATA
- name: WARPMODE
  description: Specify the warp type.
  default: SUBSPACE
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - MCW_FORCE
    - MCW_VOTE
    - MCW_LOWEST
    - SUBSPACE_SIMPLE
    - SUBSPACE
    - NONE
- name: GAMEMODE
  description: Specify the game type.
  default: SANDBOX
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - SANDBOX
    - CAREER
    - SCIENCE
- name: DIFFICULTY
  description: Specify the gameplay difficulty of the server.
  default: NORMAL
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - EASY
    - NORMAL
    - MODERATE
    - HARD
    - CUSTOM
- name: WHITELIST
  description: Enable white-listing.
  default: 'False'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - 'True'
    - 'False'
- name: SERVERNAME
  description: Name of the server.
  default: DMP Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
