metadata:
  id: teaspeak
  name: TeaSpeak
  version: PTDL_v2
  game: generic
  author: parker@parkervcp.com
  description: "TeaSpeak is a free to use client and server software for VoIP communication.\r\n\r\nIts the ideal deal software for everyone who is annoyed about limits and restrictions."
container:
  image: ghcr.io/parkervcp/yolks:voice_teaspeak
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./TeaSpeakServer
  args:
  - --property:binding.query.port={{QUERY_PORT}}
  - --property:binding.file.port={{FILE_PORT}}
  - --property:voice.default_port={{SERVER_PORT}}
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: shutdown now
      timeout: 30s
variables:
- name: QUERY_PORT
  description: The query port for TeaSpeak
  default: '10101'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: FILE_PORT
  description: The TeaSpeak File Transfer Port
  default: '30303'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_MOTD
  description: The TeaSpeak Server MOTD
  default: TeaSpeak\n\rHosted on pterodactyl!
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: LD_LIBRARY_PATH
  description: Don't touch this if you want the server to start
  default: ./libs/
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: VERSION
  description: 'What version of teaspeak to install: latest = latest stable ; beta = latest beta'
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: Query Port
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  - name: File Transfer Port
    internal: '{{FILE_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{QUERY_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
