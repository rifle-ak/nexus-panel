metadata:
  id: atlbot
  name: ATLBot
  version: PTDL_v2
  game: generic
  author: jfeldt19@gmail.com
  description: "ATLbot in ptero\r\n\r\nhttps://github.com/ATLauncher/discord-bot/"
container:
  image: ghcr.io/parkervcp/yolks:node_16
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: npm
  args:
  - run
  - start
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: CLIENT_TOKEN
  description: Get a discord token at https://discordapp.com/developers/
  default: get_your_own_token_from_discord_
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: NODE_ENV
  description: "The node environment variable.\r\n\r\nNeeds to stay at \"development\" to log to console."
  default: development
  required: true
  secret: false
  user_editable: false
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
