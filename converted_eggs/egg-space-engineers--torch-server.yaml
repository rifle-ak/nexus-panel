metadata:
  id: space-engineers---torch-server
  name: Space Engineers - Torch Server
  version: PTDL_v2
  game: generic
  author: eggs@goover.dev
  description: "Torch is the successor to SE Server Extender and gives server admins the tools they need to keep their Space Engineers servers running smoothly. It features a user interface with live management tools and a plugin system so you can run your server exactly how you'd like. Torch is still in early development so there may be bugs and incomplete features.\r\n\r\n!!!!! DO NOT CANCEL THE FIRST START, OR YOU NEED TO DELETE THE SERVER AND CREATE FROM SCRATCH !!!!"
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/yolks:wine_latest
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - export WINEDLLOVERRIDES="mscoree=n,b;mshtml=n,b"; wine /home/container/Torch.Server.exe -noupdate -nogui -console
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# Installation Script\r\n#\r\n\r\n## Define variables\r\ndlurl=\"https://raw.githubusercontent.com/parkervcp/eggs/master/game_eggs/steamcmd_servers/space_engineers/default\"\r\n\r\n# Install packages. Default packages below are not required if using our existing install image thus speeding up the install process.\r\n#apt -y update\r\n#apt -y install curl lib32gcc-s1 ca-certificates unzip\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## Download Torch and unpack\r\ncd /mnt/server/\r\ncurl -sSL -o torch-server.zip https://build.torchapi.com/job/Torch/job/master/lastSuccessfulBuild/artifact/bin/torch-server.zip\r\nunzip -o torch-server.zip -d /mnt/server/\r\nrm -fR $HOME/torch-server.zip\r\n\r\n## Create world and Instance\r\nmkdir -p $HOME/Instance/Saves\r\nif [ ! -d $HOME/Instance/Saves/World ]\r\nthen\r\n    curl $dlurl/World.zip -o World.zip\r\n    unzip -o World.zip -d $HOME/Instance/Saves/\r\nfi\r\n\r\nif [ ! -f $HOME/Instance/SpaceEngineers-Dedicated.cfg ]; then \r\n   curl $dlurl/SpaceEngineers-Dedicated.cfg -o $HOME/Instance/SpaceEngineers-Dedicated.cfg;\r\nfi\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: SRCDS_APPID
  description: The ID corresponding to the game to download.
  default: '298740'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '298740'
- name: SERVER_NAME
  description: Name of the server, appears in Steam browser.
  default: A Pterodactyl hosted Space Engineer Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WORLD_NAME
  description: Name of your world (and of your save folder) DO NOT CHANGE THIS !!!!
  default: World
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: SERVER_DESC
  description: Description of the game
  default: A Pterodactyl hosted Space Engineer Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_MODE
  description: 'Game Mode setting: Survival, Creative'
  default: Survival
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - Survival
    - Creative
- name: MAX_PLAYERS
  description: ''
  default: '4'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SAVE_ENABLED
  description: ''
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: SAVE_INTERVAL
  description: Time between auto saves specified in minutes
  default: '5'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: STEAM_PORT
  description: Steam Port
  default: '8766'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: REMOTEAPI_ENABLE
  description: Enable Remote API
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: REMOTEAPI_PORT
  description: Remote API Port
  default: '8081'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WINEPREFIX
  description: WINEPREFIX
  default: /home/container/.wine
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINETRICKS_RUN
  description: ''
  default: vcrun2022 corefonts dotnet48
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINDOWS_INSTALL
  description: ''
  default: '1'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINEDEBUG
  description: ''
  default: -all
  required: true
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports:
  - name: Steam Port
    internal: '{{STEAM_PORT}}'
    protocol: udp
    required: true
  - name: Remote API Port
    internal: '{{REMOTEAPI_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{STEAM_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
