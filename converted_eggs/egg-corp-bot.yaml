metadata:
  id: corpbot
  name: CorpBot
  version: PTDL_v2
  game: generic
  author: parker@parkervcp.com
  description: "A very clumsy python bot for discord \r\n\r\nhttps://github.com/corpnewt/CorpBot.py"
container:
  image: ghcr.io/parkervcp/yolks:python_3.8
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: /usr/local/bin/python
  args:
  - Main.py
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: TOKEN
  description: Get your own token here - https://discordapp.com/developers/applications/
  default: GET_YOUR_OWN
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: PREFIX
  description: The prefix for commands from the bot.
  default: .
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
