metadata:
  id: viaaas
  name: VIAaaS
  version: PTDL_v2
  game: generic
  author: regulad@outlook.com
  description: VIAaaS - ViaVersion as a Service - Standalone ViaVersion proxy
  tags:
  - eula
  - java_version
  - pid_limit
container:
  image: ghcr.io/parkervcp/yolks:java_17
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: java
  args:
  - -Xms128M
  - -Xmx{{SERVER_MEMORY}}M
  - -jar
  - '{{SERVER_JARFILE}}'
  - -sslPort={{WEBSERVER_PORT}}
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: end
      timeout: 30s
variables:
- name: SERVER_JARFILE
  description: The name of the JAR file to be used when downloading & running VIAaaS.
  default: VIAaaS-all.jar
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WEBSERVER_PORT
  description: The port to listen to web server connections on.
  default: '25543'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: Web Server Port
    internal: '{{WEBSERVER_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{WEBSERVER_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
