metadata:
  id: crewlink-server
  name: Crewlink server
  version: PTDL_v2
  game: generic
  author: panel@oxtroit.com
  description: An egg designed to allow support for Proximity Chat in Among Us using CrewLink Server
container:
  image: ghcr.io/parkervcp/yolks:nodejs_16
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: yarn
  args:
  - start
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: BRANCH
  description: Set this to 'devel' if you wanna run a develop server.
  default: master
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: ADDRESS
  description: Domain of your server or ip of your server
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: NAME
  description: Specifiy the name of your Crewlink server
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: HTTPS
  description: Enables https. You must place privkey.pem and fullchain.pem in your CWD.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: SSLPATH
  description: Alternate path to SSL certificates.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: PORT
  description: Choose the port your server should run on
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: Port
    internal: '{{PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
