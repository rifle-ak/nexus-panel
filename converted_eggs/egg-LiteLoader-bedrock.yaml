metadata:
  id: liteloader-bedrock-dedicated-server
  name: Liteloader Bedrock Dedicated Server
  version: PTDL_v2
  game: generic
  author: frizth_tatierra@informatics.edu.ph
  description: "LiteLoaderBDS - Epoch-making & Cross-language Bedrock Dedicated Servers Plugin Loader\r\n\r\nLiteLoaderBDS is an unofficial plugin loader that provides basic API support for Bedrock Dedicated Server, with a massive API, lots of packed utility interfaces, a rich event system and powerful basic interface support."
container:
  image: ghcr.io/parkervcp/yolks:wine_staging
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./lae-ll-launcher
  args:
  - bedrock_server_mod.exe
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: BDS_VERSION
  description: Insert BDS Version
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: LL_VERSION
  description: Insert Liteloader Version from Github Releases
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WINEDEBUG
  description: ''
  default: -all
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: SERVERNAME
  description: The name for the server
  default: Bedrock Dedicated Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: GAMEMODE
  description: 'Allowed values: "survival", "creative", or "adventure"'
  default: survival
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: DIFFICULTY
  description: 'Allowed values: "peaceful", "easy", "normal", or "hard"'
  default: easy
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MAXPLAYERS
  description: Maximum players to join on the server
  default: '10'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WORLDNAME
  description: World/Level name to use for the server
  default: Bedrock level
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
