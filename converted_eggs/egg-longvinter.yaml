metadata:
  id: longvinter
  name: Longvinter
  version: PTDL_v2
  game: generic
  author: tueye@tuworld.de
  description: Longvinter is a multiplayer, third-person sandbox game that implements Crafting, Farming, Building, Trading, and PVP.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: /home/container/longvinter-linux-server/Longvinter/Binaries/Linux/LongvinterServer-Linux-Shipping
  args:
  - Longvinter
  - -Port={{SERVER_PORT}}
  - -QueryPort={{QUERY_PORT}}
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n\r\n# File: Pterodactyl Longvinter Egg - egg-longvinter.json\r\n# Authors: TuEye\r\n# Date: 2022/05/15\r\n# License: MIT License\r\n\r\n\r\n## Install Git LFS\r\ncurl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | bash\r\napt -y install git-lfs\r\n\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit\r\n\r\n\r\n# Set up 32 and 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk{32,64}\r\ncp -v linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so\r\ncp -v linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so\r\n\r\n## Longvinter setup\r\n# If not using auto update and gamedir exist, remove it\r\nif [ ! \"${AUTO_UPDATE}\" ] && [ -d \"$HOME/longvinter-linux-server\" ]; then\r\n    echo -e \"\\nDelete game dir\\n\"\r\n    rm -r $HOME/longvinter-linux-server\r\nfi\r\n\r\n# Clone Longvinter Dedicated Server repo or do auto update if activated\r\ncd $HOME\r\nif [ ! -d \"$HOME/longvinter-linux-server\" ]; then\r\n    git clone \"https://github.com/Uuvana-Studios/longvinter-linux-server.git\"\r\nelif [ \"${AUTO_UPDATE}\" ]; then\r\n    echo -e \"\\nUpdating gamefiles\\n\"\r\n    cd $HOME/longvinter-linux-server\r\n    git config pull.rebase false\r\n    git restore .\r\n    git stash\r\n    git pull \"https://github.com/Uuvana-Studios/longvinter-linux-server.git\" main\r\nfi\r\nchmod -R ugo+rwx $HOME/longvinter-linux-server/\r\n\r\n\r\n# Create base config if not exist\r\nif [ ! -f $HOME/longvinter-linux-server/Longvinter/Saved/Config/LinuxServer/Game.ini ]; then\r\n    echo -e \"\\nCreating game config\\n\"\r\n    cp $HOME/longvinter-linux-server/Longvinter/Saved/Config/LinuxServer/Game.ini.default $HOME/longvinter-linux-server/Longvinter/Saved/Config/LinuxServer/Game.ini\r\n    if ! grep -q \"ServerTag=\" \"$HOME/longvinter-linux-server/Longvinter/Saved/Config/LinuxServer/Game.ini\"; then\r\n        sed -i '/^ServerName=.*/a ServerTag=Default' $HOME/longvinter-linux-server/Longvinter/Saved/Config/LinuxServer/Game.ini\r\n    fi\r\nfi\r\n\r\necho -e \"\\nLongvinter Dedicated Server successfully installed!\\n\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: SERVER_NAME
  description: Name of the server, appears in Game browser.
  default: Pterodactyl Longvinter Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_TAG
  description: "It's the tag that allows for easier search of the server. Please don't use the word OFFICIAL on it. \r\nAnd only place one tag."
  default: Pterodactyl
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_PLAYERS
  description: Maximum allowed players that can connect at any given time.
  default: '32'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_MOTD
  description: Server message that is on a signs around the island.
  default: Welcome to Pterodactyl Island!
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_PASSWORD
  description: Add you password here. Use only number and letters. If left empty there is no password on the server.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: COMMUNITY_WEBSITE
  description: Allows you to promote a website on a same place where the server message is shown. This link can be opened in-game.
  default: pterodactyl.io
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: ADMIN_ID
  description: "Here you can add all the admins that you want to have in the server. If you want to add multiple separate the ID's with single space.\r\nThe ID is found in-game under Options > General."
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: regex
    pattern: /^([a-z0-9]{32} ?)*$/
- name: ENABLE_PVP
  description: Here you write true or false if you want to enable/disable Player versus Player fights.
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: ENABLE_TENTDECAY
  description: Here you write true or false if you want to enable/disable tent decay to make sure there isn't an abundant number of abandoned tents in the server.
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: MAX_TENTS
  description: Maximum allowed of tents that players that can place in the server
  default: '2'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: AUTO_UPDATE
  description: Updates gamefiles when reinstalling. Otherwise the server is freshly installed and you will loose your savegames.
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: QUERY_PORT
  description: Query port used by steam
  default: '27015'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: SRCDS_APPID
  description: ''
  default: '1007'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '1007'
networking:
  ports:
  - name: Query Port
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{QUERY_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
