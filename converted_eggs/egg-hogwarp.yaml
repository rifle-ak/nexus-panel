metadata:
  id: hogwarp
  name: Hogwarp
  version: PTDL_v2
  game: generic
  author: imkringle@proton.me
  description: 'A Pterodactyl egg for the Hogwarts Legacy mod Hogwarp - For more info see their Nexus: https://www.nexusmods.com/hogwartslegacy/mods/1378'
container:
  image: ghcr.io/parkervcp/yolks:wine_staging
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - export WINEDLLOVERRIDES="mscoree=n,b;mshtml=n,b"; wine HogWarpServer.exe
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: WINETRICKS_RUN
  description: ''
  default: dotnet7
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: API_KEY
  description: "A API required to boot - https://presence.hogwarp.com/login\r\n- If not set on install it will fail. Set API Key then Reinstall Files"
  default: CHANGEME
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: SERV_NAME
  description: A name that displays on the Hogwarp list
  default: Ptero Hogwarp Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WINEARCH
  description: Arch type for Wine
  default: win64
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: MAX_PLAYERS
  description: "Max players for a server, this depends on your Patreon level for Hogwarp\r\nhttps://www.patreon.com/tiltedphoques - ( 4, 8, 16, No Limit ) In that order."
  default: '4'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERV_ICON
  description: The icon that displays on Hogwarps multiplayer listing
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: SERV_DESC
  description: The description that shows on the Multiplayer list
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: DOWNLOAD_URL
  description: "URL to pull the files from\r\n- Files can be found in their Discord (https://discord.com/invite/hogwarp). Default URL will pull from there as well\r\n- These files can be outdated! Be sure to check for an update in the event it has a version mismatch with the client."
  default: https://cdn.discordapp.com/attachments/1076580539751993444/1118295980597575810/Server.zip
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINEDEBUG
  description: ''
  default: -all
  required: false
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
