metadata:
  id: tshock-legacy
  name: tshock legacy
  version: PTDL_v2
  game: terraria
  author: parker@parkervcp.com
  description: "The t-shock modded terraria server.\r\n\r\nhttps://tshock.co/"
container:
  image: ghcr.io/parkervcp/yolks:mono_latest
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: mono
  args:
  - TerrariaServer.exe
  - -ip
  - 0.0.0.0
  - -port
  - '{{SERVER_PORT}}'
  - -maxplayers
  - '{{MAX_PLAYERS}}'
  - -world
  - '{{WORLD_NAME}}.wld'
  - -autocreate
  - '{{WORLD_SIZE}}'
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: exit
      timeout: 30s
variables:
- name: MAX_PLAYERS
  description: The maximum number of players a server will hold.
  default: '8'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: WORLD_SIZE
  description: Defines the worlds size. 3 sizes 1 (small), 2 (medium), 3 (large).
  default: '1'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: WORLD_NAME
  description: The name for the world file.
  default: world
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: TSHOCK_VERSION
  description: "The version on tshock that will be installed. \r\n\r\nLatest available is: v4.5.18!"
  default: v4.5.18
  required: true
  secret: false
  user_editable: false
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
