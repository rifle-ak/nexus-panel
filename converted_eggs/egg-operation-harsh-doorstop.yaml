metadata:
  id: operation-harsh-doorstop
  name: Operation Harsh Doorstop
  version: PTDL_v2
  game: generic
  author: josdekurk@gmail.com
  description: 'Operation: Harsh Doorstop is an Unreal Engine powered shooter sandbox similar to mod-friendly games like Ravenfield and Garry''s Mod but with roots in tactical shooters like Squad and Arma III. Our game is entirely donation funded, completely free, and has full Steam workshop support!'
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/steamcmd:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./HarshDoorstop/Binaries/Linux/HarshDoorstopServer-Linux-Shipping
  args:
  - HarshDoorstop
  - AAS-TestMap?MaxPlayers={{MAX_PLAYERS}}
  - -SteamServerName="{{SERVER_NAME}}"
  - -Port={{SERVER_PORT}}
  - -MULTIHOME=0.0.0.0
  - -QueryPort={{QUERY_PORT}}
  - -RCONPort={{RCON_PORT}}
  - -EnableRCON
  - -RCONMaxAuthAttempts={{RCON_MAX_AUTH_ATTEMPTS}}
  - -RCONPassword="{{RCON_PASSWORD}}"
  - -RCONMaxActiveConnections={{RCON_MAX_CONNECTIONS}}
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n# Image to install with is 'ghcr.io/parkervcp/installers:debian'\r\n\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} validate +quit\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## add below your custom commands if needed\r\nmkdir -p /mnt/server/HarshDoorstop/Saved/Config/LinuxServer/\r\ncd /mnt/server/HarshDoorstop/Saved/Config/LinuxServer/\r\ntouch Game.ini\r\ntee -a mnt/server/HarshDoorstop/Saved/Config/LinuxServer/Game.ini << END\r\n[/Script/RCON.RCONServerSystem]\r\nbEnabled=True\r\nListenPort=7779\r\nPassword=\"LetMeIn\"\r\nMaxActiveConnections=5\r\nMaxAuthAttempts=3\r\n\r\n[/Script/Engine.GameSession]\r\nMaxPlayers=32\r\nServerName=\"My Awesome Server\"\r\nPassword=\"cookies\"\r\nEND\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: AUTO_UPDATE
  description: Auto update the server on startup
  default: '1'
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_APPID
  description: ''
  default: '950900'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '950900'
- name: MAX_PLAYERS
  description: Maximum number of players allowed by this server.
  default: '32'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: SERVER_NAME
  description: Defines the display or host name of the game server when listed in a server browser
  default: Harsh Doorstop Dedicated Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: QUERY_PORT
  description: Defines port for Steam master server traffic
  default: '27005'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: RCON_PORT
  description: Defines port for RCON server traffic
  default: '7779'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: RCON_MAX_AUTH_ATTEMPTS
  description: Defines the maximum number of authentication attempts an RCON connection can make before being forcibly disconnected
  default: '3'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: RCON_PASSWORD
  description: Defines the password used for authenticating with the RCON server
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: RCON_MAX_CONNECTIONS
  description: Maximum number of concurrent RCON connections
  default: '5'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: Query port
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  - name: Rcon Port
    internal: '{{RCON_PORT}}'
    protocol: tcp
    required: true
    firewall_default: deny
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: rcon
    command: status
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
