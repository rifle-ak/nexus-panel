metadata:
  id: the-forest
  name: The Forest
  version: PTDL_v2
  game: generic
  author: admin@softwarenoob.com
  description: As the lone survivor of a passenger jet crash, you find yourself in a mysterious forest battling to stay alive against a society of cannibalistic mutants. Build, explore, survive in this terrifying first-person survival horror simulator.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/yolks:wine_latest
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - 'winetricks sound=disabled; xvfb-run --auto-servernum --server-args=''-screen 0 640x480x24:32'' wine ./TheForestDedicatedServer.exe -batchmode -nographics -serverPasswordAdmin {{ADMIN_PASS}} -inittype {{INIT_TYPE}} -nosteamclient -savefolderpath /home/container/TheForestDedicatedServer_Data -configfilepath /home/container/TheForestDedicatedServer_Data/forest/config/config.cfg |grep -v ''RenderTexture.Create failed: format unsupported - 2.'''
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n# Image to install with is 'ghcr.io/parkervcp/installers:debian'\r\n\r\n##\r\n#\r\n# Variables\r\n# STEAM_USER, STEAM_PASS, STEAM_AUTH - Steam user setup. If a user has 2fa enabled it will most likely fail due to timeout. Leave blank for anon install.\r\n# WINDOWS_INSTALL - if it's a windows server you want to install set to 1\r\n# SRCDS_APPID - steam app id found here - https://developer.valvesoftware.com/wiki/Dedicated_Servers_List\r\n# SRCDS_BETAID - beta branch of a steam app. Leave blank to install normal branch\r\n# SRCDS_BETAPASS - password for a beta branch should one be required during private or closed testing phases.. Leave blank for no password.\r\n# INSTALL_FLAGS - Any additional SteamCMD  flags to pass during install.. Keep in mind that steamcmd auto update process in the docker image might overwrite or ignore these when it performs update on server boot.\r\n# AUTO_UPDATE - Adding this variable to the egg allows disabling or enabling automated updates on boot. Boolean value. 0 to disable and 1 to enable.\r\n#\r\n ##\r\n\r\n# Install packages. Default packages below are not required if using our existing install image thus speeding up the install process.\r\n#apt -y update\r\n#apt -y --no-install-recommends install curl lib32gcc-s1 ca-certificates\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## add below your custom commands if needed\r\n\r\n## Create Config\r\n\r\nmkdir -p $HOME/TheForestDedicatedServer_Data/forest/config/\r\n#rm -fR $HOME/TheForestDedicatedServer_Data/forest/config/config.cfg\r\ncat <<EOT > $HOME/TheForestDedicatedServer_Data/forest/config/config.cfg\r\n// Dedicated Server Settings.\r\n// Server IP address - Note: If you have a router, this address is the internal address, and you need to configure ports forwarding, append the current game port here as well\r\nserverIP\r\n// Steam Communication Port - Note: If you have a router you will need to open this port.\r\nserverSteamPort\r\n// Game Communication Port - Note: If you have a router you will need to open this port.\r\nserverGamePort\r\n// Query Communication Port - Note: If you have a router you will need to open this port.\r\nserverQueryPort\r\n// Server display name\r\nserverName\r\n// Maximum number of players\r\nserverPlayers 5\r\n// Server password. blank means no password\r\nserverPassword\r\n// Your Steam account name. blank means anonymous (see Steam server account bellow)\r\nserverSteamAccount\r\n// Enable VAC (Valve Anti Cheat) on the server. off by default, uncomment to enable\r\nenableVAC on\r\n// Time between server auto saves in minutes\r\nserverAutoSaveInterval 15\r\n// Game difficulty mode. Must be set to \"Peaceful\" \"Normal\" or \"Hard\"\r\ndifficulty Normal\r\n// New or continue a game. Must be set to \"New\" or \"Continue\"\r\ninitType New\r\n// Slot to save the game. Must be set 1 2 3 4 or 5\r\nslot 1\r\n// Show event log. Must be set \"off\" or \"on\"\r\nshowLogs off\r\n// Contact email for server admin\r\nserverContact email@gmail.com\r\n// No enemies. Must be set to \"on\" or \"off\"\r\nveganMode off\r\n// No enemies during day time. Must be set to \"on\" or \"off\"\r\nvegetarianMode off\r\n// Reset all structure holes when loading a save. Must be set to \"on\" or \"off\"\r\nresetHolesMode off\r\n// Regrow 10% of cut down trees when sleeping. Must be set to \"on\" or \"off\"\r\ntreeRegrowMode off\r\n// Allow building destruction. Must be set to \"on\" or \"off\"\r\nallowBuildingDestruction on\r\n// Allow enemies in creative games. Must be set to \"on\" or \"off\"\r\nallowEnemiesCreativeMode off\r\n// Allow clients to use the built in development console. Must be set to \"on\" or \"off\"\r\nallowCheats off\r\n// Allows defining a custom folder for save slots, leave empty to use the default location\r\nsaveFolderPath\r\n// Target FPS when no client is connected\r\ntargetFpsIdle 5\r\n// Target FPS when there is at least one client connected\r\ntargetFpsActive 60\r\nEOT\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: SRCDS_APPID
  description: The ID corresponding to the game to download.
  default: '556450'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: SERVER_NAME
  description: Name of the server, appears in Steam browser.
  default: Pterodactyl Forest Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: STEAM_PORT
  description: Steam port
  default: '8766'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: QUERY_PORT
  description: Query port, this port is also used for connecting to the server
  default: '27016'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: MAX_PLAYERS
  description: Server player cap
  default: '10'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: SERVER_DIFFICULTY
  description: Server difficulty setting, Peaceful, Normal or Hard.
  default: Normal
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - Peaceful
    - Normal
    - Hard
- name: STEAM_ACC
  description: "The Steam Account Token is required for the server to save player progress. Use APP ID 242760 for the token generation. \r\n\r\nYou can generate the token on steam at https://steamcommunity.com/dev/managegameservers"
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: SERVER_PASS
  description: Password protects the server if set, any player must enter the password to join
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: ADMIN_PASS
  description: A password that will be used to gain admin access to the server in-game
  default: cHanGetHePaSwWord
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: VAC
  description: ''
  default: off
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WINDOWS_INSTALL
  description: This is required to install the correct Forest version. Removing or touching this will overwrite the files with a non-existing Linux releases.
  default: '1'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '1'
- name: AUTO_UPDATE
  description: 0 disables auto-update on each server startup, while 1 enables it.
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WINEDEBUG
  description: don't change this !!!
  default: -all
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINEARCH
  description: ''
  default: win64
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: INIT_TYPE
  description: "Init Type when starting server. \r\nNew to start fresh or Continue to preload the saved game"
  default: New
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - New
    - Continue
networking:
  ports:
  - name: Steam Port
    internal: '{{STEAM_PORT}}'
    protocol: udp
    required: true
  - name: '[Connection Port] Query Port'
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{STEAM_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
