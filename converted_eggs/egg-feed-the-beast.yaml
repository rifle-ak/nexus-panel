metadata:
  id: feed-the-beast
  name: Feed the Beast
  version: PTDL_v2
  game: generic
  author: aevum@decess.us
  description: Egg to handle all official FTB Modpacks
  tags:
  - eula
  - java_version
  - pid_limit
container:
  image: ghcr.io/parkervcp/yolks:java_8
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: java
  args:
  - -Xms128M
  - -Xmx{{SERVER_MEMORY}}M
  - -jar
  - FTBserv*.jar
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: MODPACK_URL
  description: "Name of the modpack as referenced in URL's on feed-the-beast.com\r\ni.e\r\nhttps://www.feed-the-beast.com/projects/<MODPACK_URL>"
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: regex
    pattern: ([a-z-0-9]+$)
- name: MODPACK_VERSION
  description: Version of the modpack to use.
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: LEVEL_SEED
  description: Optional specified level seed for map generation
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_PLAYERS
  description: 'Max # of players on the server'
  default: '20'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: LEVEL_NAME
  description: Name of the world save
  default: world
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MOTD
  description: Message to appear when viewing the server in browser and on login
  default: A Minecraft Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
