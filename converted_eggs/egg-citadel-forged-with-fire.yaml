metadata:
  id: citadel-forged-with-fire
  name: 'Citadel: Forged with Fire'
  version: PTDL_v2
  game: generic
  author: eggs@goover.dev
  description: 'Citadel: Forged With Fire is a massive online sandbox RPG set in the mystical world of Ignus. Featuring magic, spellcasting, building, exploring and crafting as you fight to make a name for yourself and achieve notoriety across the land.'
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/games:source
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./CitadelServer.sh
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n\r\n## just in case someone removed the defaults.\r\nif [ \"${STEAM_USER}\" == \"\" ]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} +app_update ${SRCDS_APPID} ${EXTRA_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n##Copy steamclient.so to correct Dir\r\nmkdir -p $HOME/Citadel/Plugins/UWorks/Source/ThirdParty/Linux\r\nchmod -R a+w,a+x $HOME/Citadel/Plugins/UWorks/Source/ThirdParty/Linux\r\nif [[ ! -f $HOME/Citadel/Plugins/UWorks/Source/ThirdParty/Linux/steamclient.so ]]; then \r\n\tln -s ../../../../../../linux64/steamclient.so $HOME/Citadel/Plugins/UWorks/Source/ThirdParty/Linux/steamclient.so\r\n\r\nfi\r\n\r\n## Create Game.ini\r\nmkdir $HOME/Config\r\n\r\nif [[ -d $HOME/Citadel/Saved/Config/LinuxServer ]]; then \r\n\trm -rf $HOME/Citadel/Saved/Config/LinuxServer\r\nfi\r\n\r\nif [[ -d $HOME/Engine/Saved/Config/LinuxServer ]]; then \r\n\trm -rf $HOME/Engine/Saved/Config/LinuxServer\r\nfi\r\n\r\nmkdir -p $HOME/Citadel/Saved/Config\r\nmkdir -p $HOME/Engine/Saved/Config\r\n\r\nln -s ../../../Config $HOME/Citadel/Saved/Config/LinuxServer\r\nln -s ../../../Config $HOME/Engine/Saved/Config/LinuxServer\r\n\r\n#rm -fR $HOME/Citadel/Saved/Config/LinuxServer/Game.ini\r\ncat <<EOT > $HOME/Config/Game.ini\r\n[UWorks]\r\nConnectionPort=7777\r\nQueryPort=27015\r\n\r\n[/Script/Citadel.SocialManager]\r\nPassword=changeme\r\n\r\n[/Script/Citadel.CitadelGameInstance]\r\nWorldCreationSettings=(ServerName=\"CitadelServer\",Password=\"YourServerPassword\",ServerType=PVP,PlayerLimit=20,bPrivate=true,ExperienceMultiplier=1.000000,InventoryCapacityMultipler=1.000000,KnowledgePointEarnedMultiplier=1.000000,CharacterPointEarnedMultiplier=1.000000,bUnlimitedResources=false,PlayerDamageMultiplier=1.000000,ArmorMultiplier=1.000000,BaseManaRegen=1.000000,bInventoryWeightRestrictions=true,MagicFindMultiplier=1.000000,CraftingMagicFindChanceMultiplier=1.000000,FlyingCostMultiplier=1.000000,FlyingSpeedMultiplier=1.000000,ResourceCollectionMultiplier=1.000000,StructureDamageMultiplier=1.000000,bRespectNoBuildZones=true,MagicStructureManaRegenerationMultiplier=1.000000,MagicStructureManaConsumptionMultiplier=0.000000,bFreeBuildMode=false,TimeOfDayLock=Auto,NPCPopulationMultiplier=1.000000,StructureDecayMultiplier=2.000000,bThronesDecay=true)\r\nEOT\r\n\r\nchmod +x $HOME/CitadelServer.sh\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: SRCDS_APPID
  description: ID
  default: '489650'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '489650'
- name: QPORT
  description: port
  default: '27015'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: ADMIN_PASSWD
  description: ''
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: AUTO_UPDATE
  description: 1 = on; 0 = off
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: Query Port
    internal: '{{QPORT}}'
    protocol: tcp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{QPORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
