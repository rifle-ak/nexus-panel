metadata:
  id: assaultcube
  name: AssaultCube
  version: PTDL_v2
  game: generic
  author: holeintheseat@gmail.com
  description: "AssaultCube is a FREE, multiplayer, first-person shooter game, based on the CUBE engine.\r\n\r\nTaking place in realistic environments, with fast, arcade gameplay, it's addictive and fun!"
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./bin_unix/linux_64_server
  args:
  - -Y{{ASSAULT_SERVER_KEY}}
  - -n"{{ASSAULT_SERVER_DESCRIPTION}}"
  - -o"{{ASSAULT_SERVER_MOTD}}"
  - -c{{ASSAULT_SERVER_MAXPLAYERS}}
  - -x{{ASSAULT_SERVER_ADMINPASSWORD}}
  - -f{{SERVER_PORT}}
  - -p{{ASSAULT_SERVER_PLAYERPASSWORD}}
  - -m{{ASSAULT_SERVER_MASTERSERVER}}
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: ASSAULT_SERVER_KEY
  description: "You must provide your own key for the server to register on the masterserver.\r\nTo generate a key you can run the client and issue the command:\r\n\r\n            authkey new server \r\n        \r\nSee: (https://assault.cubers.net/docs/server.html)"
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: ASSAULT_SERVER_DESCRIPTION
  description: ''
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: ASSAULT_SERVER_MOTD
  description: ''
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: ASSAULT_SERVER_MAXPLAYERS
  description: Set the limit on amount of players able to join (MAX 16)
  default: '16'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: ASSAULT_SERVER_ADMINPASSWORD
  description: ''
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: ASSAULT_SERVER_PLAYERPASSWORD
  description: Password need to join the server.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: ASSAULT_SERVER_MASTERSERVER
  description: "Forces the server to register with the hostname or IP address of a different masterserver.\r\nThe default is ms.cubers.net\r\nIf you want your server to be hidden and not report to the masterserver, use -mlocalhost"
  default: ms.cubers.net
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: VERSION
  description: The version of the engine you want to download.
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
