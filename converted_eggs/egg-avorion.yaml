metadata:
  id: avorion
  name: Avorion
  version: PTDL_v2
  game: generic
  author: iamkubi@gmail.com
  description: A procedural co-op space sandbox where players can build their own space ships out of dynamically scalable blocks. Fight epic space battles, explore, mine, trade, wage wars and build your own empire to save your galaxy from being torn apart by an unknown enemy.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/steamcmd:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./bin/AvorionServer
  args:
  - --galaxy-name
  - '{{GALAXY_NAME}}'
  - --admin
  - '{{ADMIN_ID}}'
  - --datapath
  - galaxy
  - --port
  - '{{SERVER_PORT}}'
  - --query-port
  - '{{QUERY_PORT}}'
  - --steam-master-port
  - '{{STEAM_MASTER_PORT}}'
  - --steam-query-port
  - '{{STEAM_QUERY_PORT}}'
  - --max-players
  - '{{MAX_PLAYERS}}'
  - --difficulty
  - '{{DIFFICULTY}}'
  - --collision-damage
  - '{{COLLISION_DMG}}'
  - --save-interval
  - '{{SAVE_INTERVAL}}'
  - --same-start-sector
  - '{{SAME_START_SECTOR}}'
  - --server-name
  - '"{{SERVER_NAME}}"'
  - --threads
  - '{{GAME_THREADS}}'
  - --listed
  - '{{SERVER_LISTED}}'
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# Avorion Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n\r\nmkdir -p /mnt/server/backups\r\nmkdir -p /mnt/server/galaxy/${GALAXY_NAME}\r\ncurl https://raw.githubusercontent.com/parkervcp/eggs/master/game_eggs/steamcmd_servers/avorion/server.ini --output /mnt/server/galaxy/${GALAXY_NAME}/server.ini\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: /stop
      timeout: 30s
variables:
- name: GALAXY_NAME
  description: Name of the Galaxy to create
  default: Avorion
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_NAME
  description: The name of the server, shown in the server list.
  default: Avorion Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: ADMIN_ID
  description: Steam64 ID for the player to make Server Admin
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_PLAYERS
  description: Maximum number of players allowed
  default: '10'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: DIFFICULTY
  description: 'Difficulty of the server, allowed values are: -3, -2, -1, 0, 1, 2, 3 Default: 0'
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - '0'
    - '1'
    - '2'
    - '3'
    - '-1'
    - '-2'
    - '-3'
- name: COLLISION_DMG
  description: 'A multiplier for damage to colliding objects. Accepts floating-point numbers, e.g. 0.5 is 50% collision damage. 0: no damage, 1: full damage. default: 1'
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SAVE_INTERVAL
  description: Time between automatic saves in seconds.  Defaults to 300 (5 minutes).
  default: '300'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SAME_START_SECTOR
  description: Indicates if all players should start in the same sector. If false, a random empty sector on the outer rim is populated and used as the home sector for each new player.
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: GAME_THREADS
  description: Number of concurrent threads that are used to update sectors. (Identical to the 'Threads' setting ingame.)
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_LISTED
  description: Privacy setting. If enabled together with useSteam, the server will show up in public server lists. (Same as the ingame setting 'List Publicly')
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: SRCDS_APPID
  description: ''
  default: '565060'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '565060'
- name: LD_LIBRARY_PATH
  description: ''
  default: ./linux64
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: STEAM_MASTER_PORT
  description: ''
  default: '27021'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: STEAM_QUERY_PORT
  description: ''
  default: '27020'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: QUERY_PORT
  description: ''
  default: '27003'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: AUTO_UPDATE
  description: 1 = on; 0 = off
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_BETAID
  description: Leave empty for the public branch, beta for the beta branch.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - ''
    - beta
networking:
  ports:
  - name: Steam Master Port
    internal: '{{STEAM_MASTER_PORT}}'
    protocol: udp
    required: true
  - name: Steam Query Port
    internal: '{{STEAM_QUERY_PORT}}'
    protocol: tcp
    required: true
  - name: Query Port
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{STEAM_MASTER_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
