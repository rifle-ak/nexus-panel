metadata:
  id: owncastonline
  name: owncast.online
  version: PTDL_v2
  game: generic
  author: psychoalex@thevcbc.com
  description: Owncast is a self-hosted live video and web chat server for use with existing popular broadcasting software.
container:
  image: ghcr.io/pterodactyl/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./owncast
  args:
  - -webserverport
  - '{{SERVER_PORT}}'
  - -rtmpport
  - '{{RTMP_PORT}}'
  - -streamkey
  - '{{STREAM_KEY}}'
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: RTMP_PORT
  description: The port that is used to receive the stream data.
  default: '8091'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: STREAM_KEY
  description: This is used to authenticate to the web admin interface, as well as to authenticate your stream.
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: VERSION
  description: "The version of Owncast that you would like to install, from https://github.com/owncast/owncast/releases\r\nAs an Example - \"v0.0.11\" for a specific version or \"latest\" for the most up to date version."
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: GITHUB_PACKAGE
  description: Used to identify the github repository to pull the release from.
  default: owncast/owncast
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: MATCH
  description: Used to identify the specific asset under a release for download.
  default: linux-64bit
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: GITHUB_USER
  description: Required if you are doing more calls than the github anonymous API user allows.
  default: ''
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: GITHUB_OAUTH_TOKEN
  description: Required if you are doing more calls than the github anonymous API user allows.
  default: ''
  required: false
  secret: true
  user_editable: false
  user_viewable: false
networking:
  ports:
  - name: RTMP Port
    internal: '{{RTMP_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{RTMP_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
