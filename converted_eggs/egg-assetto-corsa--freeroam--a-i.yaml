metadata:
  id: assetto-corsa-freeroam--ai
  name: Assetto Corsa (Freeroam + AI)
  version: PTDL_v2
  game: generic
  author: josdekurk@gmail.com
  description: Custom Assetto Corsa server with focus on freeroam
container:
  image: ghcr.io/parkervcp/yolks:dotnet_8
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./AssettoServer
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: SERVER_NAME
  description: The name off the server
  default: AC_Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_PASSWORD
  description: ''
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: HTTP_PORT
  description: ''
  default: ''
  required: false
  secret: false
  user_editable: false
  user_viewable: true
- name: ADMIN_PASSWORD
  description: ''
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: MAX_CLIENTS
  description: ''
  default: '18'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 2
    - 25
networking:
  ports:
  - name: Http port
    internal: '{{HTTP_PORT}}'
    protocol: udp
    required: false
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{HTTP_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
