metadata:
  id: vanilla-bedrock
  name: Vanilla Bedrock
  version: PTDL_v2
  game: minecraft
  author: parker@parkervcp.com
  description: Bedrock Edition (also known as the Bedrock Version, Bedrock Codebase, Bedrock Engine or just Bedrock) refers to the multi-platform family of editions of Minecraft developed by Mojang AB, Microsoft Studios, 4J Studios, and SkyBox Labs. Prior to this term, as the engine originated with Pocket Edition, this entire product family was referred to as "Pocket Edition", "MCPE", or "Pocket/Windows 10 Edition".
  tags:
  - pid_limit
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 2Gi
    max: 4Gi
    swap: 512Mi
  disk:
    min: 10Gi
    io_priority: normal
startup:
  command: ./bedrock_server
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: BEDROCK_VERSION
  description: "The version of bedrock. (Ex. 1.7.0.13)\r\n\r\nDefault version is latest."
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: LD_LIBRARY_PATH
  description: Dumb reasons to need this
  default: .
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: SERVERNAME
  description: The name for the server
  default: Bedrock Dedicated Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: GAMEMODE
  description: 'Allowed values: "survival", "creative", or "adventure"'
  default: survival
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - survival
    - creative
    - adventure
- name: DIFFICULTY
  description: 'Allowed values: "peaceful", "easy", "normal", or "hard"'
  default: easy
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - peaceful
    - easy
    - normal
    - hard
- name: CHEATS
  description: "If true then cheats like commands can be used.\r\n\r\nAllowed values: \"true\" or \"false\""
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
