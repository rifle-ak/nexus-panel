metadata:
  id: necesse
  name: Necesse
  version: PTDL_v2
  game: generic
  author: josdekurk@gmail.com
  description: Build, quest, and conquer across an infinite procedurally generated world. Play alone or with friends as you establish a settlement and explore deep dungeons, fight monsters and bosses, mine rare ores, craft magical equipment, recruit specialists for your colony, and more!
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/steamcmd:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./jre/bin/java
  args:
  - -Xms128M
  - -Xmx{{SERVER_MEMORY}}M
  - -Dterminal.jline=false
  - -Dterminal.ansi=true
  - -jar
  - Server.jar
  - -localdir
  - -nogui
  - -world
  - '{{SAVE_NAME}}'
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!\\/bin\\/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: \\/mnt\\/server\r\n# Image to install with is 'ghcr.io\\/parkervcp\\/installers:debian'\r\n\r\n\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n\r\n# setup the default config file\r\nexport SERVER_CFG=/mnt/server/cfg/server.cfg\r\n\r\nif [ ! -f \"$SERVER_CFG\" ]; then\r\n    echo \"Generating server config\"\r\n    mkdir \"$(dirname \"$SERVER_CFG\")\"\r\n    cat > \"$SERVER_CFG\" <<EOF\r\nSERVER = {\r\n\tport = $SERVER_PORT, // [0 - 65535] Server default port\r\n\tslots = $SERVER_SLOTS, // [1 - 250] Server default slots\r\n\tpassword = $SERVER_PASSWORD, // Leave blank for no password\r\n\tmaxClientLatencySeconds = 30,\r\n\tpauseWhenEmpty = true,\r\n\tgiveClientsPower = true, // If true, clients will have much more power over what hits them, their position etc\r\n\tlogging = true, // If true, will create log files for each server start\r\n\tlanguage = en,\r\n\tunloadLevelsCooldown = 30, // The number of seconds a level will stay loaded after the last player has left it\r\n\tworldBorderSize = -1, // The max distance from spawn players can travel. -1 for no border\r\n\tdroppedItemsLifeMinutes = 0, // Minutes that dropped items will stay in the world. 0 or less for indefinite\r\n\tunloadSettlements = false, // If the server should unload player settlements or keep them loaded\r\n\tmaxSettlementsPerPlayer = -1, // The maximum amount of settlements per player. -1 or less means infinite\r\n\tmaxSettlersPerSettlement = -1, // The maximum amount of settlers per settlement. -1 or less means infinite\r\n\tjobSearchRange = 100, // The tile search range of settler jobs\r\n\tzipSaves = true, // If true, will create new saves uncompressed\r\n\tMOTD =  // Message of the day\r\n}\r\nEOF\r\nfi\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: SAVE_NAME
  description: Name of the save file.
  default: Save1
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_SLOTS
  description: Number of slots available for players to join the server.
  default: '10'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_PASSWORD
  description: Password required to enter the server.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: SRCDS_APPID
  description: DO NOT EDIT
  default: '1169370'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
  rules:
  - type: enum
    values:
    - '1169370'
- name: AUTO_UPDATE
  description: Enable or disable auto-update on startup. 0 to disable and 1 to enable.
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_BETAID
  description: Steam Beta branch to install.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
