metadata:
  id: the-isle
  name: The Isle
  version: PTDL_v2
  game: generic
  author: fredrik.johansenfuun@gmail.com
  description: The Isle is an open beta with an open-world survival game where players choose from three factions in an attempt to survive a fierce island. Hunt. Prey. Survive.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/steamcmd:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: /home/container/TheIsle/Binaries/Linux/TheIsleServer-Linux-Shipping
  args:
  - -Port=$SERVER_PORT
  - -ini:Engine:[EpicOnlineServices]:DedicatedServerClientId=xyza7891gk5PRo3J7G9puCJGFJjmEguW
  - -ini:Engine:[EpicOnlineServices]:DedicatedServerClientSecret=pKWl6t5i9NJK8gTpVlAxzENZ65P8hYzodV8Dqe5Rlc8
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n# The Isle\r\nmkdir -p /mnt/server/TheIsle/Saved/Config/LinuxServer\r\n#Config File\r\ncat > /mnt/server/TheIsle/Saved/Config/LinuxServer/Game.ini << ENDOFFILE\r\n[/Script/TheIsle.TIGameSession]\r\nServerName=${SERVER_NAME}\r\nMaxPlayerCount=${PLAYER_COUNT}\r\nMapName=Gateway\r\nbRconEnabled=${RCON}\r\nRconPort=${RCON_PORT}\r\nRconPassword=${RCON_PASSWORD}\r\nbServerPassword=${SERVER_PASSWORD_ENABLED}\r\nServerPassword=${SERVER_PASSWORD}\r\nbServerDynamicWeather=${DYNAMIC_WEATHER}\r\nbAllowReplay=${ALLOW_REPLAY}\r\nbEnableHumans=${HUMANS}\r\nbQueueEnabled=${ENABLE_QUEUE}\r\nQueuePort=${QUEUE_PORT}\r\n-\r\n[/Script/TheIsle.TIGameStateBase]\r\nAdminsSteamIDs=${ADMINSTEAMID}\r\nENDOFFILE\r\n#Hotfix\r\ncat > /mnt/server/TheIsle/Saved/Config/LinuxServer/Engine.ini << ENDOFFILE\r\n[Core.System]\r\nPaths=../../../Engine/Content\r\nPaths=%GAMEDIR%Content\r\nPaths=../../../Engine/Plugins/Runtime/SoundUtilities/Content\r\nPaths=../../../Engine/Plugins/Runtime/Synthesis/Content\r\nPaths=../../../Engine/Plugins/Runtime/AudioSynesthesia/Content\r\nPaths=../../../Engine/Plugins/Runtime/WebBrowserWidget/Content\r\nPaths=../../../Engine/Plugins/FX/Niagara/Content\r\nPaths=../../../Engine/Plugins/Experimental/PythonScriptPlugin/Content\r\nPaths=../../../TheIsle/Plugins/SteamCore/Content\r\nPaths=../../../TheIsle/Plugins/RVTObjectLandscapeBlending/Content\r\nPaths=../../../Engine/Plugins/Runtime/Nvidia/DLSS/Content\r\nPaths=../../../TheIsle/Plugins/DonMeshPainting/Content\r\nPaths=../../../TheIsle/Plugins/UIPF/Content\r\nPaths=../../../TheIsle/Plugins/EOSCore/Content\r\nPaths=../../../Engine/Plugins/Experimental/ControlRig/Content\r\nPaths=../../../Engine/Plugins/Runtime/Nvidia/DLSSMoviePipelineSupport/Content\r\nPaths=../../../Engine/Plugins/MovieScene/MovieRenderPipeline/Content\r\nPaths=../../../Engine/Plugins/Compositing/OpenColorIO/Content\r\nPaths=../../../Engine/Plugins/MovieScene/SequencerScripting/Content\r\nPaths=../../../TheIsle/Plugins/ImpostorBaker/Content\r\nPaths=../../../Engine/Plugins/2D/Paper2D/Content\r\nPaths=../../../Engine/Plugins/Developer/AnimationSharing/Content\r\nPaths=../../../Engine/Plugins/Editor/GeometryMode/Content\r\nPaths=../../../Engine/Plugins/Editor/SpeedTreeImporter/Content\r\nPaths=../../../Engine/Plugins/Enterprise/DatasmithContent/Content\r\nPaths=../../../Engine/Plugins/Experimental/ChaosClothEditor/Content\r\nPaths=../../../Engine/Plugins/Experimental/GeometryProcessing/Content\r\nPaths=../../../Engine/Plugins/Experimental/GeometryCollectionPlugin/Content\r\nPaths=../../../Engine/Plugins/Experimental/ChaosSolverPlugin/Content\r\nPaths=../../../Engine/Plugins/Experimental/ChaosNiagara/Content\r\nPaths=../../../Engine/Plugins/Experimental/MotoSynth/Content\r\nPaths=../../../Engine/Plugins/Media/MediaCompositing/Content\r\nPaths=../../../Engine/Plugins/Runtime/OpenXREyeTracker/Content\r\nPaths=../../../Engine/Plugins/Runtime/OpenXR/Content\r\nPaths=../../../Engine/Plugins/Runtime/OpenXRHandTracking/Content\r\nPaths=../../../Engine/Plugins/VirtualProduction/Takes/Content\r\n\r\n[EpicOnlineServices]\r\nDedicatedServerClientId=xyza7891gk5PRo3J7G9puCJGFJjmEguW\r\nDedicatedServerClientSecret=pKWl6t5i9NJK8gTpVlAxzENZ65P8hYzodV8Dqe5Rlc8\r\nENDOFFILE\r\n\r\nchmod -R 777 /mnt/server/TheIsle/Saved/Config/LinuxServer\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: SERVER_NAME
  description: Sets the name for the server
  default: A Pterodactyl server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: PLAYER_COUNT
  description: ''
  default: '100'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: ALLOW_REPLAY
  description: Enable or disable Replay
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: HUMANS
  description: Enable or disable humans
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: DYNAMIC_WEATHER
  description: Enable or disable dynamic weather
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: RCON
  description: Enable RCON
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: RCON_PORT
  description: ''
  default: '44000'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: RCON_PASSWORD
  description: ''
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: ENABLE_QUEUE
  description: Enable the queue
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: QUEUE_PORT
  description: ''
  default: '44000'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: DISCORD
  description: ''
  default: norden
  required: false
  secret: false
  user_editable: false
  user_viewable: true
- name: SERVER_PASSWORD_ENABLED
  description: Enable server password
  default: 'false'
  required: true
  secret: true
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: SERVER_PASSWORD
  description: The password of the server
  default: No password
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: AUTO_UPDATE
  description: Auto update on restart
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_BETAID
  description: ''
  default: evrima
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: SRCDS_APPID
  description: ''
  default: '412680'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '412680'
networking:
  ports:
  - name: Rcon Port
    internal: '{{RCON_PORT}}'
    protocol: tcp
    required: true
    firewall_default: deny
  - name: Queue Port
    internal: '{{QUEUE_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: rcon
    command: status
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
