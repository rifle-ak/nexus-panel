metadata:
  id: killing-floor-2
  name: Killing Floor 2
  version: PTDL_v2
  game: generic
  author: parker@parkervcp.com
  description: In KILLING FLOOR 2, players descend into continental Europe after it has been overrun by horrific, murderous clones called Zeds that were created by the corporation Horzine. The Zed outbreak caused by Horzine Biotech’s failed experiments has quickly spread with unstoppable momentum, paralyzing the European Union. Only a month ago, the first Zed outbreak from the original KILLING FLOOR ripped through London; now the specimen clones are everywhere.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/steamcmd:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - /home/container/Binaries/Win64/KFGameSteamServer.bin.x86_64 {{MAP_NAME}}?Port={{SERVER_PORT}}?QueryPort={{QUERY_PORT}}?AdminPassword={{ADMIN_PASS}}?Difficulty={{DIFFICULTY}}$( [ "$WEB_ADMIN" == "true" ] || printf %s '??WebAdminPort={{WEB_ADMIN_PORT}}' )
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n# Image to install with is 'ghcr.io/parkervcp/installers:debian'\r\n\r\n##\r\n#\r\n# Variables\r\n# STEAM_USER, STEAM_PASS, STEAM_AUTH - Steam user setup. If a user has 2fa enabled it will most likely fail due to timeout. Leave blank for anon install.\r\n# WINDOWS_INSTALL - if it's a windows server you want to install set to 1\r\n# SRCDS_APPID - steam app id found here - https://developer.valvesoftware.com/wiki/Dedicated_Servers_List\r\n# SRCDS_BETAID - beta branch of a steam app. Leave blank to install normal branch\r\n# SRCDS_BETAPASS - password for a beta branch should one be required during private or closed testing phases.. Leave blank for no password.\r\n# INSTALL_FLAGS - Any additional SteamCMD  flags to pass during install.. Keep in mind that steamcmd auto update process in the docker image might overwrite or ignore these when it performs update on server boot.\r\n# AUTO_UPDATE - Adding this variable to the egg allows disabling or enabling automated updates on boot. Boolean value. 0 to disable and 1 to enable.\r\n#\r\n ##\r\n\r\n# Install packages. Default packages below are not required if using our existing install image thus speeding up the install process.\r\n#apt -y update\r\n#apt -y --no-install-recommends install curl lib32gcc-s1 ca-certificates\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## add below your custom commands if needed\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: STEAM_USER
  description: "A steam username to use to install the server.\r\n\r\nOnly needed for games that need a user that owns the server"
  default: ''
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: STEAM_PASS
  description: Password for the Steam account to install a server.
  default: ''
  required: false
  secret: true
  user_editable: false
  user_viewable: false
- name: STEAM_AUTH
  description: Will most likely time out before it gets used.
  default: ''
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: SRCDS_APPID
  description: The App ID for the Server
  default: '232130'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '232130'
- name: EXTRA_FLAGS
  description: Only needed for specific situations.
  default: ''
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: MAP_NAME
  description: "The map to load when the server starts\r\n\r\ndefault - 'kf-bioticslab'"
  default: kf-bioticslab
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: QUERY_PORT
  description: The port steam will use to query the server.
  default: '27015'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: WEB_ADMIN
  description: ''
  default: 'false'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: ADMIN_PASS
  description: An admin password for the server.
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: SERVER_NAME
  description: This is the displayed server name to all players in the server and the server browser
  default: A Pterodactyl Hosted Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: DIFFICULTY
  description: 0 = Normal, 1 = Hard, 2 = Suicidal, 3 = Hell on Earth
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - '0'
    - '1'
    - '2'
    - '3'
- name: WEB_ADMIN_PORT
  description: The port the webadmin panel should use. This is a beta feature.
  default: '8089'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: AUTO_UPDATE
  description: Auto update the server on startup.
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: Query Port
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  - name: Web Admin Port
    internal: '{{WEB_ADMIN_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{QUERY_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
