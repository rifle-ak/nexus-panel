metadata:
  id: velocity
  name: Velocity
  version: PTDL_v2
  game: minecraft
  author: parker@parkervcp.com
  description: Velocity is a Minecraft server proxy with unparalleled server support, scalability, and flexibility.
  tags:
  - eula
  - java_version
  - pid_limit
container:
  image: ghcr.io/pterodactyl/yolks:java_16
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 2Gi
    max: 4Gi
    swap: 512Mi
  disk:
    min: 10Gi
    io_priority: normal
startup:
  command: java
  args:
  - -Xms128M
  - -Xmx{{SERVER_MEMORY}}M
  - -XX:+UseG1GC
  - -XX:G1HeapRegionSize=4M
  - -XX:+UnlockExperimentalVMOptions
  - -XX:+ParallelRefProcEnabled
  - -XX:+AlwaysPreTouch
  - -XX:MaxInlineLevel=15
  - -jar
  - '{{SERVER_JARFILE}}'
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: end
      timeout: 30s
variables:
- name: VELOCITY_VERSION
  description: "The Velocity Proxy version to download.\r\n\r\nSet to 'latest ' the download the last stable build."
  default: latest
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: SERVER_JARFILE
  description: "Server Jarfile, by default this is set to 'velocity.jar'.\r\nSet it to otherwise if you wish to have a different jarfile name."
  default: velocity.jar
  required: true
  secret: false
  user_editable: false
  user_viewable: true
  rules:
  - type: regex
    pattern: /^([\w\d._-]+)(\.jar)$/
- name: DL_PATH
  description: A URL to use to download a server.jar rather than the ones in the install script. This is not user viewable.
  default: ''
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: BUILD_NUMBER
  description: "The build number for the velocity release.\r\n\r\nLeave at latest to always get the latest version. Invalid versions will default to latest."
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
