metadata:
  id: subnautica
  name: Subnautica
  version: PTDL_v2
  game: generic
  author: tueye@tuworld.de
  description: "Subnautica is an open world survival action-adventure video game developed and published by Unknown Worlds Entertainment. In it, players are free to explore the ocean on an alien planet, known as planet 4546B, after their spaceship, the Aurora, crashes on the planet's surface.\r\n\r\nNote: NitroxMod version >=1.7.0.0 is required"
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/yolks:mono_latest
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: mono
  args:
  - ./nitrox/NitroxServer-Subnautica.exe
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# Installation Script\r\n#\r\n# Install dependencies\r\ndpkg --add-architecture i386\r\napt update\r\napt -y --no-install-recommends install curl jq unzip libstdc++6 ca-certificates libsdl2-2.0-0:i386\r\n\r\n## Get latest Nitrox-Mod build\r\n#latest_NitroxMod=$(curl --silent \"https://api.github.com/repos/SubnauticaNitrox/Nitrox/releases/latest\" | grep '\"tag_name\":' | sed -E 's/.*\"([^\"]+)\".*/\\1/')\r\n\r\n#if [ -z \"${NITROX_VERSION}\" ] || [ \"${NITROX_VERSION}\" == \"latest\" ]; then\r\n#  DL_VERSION=$latest_NitroxMod\r\n#else\r\n#  DL_VERSION=${NITROX_VERSION}\r\n#fi\r\n\r\n## get release info and download links\r\nGITHUB_PACKAGE=\"SubnauticaNitrox/Nitrox\"\r\nVERSION=${NITROX_VERSION}\r\nMATCH=\"Nitrox\"\r\n\r\nLATEST_JSON=$(curl --silent \"https://api.github.com/repos/${GITHUB_PACKAGE}/releases/latest\")\r\nRELEASES=$(curl --silent \"https://api.github.com/repos/${GITHUB_PACKAGE}/releases\")\r\n\r\nif [ -z \"${VERSION}\" ] || [ \"${VERSION}\" == \"latest\" ]; then\r\n    DOWNLOAD_URL=$(echo ${LATEST_JSON} | jq .assets | jq -r .[].browser_download_url | grep -i ${MATCH})\r\nelse\r\n    VERSION_CHECK=$(echo ${RELEASES} | jq -r --arg VERSION \"${VERSION}\" '.[] | select(.tag_name==$VERSION) | .tag_name')\r\n    if [ \"${VERSION}\" == \"${VERSION_CHECK}\" ]; then\r\n        DOWNLOAD_URL=$(echo ${RELEASES} | jq -r --arg VERSION \"${VERSION}\" '.[] | select(.tag_name==$VERSION) | .assets[].browser_download_url' | grep -i ${MATCH})\r\n    else\r\n        echo -e \"defaulting to latest release\"\r\n        DOWNLOAD_URL=$(echo ${LATEST_JSON} | jq .assets | jq -r .[].browser_download_url)\r\n    fi\r\nfi\r\n\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\ncd /mnt/server/steamcmd\r\n\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n\r\n## Install game using steamcmd\r\nGUARDCODE=\"${STEAM_GUARDCODE}\"\r\nif [ -z $GUARDCODE ]\r\nthen\r\n    echo \"\"\r\n    echo \"### You did not specify a Steam Guardcode\"\r\n    echo \"### A new one should be send to you shortly\"\r\n    echo \"### Enter it in the startup-config after this installation is finished and reinstall the Server\"\r\n    sleep 10\r\n    timeout 60 ./steamcmd.sh +login ${STEAM_USERNAME} ${STEAM_PASSWORD} +quit\r\n    exit 1\r\nfi\r\n\r\n[ ! -d \"$HOME/subnautica\" ] && mkdir $HOME/subnautica\r\n./steamcmd.sh +set_steam_guard_code ${STEAM_GUARDCODE} +login ${STEAM_USERNAME} ${STEAM_PASSWORD} +@sSteamCmdForcePlatformType windows +force_install_dir $HOME/subnautica +app_update ${APPID} ${EXTRA_FLAGS} validate +quit\r\nstatus=$?\r\n\r\nif [ $status -ne 0 ]\r\nthen\r\n    echo \"\"\r\n    echo \"### The Download was not successful\"\r\n    echo \"### Probably the entered Guardcode was wrong\"\r\n    echo \"### A new one should be send to you shortly\"\r\n    echo \"### Enter it in the startup-config after this installation is finished and reinstall the Server\"\r\n    sleep 10\r\n    sleep 10\r\n    timeout 30 ./steamcmd.sh +login ${STEAM_USERNAME} ${STEAM_PASSWORD} +quit\r\n    exit 1\r\nfi\r\n\r\n\r\n## set up 32 bit libraries\r\nmkdir -p $HOME/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p $HOME/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## Download and extract Nitrox\r\n[ -d \"$HOME/nitrox\" ] && rm -r $HOME/nitrox\r\nmkdir $HOME/nitrox\r\ncd $HOME/nitrox\r\ncurl -sL $DOWNLOAD_URL -o Nitrox.zip\r\nunzip $HOME/nitrox/Nitrox.zip\r\n\r\n\r\n## Create path files to Subnautica Install-Dir. Needed for versions pre 1.6.0\r\necho \"/home/container/subnautica\" > $HOME/path.txt\r\n\r\n## Create mono registry entry for Subnautica Install-Dir. Needed for versions since 1.6.0\r\nmkdir -p $HOME/.mono/registry/CurrentUser\r\n    cat <<EOT > $HOME/.mono/registry/CurrentUser/values.xml\r\n    <values>\r\n    <value name=\"SOFTWARE\\Nitrox\\PreferredGamePath\"\r\n    type=\"string\">/home/container/subnautica</value>\r\n    </values>\r\nEOT\r\n\r\n\r\n## Create config\r\nif [ -e $HOME/server.cfg ]; then\r\n    echo \"server settings exists\"\r\nelse\r\n    echo \"writing server default settings\"\r\n    cat <<EOT > $HOME/server.cfg\r\n    # Server settings can be changed here\r\n    # Set to true to Cache entities for the whole map on next run. \r\n    # WARNING! Will make server load take longer on the cache run but players will gain a performance boost when entering new areas.\r\n    CreateFullEntityCache=False\r\n    # Leave blank for a random spawn position\r\n    Seed=\r\n    ServerPort=11000\r\n    # Measured in milliseconds\r\n    SaveInterval=120000\r\n    # Command to run following a successful world save (e.g. .exe, .bat, or PowerShell script). \r\n    PostSaveCommandPath=\r\n    MaxConnections=100\r\n    InitialSyncTimeout=300000\r\n    DisableConsole=False\r\n    DisableAutoSave=False\r\n    SaveName=world\r\n    ServerPassword=\r\n    AdminPassword=PleaseChangeMe\r\n    # Possible values: SURVIVAL, FREEDOM, HARDCORE, CREATIVE\r\n    GameMode=SURVIVAL\r\n    # Possible values: PROTOBUF, JSON\r\n    SerializerMode=JSON\r\n    # Possible values: NONE, PLAYER, MODERATOR, ADMIN, CONSOLE\r\n    DefaultPlayerPerm=PLAYER\r\n    #\r\n    # Default player stats below here\r\n    DefaultOxygenValue=45\r\n    DefaultMaxOxygenValue=45\r\n    DefaultHealthValue=80\r\n    DefaultHungerValue=50.5\r\n    DefaultThirstValue=90.5\r\n    # Recommended to keep at 0.1f which is the default starting value. If set to 0 then new players are cured by default.\r\n    DefaultInfectionValue=0.1\r\n    # If set to true, the server will try to open port on your router via UPnP\r\n    AutoPortForward=False\r\nEOT\r\nfi"
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: APPID
  description: The ID corresponding to the game to download.
  default: '264710'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: STEAM_USERNAME
  description: Your Steam-Account SUername
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: STEAM_PASSWORD
  description: Your Steam Account Password
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: STEAM_GUARDCODE
  description: Yout Steam Guard Code
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: NITROX_VERSION
  description: Which version of Nitrox to install and use. Use the version e.g. 1.5.0.1 or latest for the newest release
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 3
    - 12
- name: SAVE_INTERVAL
  description: Time between auto saves specified in milliseconds
  default: '120000'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SAVE_DISABLE
  description: 'Disables Auto Save: False / True'
  default: 'False'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'True'
    - 'False'
- name: SAVE_NAME
  description: The save name for the server.
  default: world
  required: false
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 1
    - 100
- name: SUBNAUTICA_PASSWORD
  description: Password neccessary for connecting to the Server
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 3
    - 12
- name: SUBNAUTICA_ADMIN_PASSWORD
  description: If specified, players must provide this password to gain access to administrator commands on the server.
  default: PleaseChangeMe
  required: true
  secret: true
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 3
    - 16
- name: SERVER_MODE
  description: 'Game Mode setting: SURVIVAL, FREEDOM, HARDCORE, CREATIVE'
  default: SURVIVAL
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - SURVIVAL
    - FREEDOM
    - HARDCORE
    - CREATIVE
- name: PORTFORWARD_ENABLE
  description: If set to true, the server will try to open port on your router via UPnP
  default: 'False'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - 'True'
    - 'False'
- name: SERIALIZER_MODE
  description: "Switch between savegame formats.\r\nPossible values: PROTOBUF, JSON"
  default: JSON
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - PROTOBUF
    - JSON
- name: EXTRA_FLAGS
  description: Extra flags for steamcmd download. Do not edit
  default: -beta legacy
  required: true
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports:
  - name: Auto Portforward via UPnP
    internal: '{{PORTFORWARD_ENABLE}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{PORTFORWARD_ENABLE}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
