metadata:
  id: valheim--bepinex
  name: Valheim  BepINex
  version: PTDL_v2
  game: valheim
  author: eggs@goover.dev
  description: A brutal exploration and survival game for 1-10 players, set in a procedurally-generated purgatory inspired by viking culture incl the Plugin Framework BepInEx
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/games:valheim
  environment: {}
resources:
  cpu:
    min: 2000
    max: 4000
    shares: 1024
  memory:
    min: 4Gi
    max: 8Gi
    swap: 512Mi
  disk:
    min: 10Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - export DOORSTOP_ENABLE=TRUE; export DOORSTOP_INVOKE_DLL_PATH=./BepInEx/core/BepInEx.Preloader.dll; export LD_LIBRARY_PATH="./doorstop_libs:$LD_LIBRARY_PATH"; export LD_PRELOAD="libdoorstop_x64.so:$LD_PRELOAD"; export templdpath=$LD_LIBRARY_PATH; export LD_LIBRARY_PATH="./linux64:$LD_LIBRARY_PATH"; export SteamAppId=892970; export LD_LIBRARY_PATH=$templdpath; ./valheim_server.x86_64 -nographics -batchmode -name "{{SERVER_NAME}}" -port {{SERVER_PORT}} -world "{{WORLD}}" -password "{{PASSWORD}}" -public {{PUBLIC_SERVER}} -saveinterval {{BACKUP_INTERVAL}} -backups {{BACKUP_COUNT}} -backupshort {{BACKUP_SHORTTIME}} -backuplong {{BACKUP_LONGTIME}} $( [[ {{ENABLE_CROSSPLAY}} -eq 1 ]] && echo " -crossplay ") > >(sed -uE "{{CONSOLE_FILTER}}") & trap "{{STOP}}" 15; wait $!
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# Valheim Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n# Image to install with is 'debian:buster-slim'\r\napt -y update\r\napt -y --no-install-recommends --no-install-suggests install wget\r\n\r\n## just in case someone removed the defaults.\r\nif [ \"${STEAM_USER}\" == \"\" ]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} +app_update ${SRCDS_APPID} ${EXTRA_FLAGS} +quit\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\necho \"-------------------------------------------------------\"\r\necho \"installing BepInEx and Selected ModPacks...\"\r\necho \"-------------------------------------------------------\"\r\nif ! api_response=$(curl -sfSL -H \"accept: application/json\" \"https://thunderstore.io/api/experimental/package/denikson/BepInExPack_Valheim/\"); then\r\n        fatal \"Error: could not retrieve BepInEx release info from Thunderstore.io API\"\r\nfi\r\n\r\ndownload_url=$(jq -r  \".latest.download_url\" <<< \"$api_response\" )\r\nversion_number=$(jq -r  \".latest.version_number\" <<< \"$api_response\" )\r\n\r\nif [ ! -z \"$V_MODPACK\" ]\r\nthen\r\n#Modpack Name dashes to slashes for URL\r\nV_MODPACK=$(echo \"$V_MODPACK\" | sed 's/-/\\//g')\r\n\r\n#Extract dependencies from ModPack JSON data\r\nV_MODPACK_DEPENDENCIES=$(curl -sfSL -H \"accept: application/json\" \"https://thunderstore.io/api/experimental/package/${V_MODPACK}\" | jq -r '.dependencies[]')\r\nfi\r\n\r\ncd /mnt/server\r\n#echo $download_url\r\nwget --content-disposition $download_url\r\nunzip -o denikson-BepInExPack_Valheim-${version_number}.zip\r\ncp -r /mnt/server/BepInExPack_Valheim/* /mnt/server\r\n\r\nif [ ! -z \"$V_MODPACK\" ]\r\nthen\r\n#Delete Old Mods\r\nrm -rf /mnt/server/BepInEx/plugins/*\r\n\r\n#Download and extract the modpack dlls files\r\nfor V_MODPACK_DEPENDENCY in $V_MODPACK_DEPENDENCIES; do\r\n  #ignore bepinex\r\n  if [[ \"$V_MODPACK_DEPENDENCY\" == *\"denikson-BepInExPack_Valheim\"* ]]; then\r\n    continue  # Skip this dependency\r\n  fi\r\n  \r\n  #replace dashes with slashes for url\r\n  V_MODPACK_DEPENDENCY_WITH_SLASH=$(echo \"$V_MODPACK_DEPENDENCY\" | sed 's/-/\\//g')\r\n  \r\n  #download dependencies\r\n  wget -O \"$V_MODPACK_DEPENDENCY.zip\" \"https://thunderstore.io/package/download/$V_MODPACK_DEPENDENCY_WITH_SLASH\"\r\n\r\n  #Set the destination directory and ensure it exists\r\n  destination_directory=\"/mnt/server/BepInEx/plugins\"\r\n  if [ ! -d \"$destination_directory\" ]; then\r\n    mkdir -p \"$destination_directory\"\r\n  fi\r\n\r\n  #Extract DLL files from the ZIP and delete the zip file\r\n  unzip -j \"$V_MODPACK_DEPENDENCY.zip\" \"*.dll\" -d \"$destination_directory\"\r\n  \r\n  #Cleanup\r\n  rm $V_MODPACK_DEPENDENCY.zip\r\ndone\r\nfi\r\n\r\n##cleanup\r\necho \"-------------------------------------------------------\"\r\necho \"cleanup files...\"\r\necho \"-------------------------------------------------------\"\r\nrm -fR BepInExPack_Valheim\r\nrm -fR icon.png\r\nrm -fR denikson-BepInExPack_Valheim-*\r\nrm -fR manifest.json\r\nrm -fR README.m\r\n\r\n#rm -fR start_*\r\n\r\necho \"-------------------------------------------------------\"\r\necho \"Installation completed\"\r\necho \"-------------------------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: SERVER_NAME
  description: Name that appears in server browser.
  default: My Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: PASSWORD
  description: Server password.
  default: secret
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: WORLD
  description: Name to load if switching between multiple saved worlds.
  default: Dedicated
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: PUBLIC_SERVER
  description: ''
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: AUTO_UPDATE
  description: ''
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: ENABLE_CROSSPLAY
  description: Enable crossplay support
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_BETAID
  description: ''
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_BETAPASS
  description: ''
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: BACKUP_INTERVAL
  description: 'Change how often the world will save in seconds. Default: 1800 (30 minutes).'
  default: '1800'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BACKUP_COUNT
  description: 'Sets how many automatic backups will be kept. The first is the ''short'' backup length, and the rest are the ''long'' backup length. When default values are used means one backup that is 2 hours old, and 3 backups that are 12 hours apart. Default: 4.'
  default: '4'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BACKUP_SHORTTIME
  description: 'Sets the interval between the first automatic backups in seconds. Default: 7200 (2 hours).'
  default: '7200'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BACKUP_LONGTIME
  description: 'Sets the interval between the subsequent automatic backups in seconds. Default: 43200 (12 hours).'
  default: '43200'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: CONSOLE_FILTER
  description: Remove unwanted outputs from the console.
  default: /^\(Filename:.*Line:[[:space:]]+[[:digit:]]+\)$/d; /^([[:space:]]+)?$/d
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: SRCDS_APPID
  description: Valheim steam app id for auto updates.
  default: '896660'
  required: false
  secret: false
  user_editable: false
  user_viewable: true
- name: LD_LIBRARY_PATH
  description: Required to load server libraries.
  default: ./linux64
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: STOP
  description: ''
  default: kill -2 $!; wait;
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: V_MODPACK
  description: "Enter the Dependency String name for a ModPack to automatically be installed\r\nNOTE: If the modpack Updates, you will need to update this variable with the new Dependency String. This is done to allow Old Versions to be used.\r\nCHANGING THIS REQUIRES A SERVER REINSTALL"
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
