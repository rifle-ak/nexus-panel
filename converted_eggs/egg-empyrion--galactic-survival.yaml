metadata:
  id: empyrion-galactic-survival
  name: 'Empyrion: Galactic Survival'
  version: PTDL_v2
  game: generic
  author: eggs@goover.dev
  description: 'Empyrion: Galactic Survival dedicated server'
container:
  image: ghcr.io/parkervcp/yolks:wine_staging
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - cd empyrion; WINEDLLOVERRIDES="mscoree,mshtml=" wine ./DedicatedServer/EmpyrionDedicated.exe -batchmode -log -logFile ./logs/current.log & echo -e "Checking on telnet connection" && until nc -z 127.0.0.1 ${TELNET_PORT}; do echo -e "Waiting on telnet connection..."; sleep 5; done && $( [[ -z ${TELNET_PWD} ]] && printf %s "telnet -E 127.0.0.1 ${TELNET_PORT}")
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# Empyrion Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n\r\napt update\r\napt -y install curl unzip\r\ncd /tmp\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\nmkdir -p /mnt/server/steam\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steam\r\n\r\nexport HOME=/mnt/server\r\n\r\nmkdir -p /mnt/server/empyrion\r\nmkdir -p /mnt/server/Logs\r\nmkdir -p /mnt/server/empyrion/logs\r\ntouch /mnt/server/empyrion/logs/current.log\r\n\r\ncd /mnt/server/steam\r\nchown -R root:root /mnt\r\n\r\nif [ \"${VERSION}\" == \"experimental\" ]; then\r\n    ./steamcmd.sh +force_install_dir /mnt/server/empyrion +login anonymous +@sSteamCmdForcePlatformType windows +app_update 530870 -beta experimental validate +quit\r\nelse\r\n    ./steamcmd.sh +force_install_dir /mnt/server/empyrion +login anonymous +@sSteamCmdForcePlatformType windows +app_update 530870 validate +quit\r\nfi\r\n\r\n## setup 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v /mnt/server/steam/linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so\r\n\r\n## setup 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v /mnt/server/steam/linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so\r\n\r\n## add below your custom commands if needed\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: saveandexit 0
      timeout: 30s
variables:
- name: SRV_NAME
  description: Name that will be shown in the Server Browser.
  default: My Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SRV_PWD
  description: Password used to connect to the server - Optional, defaults to no password.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: MAX_PLAYERS
  description: Maximum number of player allowed to join simultaneously in the server. Defaults to 20.
  default: '20'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: TELNET_ENABLED
  description: Telnet access to control the server.
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: regex
    pattern: /^(?:true)?(?:false)?\b/
- name: TELNET_PORT
  description: Telnet Server Port DO NOT EXPOSE THIS TO THE INTERNET.
  default: '30004'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SEED
  description: World generation seed. Numeric between 1 and 7 characters.
  default: '1011345'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SRV_DESC
  description: Server info between the " ", can contain [b]bold[/b] text or a [u][url=empyriongame.com]link[/url][/u] up to 127 chars.
  default: Empyrion Galactic Survival Dedicated Server running on Pterodactyl Panel
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: VERSION
  description: Enable 'experimental'. Optional, defaults to public branch.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: WINEARCH
  description: ''
  default: win64
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINEDEBUG
  description: ''
  default: -all
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINETRICKS_RUN
  description: ''
  default: vcrun2019 dotnet48
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: AUTO_UPDATE
  description: ''
  default: '0'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: SRCDS_APPID
  description: ''
  default: '530870'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports:
  - name: Telnet Port
    internal: '{{TELNET_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{TELNET_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
