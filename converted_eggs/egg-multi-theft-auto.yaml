metadata:
  id: multi-theft-auto
  name: Multi Theft Auto
  version: PTDL_v2
  game: generic
  author: info@six-gaming.com
  description: What more could you want? Multi Theft Auto provides the best online Grand Theft Auto experience there is. Read on to find out more.
container:
  image: ghcr.io/parkervcp/games:mta
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./mta-server64
  args:
  - --port
  - '{{SERVER_PORT}}'
  - --httpport
  - '{{SERVER_WEBPORT}}'
  - -n
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: shutdown
      timeout: 30s
variables:
- name: SERVER_WEBPORT
  description: "The http port for web resource.\r\nThis Port needs to be the {{SERVER_PORT}}+3."
  default: '22005'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
networking:
  ports:
  - name: SERVER_WEBPORT
    internal: '{{SERVER_WEBPORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{SERVER_WEBPORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
