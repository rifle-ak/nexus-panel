metadata:
  id: fivem
  name: FiveM
  version: PTDL_v2
  game: generic
  author: parker@parkervcp.com
  description: A new FiveM egg for the latest builds due to recent changes in FiveM
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - $(pwd)/alpine/opt/cfx-server/ld-musl-x86_64.so.1 --library-path "$(pwd)/alpine/usr/lib/v8/:$(pwd)/alpine/lib/:$(pwd)/alpine/usr/lib/" -- $(pwd)/alpine/opt/cfx-server/FXServer +set citizen_dir $(pwd)/alpine/opt/cfx-server/citizen/ +set sv_licenseKey {{FIVEM_LICENSE}} +set steam_webApiKey {{STEAM_WEBAPIKEY}} +set sv_maxplayers {{MAX_PLAYERS}} +set serverProfile default +set txAdminPort {{TXADMIN_PORT}} $( [ "$TXADMIN_ENABLE" == "1" ] || printf %s '+exec server.cfg' )
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: quit
      timeout: 30s
variables:
- name: FIVEM_LICENSE
  description: Required to start the service. Get your keys at https://keymaster.fivem.net/
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_PLAYERS
  description: Set the fivem max play count
  default: '48'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
  rules:
  - type: port
    range:
    - 1
    - 48
- name: SERVER_HOSTNAME
  description: The name that shows up in the server browser
  default: My new FXServer!
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: FIVEM_VERSION
  description: "The fivem version that is to be installed. Invalid versions will default to recommended.\r\n\r\nAn example is `6013-d8ae399d15680da569022f57ab7f2474d307c821`\r\n\r\nYou can get the latest version from here - https://runtime.fivem.net/artifacts/fivem/build_proot_linux/master/"
  default: recommended
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: DOWNLOAD_URL
  description: "This is the link to download fivem from. This is only used in the install script.\r\n\r\nThe file you link to needs to be an fx.tar.zx file.\r\n\r\nExample:\r\nhttps://runtime.fivem.net/artifacts/fivem/build_proot_linux/master/6013-d8ae399d15680da569022f57ab7f2474d307c821/fx.tar.xz"
  default: ''
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: STEAM_WEBAPIKEY
  description: Use your Steam WebApiKey or set to 'none'. Get your key at https://steamcommunity.com/dev/apikey/
  default: none
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: TXADMIN_PORT
  description: The port for the txAdmin panel
  default: '40120'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: TXADMIN_ENABLE
  description: "Enables txadmin.\r\n\r\nset to 1 to enable. (default is 0 for false)"
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: txAdmin Port
    internal: '{{TXADMIN_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{TXADMIN_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
