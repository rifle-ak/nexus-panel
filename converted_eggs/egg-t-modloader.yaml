metadata:
  id: tmodloader
  name: tModloader
  version: PTDL_v2
  game: terraria
  author: parker@parkervcp.com
  description: tModLoader is essentially a mod that provides a way to load your own mods without having to work directly with Terraria's source code itself. This means you can easily make mods that are compatible with other people's mods, save yourself the trouble of having to decompile and recompile Terraria.exe, and escape from having to understand all of the obscure "intricacies" of Terraria's source code. It is made to work for Terraria 1.3+.
container:
  image: ghcr.io/parkervcp/yolks:dotnet_6
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./tModLoaderServer
  args:
  - -ip
  - 0.0.0.0
  - -port
  - '{{SERVER_PORT}}'
  - -maxplayers
  - '{{MAX_PLAYERS}}'
  - -password
  - '"{{SERVER_PASSWORD}}"'
  - -motd
  - '"{{MOTD}}"'
  - -lang
  - '{{LANGUAGE}}'
  - -world
  - ~/saves/Worlds/{{WORLD_NAME}}.wld
  - -worldname
  - '{{WORLD_NAME}}'
  - -autocreate
  - '{{WORLD_SIZE}}'
  - -config
  - serverconfig.txt
  - -savedirectory
  - ~/
  - -tmlsavedirectory
  - ~/saves
  - -modpath
  - ~/mods
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: exit
      timeout: 30s
variables:
- name: WORLD_NAME
  description: The name for the world file.
  default: world
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_PLAYERS
  description: The maximum number of players a server will hold.
  default: '8'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: WORLD_SIZE
  description: Defines the worlds size. 3 sizes 1 (small), 2 (medium), 3 (large).
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - '1'
    - '2'
    - '3'
- name: VERSION
  description: The version of tModloader that is to be used.
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: GITHUB_USER
  description: "GitHub user to use for api calls.\r\n\r\nThis only needs to be set if you hit the GitHub API too often across multiple servers."
  default: ''
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: GITHUB_OAUTH_TOKEN
  description: "This can be either an OAuth or a Personal Access Token.\r\n\r\nThis is required for the install is you set a user."
  default: ''
  required: false
  secret: true
  user_editable: false
  user_viewable: false
- name: DIFFICULTY
  description: 'Sets the difficulty of the world when using auto-create. Options: 0(normal), 1(expert), 2(master), 3(journey)'
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - '0'
    - '1'
    - '2'
    - '3'
- name: SERVER_PASSWORD
  description: "Server password for users to connect to your server.\r\nCan be empty for no password."
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: MOTD
  description: Message of the Day for the server
  default: Please don’t cut the purple trees!
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: LANGUAGE
  description: "Sets the server language \r\n1:English, \r\n2:German, \r\n3:Italian, \r\n4:French, \r\n5:Spanish"
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
