metadata:
  id: spongeforge
  name: SpongeForge
  version: PTDL_v2
  game: minecraft
  author: parker@parkervcp.com
  description: 'A community-driven open source Minecraft: Java Edition modding platform.'
  tags:
  - eula
  - java_version
  - pid_limit
container:
  image: ghcr.io/pterodactyl/yolks:java_18
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 2Gi
    max: 4Gi
    swap: 512Mi
  disk:
    min: 10Gi
    io_priority: normal
startup:
  command: java
  args:
  - -Xms128M
  - -Xmx{{SERVER_MEMORY}}M
  - -jar
  - '{{SERVER_JARFILE}}'
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: SERVER_JARFILE
  description: The name of the Jarfile to use when running Forge Mod.
  default: server.jar
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: regex
    pattern: /^([\w\d._-]+)(\.jar)$/
- name: SF_VERSION
  description: "Example 1.12.2-2825-7.1.6\r\n\r\nIf the version fails it defaults to recommended"
  default: recommended
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: FORGE_VERSION
  description: "Optional, only needed for custom Forge Version with Sponge.\r\n\r\nThe full exact version.\r\nEx. 1.15.2-31.2.4\r\n\r\nIf it fails to download the server files or to verify compatibility to the Sponge Version it will fail to install."
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: regex
    pattern: /^[0-9\.\-]+$/
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
