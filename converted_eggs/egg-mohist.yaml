metadata:
  id: mohist
  name: Mohist
  version: PTDL_v2
  game: generic
  author: alex.chang-lam@protonmail.com
  description: Spigot fork with performance optimizations.
  tags:
  - eula
  - java_version
  - pid_limit
container:
  image: ghcr.io/pterodactyl/yolks:java_8
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: java
  args:
  - -Xms128M
  - -XX:MaxRAMPercentage=95.0
  - -Dterminal.jline=false
  - -Dterminal.ansi=true
  - -jar
  - '{{SERVER_JARFILE}}'
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: SERVER_JARFILE
  description: The name of the jarfile to run the server with.
  default: server.jar
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: MC_VERSION
  description: The version of Minecraft to download.
  default: 1.19.4
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BUILD_VERSION
  description: "Optional: \r\nThe build number for the Mohist release. Overrides Build Type."
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
