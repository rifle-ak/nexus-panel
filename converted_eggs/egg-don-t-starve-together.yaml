metadata:
  id: dont-starve-together
  name: Don't Starve Together
  version: PTDL_v2
  game: generic
  author: parker@parkervcp.com
  description: Don’t Starve Together is an uncompromising wilderness survival game full of science and magic.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/games:source
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - cd bin64 && coproc caves ( ./dontstarve_dedicated_server_nullrenderer_x64 -bind_ip 0.0.0.0 -port 11000 -persistent_storage_root /home/container/DoNotStarveTogether -conf_dir config -cluster server -players {{MAX_PLAYERS}} -shard Caves ); ./dontstarve_dedicated_server_nullrenderer_x64 -bind_ip 0.0.0.0 -port {{SERVER_PORT}} -persistent_storage_root /home/container/DoNotStarveTogether -conf_dir config -cluster server -players {{MAX_PLAYERS}} -shard Master && echo 'c_shutdown()' >&"${caves[1]}"
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n# Image to install with is 'debian:buster-slim'\r\napt -y update\r\napt -y --no-install-recommends install curl lib32gcc1 ca-certificates\r\n\r\n## just in case someone removed the defaults.\r\nif [ \"${STEAM_USER}\" == \"\" ]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} +force_install_dir /mnt/server +app_update ${SRCDS_APPID} ${EXTRA_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## DST specific\r\n## cluster token file\r\necho -e \"getting cluster configs\"\r\nmkdir -p /mnt/server/DoNotStarveTogether/config/server/\r\nif [ ! -f /mnt/server/DoNotStarveTogether/config/server/cluster_token.txt ]; then\r\n    echo \"${SERVER_TOKEN}\" >> /mnt/server/DoNotStarveTogether/config/server/cluster_token.txt\r\nfi\r\n\r\n## cluster configs \r\nif [ ! -f /mnt/server/DoNotStarveTogether/config/server/cluster.ini ]; then\r\n    curl -sSL https://raw.githubusercontent.com/parkervcp/eggs/master/game_eggs/steamcmd_servers/dont_starve/server.cluster.ini -o /mnt/server/DoNotStarveTogether/config/server/cluster.ini\r\nfi\r\n\r\n## master configs\r\necho -e \"getting master configs\"\r\nmkdir -p /mnt/server/DoNotStarveTogether/config/server/Master/\r\n## master ini\r\nif [ ! -f /mnt/server/DoNotStarveTogether/config/server/Master/server.ini ]; then\r\n    curl -sSL https://raw.githubusercontent.com/parkervcp/eggs/master/game_eggs/steamcmd_servers/dont_starve/server.master.ini -o /mnt/server/DoNotStarveTogether/config/server/Master/server.ini\r\nfi\r\n\r\n## master worldgen override\r\nif [ ! -z ${MASTER_WORLDGEN}  ] && [ ! -f /mnt/server/DoNotStarveTogether/config/server/Master/worldgenoverride.lua ]; then\r\n    curl -sSL ${MASTER_WORLDGEN} -o /mnt/server/DoNotStarveTogether/config/server/Master/worldgenoverride.lua\r\nfi\r\n\r\n## caves configs\r\necho -e \"getting cave configs\"\r\nmkdir -p /mnt/server/DoNotStarveTogether/config/server/Caves/\r\n## caves ini\r\nif [ ! -f /mnt/server/DoNotStarveTogether/config/server/Caves/server.ini ]; then\r\n    curl -sSL https://raw.githubusercontent.com/parkervcp/eggs/master/game_eggs/steamcmd_servers/dont_starve/server.caves.ini -o /mnt/server/DoNotStarveTogether/config/server/Caves/server.ini\r\nfi\r\n\r\n## caves worldgen override\r\nif [ ! -z ${CAVES_WORLDGEN} ] && [ ! -f /mnt/server/DoNotStarveTogether/config/server/Caves/worldgenoverride.lua ]; then\r\n    curl -sSL ${CAVES_WORLDGEN} -o /mnt/server/DoNotStarveTogether/config/server/Caves/worldgenoverride.lua\r\nfi\r\n\r\necho -e \"install complete\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: c_shutdown()
      timeout: 30s
variables:
- name: MAX_PLAYERS
  description: "Set the maximum number of players that will be allowed to join the game. This option overrides the [GAMEPLAY] / max_players setting in cluster.ini.\r\n\r\ndefault is 16"
  default: '16'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 1
    - 31
- name: SERVER_TOKEN
  description: "Required to run a public server. This needs to be generated from in game.\r\n\r\nGet your token here:\r\nhttps://accounts.klei.com/account/game/servers?game=DontStarveTogether"
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: SRCDS_APPID
  description: Steam Server App ID
  default: '343050'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: AUTO_UPDATE
  description: "This is to enable auto-updating for servers.\r\n\r\nDefault is 0. Set to 1 to update"
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: GAME_MODE
  description: Valid values are survival, endless or wilderness
  default: survival
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: CLUSTER_NAME
  description: This is the name that will show up in server browser.
  default: A Pterodactyl Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: CLUSTER_DESC
  description: This will show up in the server details area on the “Browse Games” screen.
  default: A Pterodactyl Hosted Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MASTER_WORLDGEN
  description: Link to the lua file used to generate the master server map. Only used during the install phase.
  default: https://raw.githubusercontent.com/parkervcp/eggs/master/game_eggs/steamcmd_servers/dont_starve/worldgenoverride.master.lua
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: CAVES_WORLDGEN
  description: "Link to the lua file used to generate the caves server map. Only used during the install phase.\r\n\r\nDefault generates a cave map"
  default: https://raw.githubusercontent.com/parkervcp/eggs/master/game_eggs/steamcmd_servers/dont_starve/worldgenoverride.caves.lua
  required: false
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
