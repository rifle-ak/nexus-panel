metadata:
  id: astroneer-dedicated-server
  name: Astroneer Dedicated Server
  version: PTDL_v2
  game: generic
  author: melethainiel.aerin@gmail.com
  description: A game of aerospace industry and interplanetary exploration.
container:
  image: ghcr.io/parkervcp/steamcmd:proton
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: proton
  args:
  - run
  - ./Astro/Binaries/Win64/AstroServer-Win64-Shipping.exe
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n# Image to install with is 'ghcr.io/parkervcp/installers:debian'\r\n# Install packages. Default packages below are not required if using our existing install image thus speeding up the install process.\r\n#apt -y update\r\n#apt -y --no-install-recommends install curl lib32gcc-s1 ca-certificates\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\necho -e \"steam user is not set.\\n\"\r\necho -e \"Using anonymous user.\\n\"\r\nSTEAM_USER=anonymous\r\nSTEAM_PASS=\"\"\r\nSTEAM_AUTH=\"\"\r\nelse\r\necho -e \"user set to ${STEAM_USER}\"\r\nfi\r\n## download and install steamcmd\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Install steamcmd\"\r\necho \"-----------------------------------------\"\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n## install game using steamcmd\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Install game\"\r\necho \"-----------------------------------------\"\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: PUBLIC_IP
  description: Public IP to connect to the server.
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: OWNER_NAME
  description: Steam username of the server owner
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: OWNER_GUID
  description: Steam id of the server owner
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_PWD
  description: If specified, players must provide this password to join the server.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 1
    - 100
- name: AUTO_UPDATE
  description: Quickly checks for any server updates on startup, and updates if necessary. (1 Enable | 0 Disable)
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WINDOWS_INSTALL
  description: Windows Install
  default: '1'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: SRCDS_APPID
  description: ''
  default: '728470'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: PROTON_LOG
  description: ''
  default: '1'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: SERVER_NAME
  description: ''
  default: Pterodactyl hosted Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
