metadata:
  id: neosvr
  name: NeosVR
  version: PTDL_v2
  game: generic
  author: espeon@espeon.dev
  description: Neos VR is a metaverse engineered for the unknown! It’s one of the most versatile and feature rich metaverses for virtual reality, designed so everybody can find something interesting or useful to do in a social setting.
container:
  image: ghcr.io/parkervcp/yolks:mono_latest
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - mono Neos.exe -c ./Config/Config.json -l ./Logs $(if {{ENABLE_MODLOADER}}; then echo "-LoadAssembly ./NeosModLoaderHeadless.dll"; fi)
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n# Image to install with is 'ghcr.io/parkervcp/installers:debian'\r\n\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## add below your custom commands if needed\r\n\r\n## create default config\r\nmkdir -p /mnt/server/Config\r\nrm -rf /mnt/server/Config/Config.json\r\ncurl -sSL -o /mnt/server/Config/Config.json https://raw.githubusercontent.com/parkervcp/eggs/master/game_eggs/steamcmd_servers/neosvr/Config.json\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: shutdown
      timeout: 30s
variables:
- name: STEAM_USER
  description: The username for your Steam account.
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: STEAM_PASS
  description: The password for your Steam account.
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: STEAM_AUTH
  description: The Steam Guard code or Login Token emailed to you.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: ENABLE_MODLOADER
  description: 'See: https://github.com/neos-modding-group/NeosModLoader for more information on Neos Mod Loader.'
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: SRCDS_BETAPASS
  description: 'This is the "Beta Password" that is only acquired by going to the Neos Patreon, subscribing to the "Gunter" level, and linking your Patreon to Discord. Then you will be able to see the #headless-client channel and the password will be pinned in the command after -betapassword.'
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: SRCDS_BETAID
  description: ''
  default: headless-client
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: AUTO_UPDATE
  description: Auto update the server on startup
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_APPID
  description: ''
  default: '740250'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
