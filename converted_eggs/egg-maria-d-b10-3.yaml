metadata:
  id: mariadb-103
  name: MariaDB 10.3
  version: PTDL_v2
  game: generic
  author: parker@parkervcp.com
  description: One of the most popular database servers. Made by the original developers of MySQL. Guaranteed to stay open source.
container:
  image: ghcr.io/parkervcp/yolks:mariadb_10.3
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - '{ /usr/sbin/mysqld & } && sleep 5 && mysql -u root'
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: shutdown; exit;
      timeout: 30s
variables: []
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
