metadata:
  id: colony-survival
  name: Colony Survival
  version: PTDL_v2
  game: generic
  author: josdekurk@gmail.com
  description: Colony Survival is a unique first-person strategy game developed by a two-man team. Build your own colony in a voxel world. Command guards, farmers, miners and other colonists. Defend your colony against the horde of monsters that attacks every night!
container:
  image: ghcr.io/parkervcp/steamcmd:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./colonyserver.x86_64
  args:
  - -batchmode
  - -nographics
  - +server.world
  - '"{{WORLD_NAME}}"'
  - +server.networktype
  - SteamOnline
  - +server.name
  - '"{{SERVER_NAME}}"'
  - +server.maxplayers
  - '{{MAX_PLAYERS}}'
  - +server.gameport
  - '{{SERVER_PORT}}'
  - +server.ip
  - 0.0.0.0
  - +server.steamport
  - '{{SERVER_STEAMPORT}}'
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n# Image to install with is 'ghcr.io/parkervcp/installers:debian'\r\n\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH}  +app_update ${SRCDS_APPID} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: SRCDS_APPID
  description: ''
  default: '748090'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '748090'
- name: AUTO_UPDATE
  description: Auto update the server on restart
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WORLD_NAME
  description: ''
  default: Pterodactyl
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_NAME
  description: ''
  default: Pterodactyl
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_PLAYERS
  description: ''
  default: '10'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_STEAMPORT
  description: ''
  default: '27005'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
networking:
  ports:
  - name: Server steamport
    internal: '{{SERVER_STEAMPORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{SERVER_STEAMPORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
