metadata:
  id: icarus-dedicated
  name: Icarus-Dedicated
  version: PTDL_v2
  game: generic
  author: bolverblitz@ebg.pw
  description: Icarus is a survival game that with dedicated servers as a public beta
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/yolks:wine_latest
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: wine64
  args:
  - ./Icarus/Binaries/Win64/IcarusServer-Win64-Shipping.exe
  - -Log
  - -SteamServerName=${SERVER_NAME}
  - -PORT="${SERVER_PORT}"
  - -QueryPort="${QUERY_PORT}"
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n\r\n## License: MIT License\r\n## Image to install with is 'ghcr.io/parkervcp/installers:debian'\r\n\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} validate +quit\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\nFILE=/mnt/server/Icarus/Saved/Config/ServerSettings.ini\r\nif [ -f \"$FILE\" ]; then\r\n    echo \"Config already exist skipping\"\r\nelse \r\n    echo \"Config does not yet exist, making one\"\r\n    mkdir -p /mnt/server/Icarus/Saved/Config/\r\n    cd /mnt/server/Icarus/Saved/Config/\r\n    curl -sSL -o ServerSettings.ini https://raw.githubusercontent.com/RocketWerkz/IcarusDedicatedServer/main/ServerSettings.ini\r\nfi\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: QUERY_PORT
  description: UDP port for Steam server list features.
  default: '27015'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_NAME
  description: ''
  default: IcarusEGG
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WINDOWS_INSTALL
  description: Required for windows game server installs
  default: '1'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINETRICKS_RUN
  description: Run installs on software that is required by the server
  default: vcrun2019 corefonts
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - vcrun2019 corefonts
- name: SRCDS_APPID
  description: steam app id found here - https://developer.valvesoftware.com/wiki/Dedicated_Servers_List
  default: '2089300'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '2089300'
- name: AUTO_UPDATE
  description: Disabling or enabling automated updates on boot
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WINEDEBUG
  description: ''
  default: -all
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINEPATH
  description: ''
  default: /home/container
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINEARCH
  description: ''
  default: win64
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - win64
networking:
  ports:
  - name: '[REQUIRED] Server Query Port'
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{QUERY_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
