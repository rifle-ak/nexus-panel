metadata:
  id: attack-of-the-b-team
  name: Attack of the B-Team
  version: PTDL_v2
  game: generic
  author: support@pterodactyl.io
  description: This modpack was designed with one thing in mind, crazy mad science! With the help of the B-Team we hand picked the wackiest mods we could find and shoved them all in a modpack for you guys. The result is Attack of the B-Team!
  tags:
  - eula
  - java_version
  - pid_limit
container:
  image: ghcr.io/parkervcp/yolks:java_8
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: java
  args:
  - -Xms128M
  - -Xmx{{SERVER_MEMORY}}M
  - -jar
  - BTeam.jar
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: MODPACK_VERSION
  description: Version of the modpack to use
  default: 1.0.12c
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
