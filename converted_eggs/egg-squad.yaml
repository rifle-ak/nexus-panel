metadata:
  id: squad
  name: Squad
  version: PTDL_v2
  game: generic
  author: brycea@terrahost.cloud
  description: Squad is a 50 vs 50 multiplayer first-person shooter that aims to capture combat realism through communication and teamplay. Major features include vehicle-based combined arms gameplay, large scale environments, base building, and integrated positional VoIP for proximity talking & radio.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/steamcmd:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: /home/container/SquadGame/Binaries/Linux/SquadGameServer
  args:
  - SquadGame
  - Port={{SERVER_PORT}}
  - QueryPort={{QUERY_PORT}}
  - -beaconport={{BEACON_PORT}}
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n# Image to install with is 'ghcr.io/parkervcp/installers:debian'\r\n\r\n##\r\n#\r\n# Variables\r\n# STEAM_USER, STEAM_PASS, STEAM_AUTH - Steam user setup. If a user has 2fa enabled it will most likely fail due to timeout. Leave blank for anon install.\r\n# WINDOWS_INSTALL - if it's a windows server you want to install set to 1\r\n# SRCDS_APPID - steam app id found here - https://developer.valvesoftware.com/wiki/Dedicated_Servers_List\r\n# SRCDS_BETAID - beta branch of a steam app. Leave blank to install normal branch\r\n# SRCDS_BETAPASS - password for a beta branch should one be required during private or closed testing phases.. Leave blank for no password.\r\n# INSTALL_FLAGS - Any additional SteamCMD  flags to pass during install.. Keep in mind that steamcmd auto update process in the docker image might overwrite or ignore these when it performs update on server boot.\r\n# AUTO_UPDATE - Adding this variable to the egg allows disabling or enabling automated updates on boot. Boolean value. 0 to disable and 1 to enable.\r\n#\r\n ##\r\n\r\n# Install packages. Default packages below are not required if using our existing install image thus speeding up the install process.\r\n#apt -y update\r\n#apt -y --no-install-recommends install curl lib32gcc-s1 ca-certificates\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n## Deleted app workshop file if available to not save mods ID`s for the future as that will interviene with the mods specified in the variables tab\r\nrm /mnt/server/container/steamapps/workshop/appworkshop_393380.acf\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n# Install the game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} \\\r\n$( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) \\\r\n+app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) \\\r\n$( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate \\\r\n$(IFS=','; for item in $WORKSHOP_ITEMS; do echo \"+workshop_download_item 393380 ${item}\"; done) \\\r\n+quit\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## Moves downloaded mods to the necesary folder\r\nmv -rf /mnt/server/container/steamapps/workshop/content/393380 /mnt/server/SquadGame/Plugins/Mods\r\necho -e \"Moving downloaded mods if avabile\\n\"\r\n\r\n## add below your custom commands if needed\r\nchmod +x /mnt/server/SquadGame/Binaries/Linux/SquadGameServer\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: QUERY_PORT
  description: Query port for your Squad server.
  default: '27165'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: LD_LIBRARY_PATH
  description: this is needed for some reason
  default: /home/container/linux64/
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: SRCDS_APPID
  description: The ID corresponding to the game to download and run using SRCDS.
  default: '403240'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: servername
  description: The name for the server in the server list
  default: Squad Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: maxplayers
  description: Sets the maximum number of players.
  default: '80'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: allowteamchange
  description: Allow players to change teams ( true / false )
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: advertise
  description: Have the server report to the public server list ( true / false )
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: reservedslots
  description: The number of reserved slots for admins / mods
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: ptciu
  description: This will prevent players from changing teams if they're already unbalanced ( true / false )
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: teambal
  description: This will FORCE team balance if the teams are too uneven ( true / false )
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: recorddemos
  description: This will record demos of the players ( true / false )
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BEACON_PORT
  description: Beacon port for your Squad server.
  default: '15000'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: WORKSHOP_ITEMS
  description: "Workshop file ids separated by a comma \",\" (1111111,222222) \r\nReinstall Required to install mods"
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: Query Port
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  - name: Beacon Port
    internal: '{{BEACON_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{QUERY_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
