metadata:
  id: clone-hero
  name: Clone Hero
  version: PTDL_v2
  game: generic
  author: josdekurk@gmail.com
  description: Clone Hero is a classic instrument based rhythm game for Windows, Mac, Linux, and Android. It's playable with any 5 or 6 fret guitar controller, any midi drum kit, any game controller and even your keyboard! Jam out with Drums, 5-fret Guitar, or 6-fret Guitar online or local!
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - ./Server -l {{LOG_LEVEL}} -n "{{SERVER_DISPLAY_NAME}}" -p {{SERVER_PORT}} -a 0.0.0.0 $([[ -z "${SERVER_PASSWORD}" ]] && echo -np || echo  "-ps ${SERVER_PASSWORD}")
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^c
      timeout: 30s
variables:
- name: SERVER_DISPLAY_NAME
  description: The name of the server
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_PASSWORD
  description: The password of the server
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
  rules:
  - type: regex
    pattern: /^[a-zA-Z0-9_]+$/
- name: LOG_LEVEL
  description: Set max logging level
  default: '4'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - '0'
    - '1'
    - '2'
    - '3'
    - '4'
- name: VERSION
  description: "The version of Clone Hero you want to install.\r\nExample: V1.0.0.4080 or latest"
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
