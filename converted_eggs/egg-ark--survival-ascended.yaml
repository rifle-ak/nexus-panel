metadata:
  id: ark-survival-ascended
  name: 'ARK: Survival Ascended'
  version: PTDL_v2
  game: ark
  author: blood@darkartsgaming.com
  description: ARK is reimagined from the ground-up into the next-generation of video game technology with Unreal Engine 5! Form a tribe, tame & breed hundreds of unique dinosaurs and primeval creatures, explore, craft, build, and fight your way to the top of the food-chain. Your new world awaits!
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/steamcmd:proton
  environment: {}
resources:
  cpu:
    min: 4000
    max: 6000
    shares: 1024
  memory:
    min: 8Gi
    max: 16Gi
    swap: 512Mi
  disk:
    min: 50Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - rmv() { echo "stopping server"; rcon -t rcon -a 127.0.0.1:${RCON_PORT} -p ${ARK_ADMIN_PASSWORD} KeepAlive && rcon -t rcon -a 127.0.0.1:${RCON_PORT} -p ${ARK_ADMIN_PASSWORD} DoExit && wait ${ARK_PID}; echo "Server Closed"; exit; }; trap rmv 15 2; proton run ./ShooterGame/Binaries/Win64/ArkAscendedServer.exe {{SERVER_MAP}}?listen?MaxPlayers={{MAX_PLAYERS}}?SessionName=\"{{SESSION_NAME}}\"?Port={{SERVER_PORT}}?QueryPort={{QUERY_PORT}}?RCONPort={{RCON_PORT}}?RCONEnabled=True$( [  "$SERVER_PVE" == "0" ] || printf %s '?ServerPVE=True' )?ServerPassword="{{SERVER_PASSWORD}}"{{ARGS_PARAMS}}?ServerAdminPassword="{{ARK_ADMIN_PASSWORD}}" -WinLiveMaxPlayers={{MAX_PLAYERS}} -oldconsole -servergamelog$( [ -z "$MOD_IDS" ] || printf %s ' -mods=' $MOD_IDS )$( [ "$BATTLE_EYE" == "1" ] || printf %s ' -NoBattlEye' ) -Port={{SERVER_PORT}} {{ARGS_FLAGS}} & ARK_PID=$! ; tail -c0 -F ./ShooterGame/Saved/Logs/ShooterGame.log --pid=$ARK_PID & until echo "waiting for rcon connection..."; (rcon -t rcon -a 127.0.0.1:${RCON_PORT} -p ${ARK_ADMIN_PASSWORD})<&0 & wait $!; do sleep 5; done
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n# Image to install with is 'ghcr.io/parkervcp/installers:debian'\r\n\r\n##\r\n#\r\n# Variables\r\n# STEAM_USER, STEAM_PASS, STEAM_AUTH - Steam user setup. If a user has 2fa enabled it will most likely fail due to timeout. Leave blank for anon install.\r\n# WINDOWS_INSTALL - if it's a windows server you want to install set to 1\r\n# SRCDS_APPID - steam app id found here - https://developer.valvesoftware.com/wiki/Dedicated_Servers_List\r\n# SRCDS_BETAID - beta branch of a steam app. Leave blank to install normal branch\r\n# SRCDS_BETAPASS - password for a beta branch should one be required during private or closed testing phases.. Leave blank for no password.\r\n# INSTALL_FLAGS - Any additional SteamCMD  flags to pass during install.. Keep in mind that steamcmd auto update process in the docker image might overwrite or ignore these when it performs update on server boot.\r\n# AUTO_UPDATE - Adding this variable to the egg allows disabling or enabling automated updates on boot. Boolean value. 0 to disable and 1 to enable.\r\n#\r\n ##\r\n\r\n# Install packages. Default packages below are not required if using our existing install image thus speeding up the install process.\r\n#apt -y update\r\n#apt -y --no-install-recommends install curl lib32gcc-s1 ca-certificates\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## add below your custom commands if needed\r\n## cleanup movies?\r\nrm -rf /mnt/server/ShooterGame/Content/Movies\r\n\r\n## touch log file\r\nmkdir -p /mnt/server/ShooterGame/Saved/Logs\r\necho \"--fresh install--\" >> /mnt/server/ShooterGame/Saved/Logs/ShooterGame.log\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: SERVER_MAP
  description: 'Available Maps: TheIsland_WP'
  default: TheIsland_WP
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SESSION_NAME
  description: '"Unofficial" dedicated server name'
  default: A Pterodactyl Hosted Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: AUTO_UPDATE
  description: This is to enable auto-updating for servers on restart/re-install.
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BATTLE_EYE
  description: Enable BattleEye / Anti-Cheat
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_APPID
  description: app id required for server download/updates. end users should not see this.
  default: '2430930'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '2430930'
- name: ARGS_PARAMS
  description: 'params (?ServerPassword=...) are supported here but params need to be touching. (i.e): ?ServerPassword=MyP4SsWoRd?ServerAdminPassword=sUpRp4ssW0rd'
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_PLAYERS
  description: Specifies the maximum amount of players able to join the server.
  default: '70'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: ARK_ADMIN_PASSWORD
  description: Used for RCON (remote and in-browser console) as well as in-game EnableCheats
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: QUERY_PORT
  description: ARK query port used by steam server browser and ark client server browser.
  default: '27015'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: ARGS_FLAGS
  description: 'flags (-UseBattleEye) are supported here without them touching. (i.e): -crossplay -mods=1234,1235,1236'
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_PVE
  description: ON = Player-vs-Environment (PvE), OFF = Player-vs-Player (PvP); Default is ON
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_PASSWORD
  description: required password to enter the server, leave blank for public server
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: RCON_PORT
  description: required for console commands and proper server shutdown (saveworld/exit), doesn't have to be open to the public
  default: '37015'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: MOD_IDS
  description: https://www.curseforge.com/ark-survival-ascended ; ProjectID is is the MOD_ID on the right-side of the mod-view page ; leave blank to disable mods ; separate only by comma ( , ) without spaces! (i.e.) 1234,1235,1236
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: Query Port
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  - name: RCON Port
    internal: '{{RCON_PORT}}'
    protocol: tcp
    required: true
    firewall_default: deny
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: rcon
    command: status
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
