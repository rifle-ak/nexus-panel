metadata:
  id: gomint
  name: GoMint
  version: PTDL_v2
  game: minecraft
  author: parker@parkervcp.com
  description: A performant and stable Minecraft server software for the Bedrock Edition that comes with a modern API and support for Java 11 LTS.
  tags:
  - eula
  - java_version
  - pid_limit
container:
  image: ghcr.io/parkervcp/yolks:java_16
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 2Gi
    max: 4Gi
    swap: 512Mi
  disk:
    min: 10Gi
    io_priority: normal
startup:
  command: java
  args:
  - --add-opens
  - java.base/java.nio=io.netty.common
  - --add-exports
  - java.base/jdk.internal.misc=io.netty.common
  - -p
  - modules
  - -m
  - gomint.server/io.gomint.server.Bootstrap
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables: []
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
