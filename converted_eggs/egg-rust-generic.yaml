metadata:
  id: rust-generic
  name: rust generic
  version: PTDL_v2
  game: rust
  author: ethan@ethancoward.dev
  description: Creates a container that runs rust with cargo.
container:
  image: ghcr.io/parkervcp/yolks:rust_1.60
  environment: {}
resources:
  cpu:
    min: 2000
    max: 4000
    shares: 1024
  memory:
    min: 4Gi
    max: 8Gi
    swap: 512Mi
  disk:
    min: 20Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - if [[ -d .git ]] && [[ {{AUTO_UPDATE}} == "1" ]]; then git pull; fi; cargo run --release
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: GIT_ADDRESS
  description: "Git repo to clone\r\n\r\nI.E. https://github.com/parkervcp/repo_name"
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: BRANCH
  description: "What branch to pull from github.\r\n\r\nDefault is blank to pull the repo default branch"
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: AUTO_UPDATE
  description: Pull the latest files on startup when using a GitHub repo.
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: USERNAME
  description: Username to auth with git.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: ACCESS_TOKEN
  description: "Password to use with git.\r\n\r\nIt's best practice to use a Personal Access Token.\r\nhttps://github.com/settings/tokens\r\nhttps://gitlab.com/-/profile/personal_access_tokens"
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
