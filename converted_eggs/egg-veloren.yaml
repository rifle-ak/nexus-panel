metadata:
  id: veloren
  name: Veloren
  version: PTDL_v2
  game: minecraft
  author: parker@parkervcp.com
  description: 'Veloren is a multiplayer voxel RPG written in Rust. It is inspired by games such as Cube World, Legend of Zelda: Breath of the Wild, Dwarf Fortress and Minecraft.'
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 2Gi
    max: 4Gi
    swap: 512Mi
  disk:
    min: 10Gi
    io_priority: normal
startup:
  command: ./veloren-server-cli
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: shutdown graceful 10
      timeout: 30s
variables:
- name: VERSION
  description: "weekly = download the latest weekly build.\r\nnightly = download the latest nightly build."
  default: weekly
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - weekly
    - nightly
- name: SERVER_NAME
  description: The name your server will be displaying
  default: A pterodactyl hosted server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: METRICS_PORT
  description: Game port +1
  default: '14005'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
networking:
  ports:
  - name: Metrics port
    internal: '{{METRICS_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{METRICS_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
