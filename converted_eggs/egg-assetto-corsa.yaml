metadata:
  id: assetto-corsa
  name: Assetto Corsa
  version: PTDL_v2
  game: generic
  author: admin@softwarenoob.com
  description: Assetto Corsa (Italian for "Race Setup") is a sim racing video game developed by the Italian video game developer Kunos Simulazioni. It is designed with an emphasis on a realistic racing experience with support for extensive customization and moddability
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/steamcmd:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./acServer
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\nif [ \"${STEAM_USER}\" == \"anonymous\" ]; then\r\n    echo -e \"ERROR - STEAM USER NOT SET\\n\"\r\n    echo -e \"Steam account must have the dedicated server in library to install and host the game\\n\"\r\n    echo -e \"You must configure Steam account in the server startup variables, after that reinstall the server\\n\"\r\nfi\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: STEAM_USER
  description: A steam username of an account that owns the game is required
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: STEAM_PASS
  description: Steam User Password
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: STEAM_AUTH
  description: Steam Auth Code required if the Steam Account is using Steam Auth. Slow installs will cause the code to expire before it can be used.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: HOSTNAME
  description: Name of the server
  default: Pterodactyl Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: PASSWORD
  description: If enabled players must enter the password to join the server
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: ADMIN_PASSWORD
  description: Used to login as server administrator, type /help in-game for more
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: HTTP_PORT
  description: HTTP Port
  default: ''
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: SRCDS_APPID
  description: ''
  default: '302550'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: AUTO_UPDATE
  description: autoupdate Server on start or restart. 1 = on; 0 = off
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WINDOWS_INSTALL
  description: Required to always install and update the correct version of the game.
  default: '1'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports:
  - name: HTTP Port
    internal: '{{HTTP_PORT}}'
    protocol: udp
    required: false
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{HTTP_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
