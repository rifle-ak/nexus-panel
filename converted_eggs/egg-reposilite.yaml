metadata:
  id: reposilite
  name: Reposilite
  version: PTDL_v2
  game: generic
  author: mk@kcra.me
  description: Lightweight and easy-to-use repository management software dedicated for Maven based artifacts in the JVM ecosystem.
container:
  image: ghcr.io/pterodactyl/yolks:java_11
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: java
  args:
  - -Xmx{{SERVER_MEMORY}}M
  - -Dreposilite.port={{SERVER_PORT}}
  - -jar
  - reposilite.jar
  - --port
  - '{{SERVER_PORT}}'
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: REPOSILITE_VERSION
  description: The version of Reposilite.
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
