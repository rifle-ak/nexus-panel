metadata:
  id: terraria-vanilla
  name: Terraria Vanilla
  version: PTDL_v2
  game: terraria
  author: iamkubi@gmail.com
  description: Dig, fight, explore, build! Nothing is impossible in this action-packed adventure game.
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./TerrariaServer.bin.x86_64
  args:
  - -config
  - serverconfig.txt
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: exit
      timeout: 30s
variables:
- name: TERRARIA_VERSION
  description: "the version of Terraria that is to be used.\r\n\r\nYou can use the full version number or the file number. (ex. 1.3.5.3 or 1353)\r\n\r\nGet version numbers here - https://terraria.wiki.gg/wiki/Server#Downloads"
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WORLD_NAME
  description: The name for the world file.
  default: world
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_PLAYERS
  description: The maximum number of players a server will hold.
  default: '8'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WORLD_SIZE
  description: Defines the worlds size. 3 sizes 1 (small), 2 (medium), 3 (large).
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - '1'
    - '2'
    - '3'
- name: WORLD_DIFFICULTY
  description: "World Difficulty\r\n\r\nOptions: 0(normal), 1(expert), 2(master), 3(journey)"
  default: '3'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - '0'
    - '1'
    - '2'
    - '3'
- name: SERVER_MOTD
  description: Server MOTD
  default: Welcome!
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WORLD_SEED
  description: The Seed to use when creating the World
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: PASSWORD
  description: The password which should be used.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: NPCSTREAM
  description: Reduces enemy skipping but increases bandwidth usage. The lower the number the less skipping will happen, but more data is sent. 0 is off.
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 0
    - 60
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
