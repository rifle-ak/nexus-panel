metadata:
  id: muse
  name: Muse
  version: PTDL_v2
  game: generic
  author: hello@apollo.moe
  description: 🎧 a self-hosted midwestern Discord music bot that doesn't suck
container:
  image: ghcr.io/parkervcp/yolks:nodejs_20
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: npm
  args:
  - start
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: discord_token
  description: Discord Bot Token
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: data_dir
  description: 'Default: ./data'
  default: ./data
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: api_key
  description: 'You can get it here: https://console.developers.google.com/'
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: client_id
  description: 'You can get it here: https://developer.spotify.com/dashboard/applications'
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: client_secret
  description: 'You can get it here: https://developer.spotify.com/dashboard/applications'
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: VERSION
  description: "Specify a version, for example: \"v2.4.1\"\r\nFor the latest version, type \"latest\""
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
