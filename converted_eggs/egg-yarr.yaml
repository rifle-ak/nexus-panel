metadata:
  id: yarr
  name: Yarr
  version: PTDL_v2
  game: generic
  author: sotoluis90@gmail.com
  description: Yarr is a selfhosted feed aggregator
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./yarr
  args:
  - -addr
  - 0.0.0.0:{{SERVER_PORT}}
  - -auth="{{USERNAME}}:{{PASSWORD}}"
  - -db=./feed.sql
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: USERNAME
  description: The username used to log in to yarr
  default: username
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: PASSWORD
  description: The password needed to log in to yarr
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
