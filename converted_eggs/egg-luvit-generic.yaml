metadata:
  id: luvit-generic
  name: luvit generic
  version: PTDL_v2
  game: generic
  author: parker@parkervcp.com
  description: "A generic luvit egg This will clone a git repo. It defaults to master if no branch is specified.\r\n\r\nSupports the discordia lua framework."
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./luvit
  args:
  - '{{LUA_FILE}}'
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^c
      timeout: 30s
variables:
- name: USERNAME
  description: Username to auth with git.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: ACCESS_TOKEN
  description: "Password to use with git.\r\n\r\nIt's best practice to use a Personal Access Token.\r\nhttps://github.com/settings/tokens\r\nhttps://gitlab.com/-/profile/personal_access_tokens"
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: GIT_ADDRESS
  description: "GitHub Repo to clone\r\n\r\nI.E. https://github.com/parkervcp/repo_name"
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: USER_UPLOAD
  description: "Skip all the install stuff if you are letting a user upload files.\r\n\r\n0 = false (default)\r\n1 = true"
  default: '0'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: BRANCH
  description: "What branch to pull from github.\r\n\r\nDefault is blank to pull the repo default branch"
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: LUA_FILE
  description: The Lua file to run
  default: app.lua
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: LIT_PACKAGES
  description: "Lit Packages to install\r\n\r\nexample\r\nSinisterRectus/discordia lduboeuf/cjson"
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
