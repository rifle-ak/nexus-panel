metadata:
  id: lavalink
  name: Lavalink
  version: PTDL_v2
  game: generic
  author: damuffin36@gmail.com
  description: "A standalone audio sending node based on Lavaplayer and Koe. Allows for sending audio without it ever reaching any of your shards.\r\nDescription taken from https://github.com/freyacodes/Lavalink"
container:
  image: ghcr.io/parkervcp/yolks:java_17
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: java
  args:
  - -jar
  - Lavalink.jar
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: VERSION
  description: ''
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: GITHUB_PACKAGE
  description: ''
  default: lavalink-devs/Lavalink
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: MATCH
  description: ''
  default: Lavalink.jar
  required: true
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
