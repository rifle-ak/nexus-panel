metadata:
  id: cs2d
  name: CS2D
  version: PTDL_v2
  game: generic
  author: josdekurk@gmail.com
  description: Plant and defuse bombs, rescue hostages or accomplish new missions like capture the flag or domination! Use a huge arsenal of weapons and equipment including crazy stuff like portal guns, lasers, RPGs, turrets and much more! You can even build things!
container:
  image: ghcr.io/parkervcp/games:source
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./cs2d_dedicated
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: SERVER_NAME
  description: ''
  default: CS2D Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_PASSWORD
  description: ''
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: SERVER_PLAYERS
  description: ''
  default: '12'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
