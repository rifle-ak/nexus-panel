metadata:
  id: risk-of-rain-2
  name: Risk of Rain 2
  version: PTDL_v2
  game: generic
  author: alex.chang-lam@protonmail.com
  description: Risk of Rain 2 dedicated server.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/yolks:wine_latest
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: xvfb-run
  args:
  - wine
  - ./"Risk
  - of
  - Rain
  - 2.exe"
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n# Image to install with is 'ghcr.io/parkervcp/installers:debian'\r\n\r\n##\r\n#\r\n# Variables\r\n# STEAM_USER, STEAM_PASS, STEAM_AUTH - Steam user setup. If a user has 2fa enabled it will most likely fail due to timeout. Leave blank for anon install.\r\n# WINDOWS_INSTALL - if it's a windows server you want to install set to 1\r\n# SRCDS_APPID - steam app id found here - https://developer.valvesoftware.com/wiki/Dedicated_Servers_List\r\n# SRCDS_BETAID - beta branch of a steam app. Leave blank to install normal branch\r\n# SRCDS_BETAPASS - password for a beta branch should one be required during private or closed testing phases.. Leave blank for no password.\r\n# INSTALL_FLAGS - Any additional SteamCMD  flags to pass during install.. Keep in mind that steamcmd auto update process in the docker image might overwrite or ignore these when it performs update on server boot.\r\n# AUTO_UPDATE - Adding this variable to the egg allows disabling or enabling automated updates on boot. Boolean value. 0 to disable and 1 to enable.\r\n#\r\n ##\r\n\r\n# Install packages. Default packages below are not required if using our existing install image thus speeding up the install process.\r\n#apt -y update\r\n#apt -y --no-install-recommends install curl lib32gcc-s1 ca-certificates\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n\r\n##steam serverlist fix\r\nmkdir -p /mnt/server/steamworks_sdk\r\n./steamcmd.sh +force_install_dir /mnt/server/steamworks_sdk +@sSteamCmdForcePlatformType windows +login anonymous +app_update 1007 +quit\r\ncp /mnt/server/steamworks_sdk/*64.dll /mnt/server/\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## add below your custom commands if needed\r\n\r\n#create custom server.cfg\r\ncp \"/mnt/server/Risk of Rain 2_Data/Config/server_startup.cfg\" \"/mnt/server/Risk of Rain 2_Data/Config/server.cfg\"\r\ntouch \"/mnt/server/Risk of Rain 2_Data/Config/server_pregame.cfg\"\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: PASSWORD
  description: Password to join server. Leave empty to disable.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: HOSTNAME
  description: The name that will be shown in the server browser.
  default: '"Risk of Rain 2 Dedicated Server"'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: PLAYERS
  description: Sets the maximum number of players.
  default: '4'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: ADVERTISE
  description: "Display the server in the public server browser.\r\n1 = enabled\r\n0 = disabled"
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: QUERY
  description: Query Port
  default: '27016'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: STEAM
  description: Steam Port is +1 query
  default: '27017'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: AUTO_UPDATE
  description: ''
  default: '1'
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_APPID
  description: ''
  default: '1180760'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINEDEBUG
  description: ''
  default: -all
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINEARCH
  description: ''
  default: win64
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINEPATH
  description: ''
  default: /home/container
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: XVFB
  description: ''
  default: '1'
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: WINDOWS_INSTALL
  description: ''
  default: '1'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINETRICKS_RUN
  description: ''
  default: mono
  required: true
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports:
  - name: Query Port
    internal: '{{QUERY}}'
    protocol: tcp
    required: true
  - name: Steam Port
    internal: '{{STEAM}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{QUERY}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
