metadata:
  id: ddracenetwork
  name: DDRaceNetwork
  version: PTDL_v2
  game: generic
  author: diedyesterdaywashere@gmail.com
  description: DDraceNetwork (DDNet) is an actively maintained version of DDRace, a Teeworlds modification with a unique cooperative gameplay.
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./DDNet-Server
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: VERSION
  description: Latest is the default, put "nightly" for beta, or enter the version number, for example "17.0".
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_NAME
  description: The name of the server
  default: My DDNet server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_PASSWORD
  description: Password for joining the server, empty for no password
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: SERVER_MAP
  description: Map to start server with
  default: Tutorial
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_REGISTER
  description: "Register the server to the server list.\r\n0 is disabled\r\nipv4 is enabled listening ipv4"
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - '0'
    - ipv4
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
