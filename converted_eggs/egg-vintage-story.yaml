metadata:
  id: vintage-story
  name: Vintage Story
  version: PTDL_v2
  game: generic
  author: mail@wuffy.eu
  description: Vintage Story is an uncompromising wilderness survival sandbox game inspired by lovecraftian horror themes. Find yourself in a ruined world reclaimed by nature and permeated by unnerving temporal disturbances. Relive the advent of human civilization, or take your own path.
container:
  image: ghcr.io/parkervcp/yolks:dotnet_7
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./VintagestoryServer
  args:
  - --dataPath
  - ./data
  - --port={{SERVER_PORT}}
  - --maxclients={{MAX_CLIENTS}}
  - '{{OPTIONS}}'
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: /stop
      timeout: 30s
variables:
- name: OPTIONS
  description: ''
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: FILES_BRANCH
  description: ''
  default: stable
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - stable
    - unstable
    - pre
- name: RELEASE_VERSION
  description: ''
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MAX_CLIENTS
  description: ''
  default: '16'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SQLITE_TMPDIR
  description: Defines the location for the temporary files in sqlite. This is needed for the "/db vacuum" command (added in 1.19) since else it will use the /tmp folder which by default only has 100MB and is in memory.
  default: /home/container/data/Backups
  required: true
  secret: false
  user_editable: false
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
