metadata:
  id: supertuxkart
  name: SuperTuxKart
  version: PTDL_v2
  game: generic
  author: mattamn107@github.com
  description: Egg for hosting a SuperTuxKart Server.
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./bin/supertuxkart
  args:
  - --server-config={{CONFIG_NAME}}
  - --lan-server={{SERVER_NAME}}
  - --network-console
  - --port="{{SERVER_PORT}}"
  - --difficulty={{DIFFICULTY}}
  - --mode={{MODE}}
  - --max-players={{MAX_PLAYERS}}
  - --motd="{{MOTD}}"
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: quit
      timeout: 30s
variables:
- name: SERVER_NAME
  description: The Name of the Server
  default: Pterodactyl_Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: CONFIG_NAME
  description: Name of the Config File.
  default: config.xml
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: regex
    pattern: /^([\w\d._-]+)(\.xml)$/
- name: MODE
  description: "0 = Normal Race\r\n1 = Time Trial\r\n2 = Battle\r\n3 = Soccer\r\n4 = Follow The Leader\r\n5 = Capture the Flag"
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - '0'
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
- name: DIFFICULTY
  description: "Speed of the carts and AI difficulty\r\n0 = Beginner\r\n1 = Intermediate\r\n2 = Expert\r\n3 = SuperTux"
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - '0'
    - '1'
    - '2'
    - '3'
- name: MAX_PLAYERS
  description: How many players can there be in the server.
  default: '8'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 1
    - 24
- name: MOTD
  description: Message of the Day displayed in the server.
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
