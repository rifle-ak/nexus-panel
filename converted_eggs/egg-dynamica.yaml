metadata:
  id: dynamica
  name: Dynamica
  version: PTDL_v2
  game: generic
  author: sebastian.pietschner@gmail.com
  description: An easy-to-use dynamic voice channel bot.
container:
  image: ghcr.io/parkervcp/yolks:nodejs_18
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - npx prisma migrate deploy && yarn start
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: DATABASE_URL
  description: The path in which to create the sqlite database.
  default: file:/home/container/dynamica/db.sqlite
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: TOKEN
  description: The token for the discord bot.
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: GUILD_ID
  description: Add only if using the bot in a single guild.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: SENTRY_DSN
  description: The DSN for Sentry.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MQTT_URL
  description: The URL for the MQTT broker.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MQTT_USER
  description: The username for the MQTT broker.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: MQTT_PASS
  description: The password for the MQTT broker.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
