metadata:
  id: no-one-survived
  name: No One Survived
  version: PTDL_v2
  game: generic
  author: josdekurk@gmail.com
  description: This is a multiplayer cooperative open world construction survival sandbox game, where you and your friends must find supplies and build shelters in this world. You have to keep an eye on your character's needs state at all times, a bad state is likely to lead to death.
container:
  image: ghcr.io/parkervcp/yolks:wine_staging
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: wine
  args:
  - WRSHServer.exe
  - -server
  - -log
  - -Port={{SERVER_PORT}}
  - -QueryPort={{QUERY_PORT}}
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n# Image to install with is 'ghcr.io/parkervcp/installers:debian'\r\n\r\n# Install packages. Default packages below are not required if using our existing install image thus speeding up the install process.\r\n#apt -y update\r\n#apt -y --no-install-recommends install curl lib32gcc-s1 ca-certificates\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## add below your custom commands if needed\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: WINDOWS_INSTALL
  description: ''
  default: '1'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: SRCDS_APPID
  description: ''
  default: '2329680'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '2329680'
- name: AUTO_UPDATE
  description: Auto update the server on restart
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: WINEDEBUG
  description: ''
  default: -all
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINEARCH
  description: ''
  default: win64
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - win64
    - win32
- name: WINEPATH
  description: ''
  default: /home/container
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: WINETRICKS_RUN
  description: ''
  default: vcrun2022 corefonts
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: QUERY_PORT
  description: ''
  default: '27015'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: STEAM_NETWORKING
  description: "Enable or disable steam networking.\r\nLeave this to False as with True it will fail to start!"
  default: 'False'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'False'
    - 'True'
- name: SERVER_SAVE_NAME
  description: The name of the archive, which is also the archive loaded by default.
  default: MySave
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_NAME
  description: The name of the server
  default: Test
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SERVER_NEED_PASSWORD
  description: True indicates that the server needs a password and False indicates that it does not need a password.
  default: 'False'
  required: true
  secret: true
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'False'
    - 'True'
- name: SERVER_PASSWORD
  description: The password for the server. Only works if 'Toggle server password' is set to True
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: SERVER_PLAYERS
  description: The maximum amount of players the server can join
  default: '50'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
  rules:
  - type: port
    range:
    - 1
    - 100
- name: SERVER_NUM_ZOMBIES
  description: Number of zombies generated by the wave of corpse tide (25-100).
  default: '50'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 25
    - 100
- name: SERVER_REGION
  description: All = non-registered region, AF = Africa, AS = Asia, EU = Europe, NA = North America, OC = Oceania, and SA = South America.
  default: All
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - All
    - AF
    - AS
    - EU
    - NA
    - OC
    - SA
- name: SERVER_ADMIN_PASSWORD
  description: Server administrator password
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: Query Port
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{QUERY_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
