metadata:
  id: rathole
  name: Rathole
  version: PTDL_v2
  game: rust
  author: tunayada@gmail.com
  description: A lightweight and high-performance reverse proxy for NAT traversal, written in Rust. An alternative to frp and ngrok.
container:
  image: ghcr.io/parkervcp/yolks:rust_latest
  environment: {}
resources:
  cpu:
    min: 2000
    max: 4000
    shares: 1024
  memory:
    min: 4Gi
    max: 8Gi
    swap: 512Mi
  disk:
    min: 20Gi
    io_priority: normal
startup:
  command: ./rathole
  args:
  - server.toml
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: VERSION
  description: ''
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: TOKEN
  description: Your random token
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
