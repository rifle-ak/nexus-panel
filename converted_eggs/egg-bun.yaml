metadata:
  id: bun
  name: Bun
  version: PTDL_v2
  game: generic
  author: mratox@protonmail.com
  description: Bun is an incredibly fast JavaScript runtime, transpiler bundler, and npm package manager all-in-one.
container:
  image: ghcr.io/parkervcp/yolks:bun_latest
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - if [[ -d .git ]] && [[ {{AUTO_UPDATE}} == "1" ]]; then git pull; fi; if [[ ! -z ${BUN_PACKAGES} ]]; then bun install ${BUN_PACKAGES}; fi; if [[ ! -z ${RMBUN_PACKAGES} ]]; then bun remove ${RMBUN_PACKAGES}; fi; if [ -f /home/container/package.json ]; then bun install; fi; bun run {{MAIN_FILE}}
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: GIT_ADDRESS
  description: The Git repository address to clone .
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: USER_UPLOAD
  description: "Skip all the install stuff if you are letting a user upload files.\r\n0 = false (default)\r\n1 = true"
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: AUTO_UPDATE
  description: "Pull the latest files on startup when using a Git Repository.\r\n0 = false (default)\r\n1 = true"
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MAIN_FILE
  description: The main file passed to the bun run command
  default: index.js
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BUN_PACKAGES
  description: "Install additional bun packages.\r\nUse spaces to separate"
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: RMBUN_PACKAGES
  description: "Uninstall bun packages.\r\nUse spaces to separate"
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: BRANCH
  description: The Git branch to install.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: USERNAME
  description: Git username for authentication.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: ACCESS_TOKEN
  description: Git access token for authentication.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
