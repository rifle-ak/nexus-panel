metadata:
  id: elasticsearch
  name: Elasticsearch
  version: PTDL_v2
  game: generic
  author: dominic@stilma.net
  description: Elasticsearch is a distributed, RESTful search and analytics engine capable of addressing a growing number of use cases. As the heart of the Elastic Stack, it centrally stores your data for lightning fast search, fine‑tuned relevancy, and powerful analytics that scale with ease.
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./bin/elasticsearch
  args:
  - -E
  - network.host=0.0.0.0
  - -E
  - http.port={{SERVER_PORT}}
  - -E
  - discovery.type={{DISCOVERY_SEED_HOSTS}}
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: DISCOVERY_SEED_HOSTS
  description: Please keep default if you are unsure.
  default: single-node
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: VERSION
  description: Go to https://www.elastic.co/downloads/elasticsearch and look at the version at the top.
  default: 8.13.0
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
