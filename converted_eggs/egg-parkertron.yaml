metadata:
  id: parkertron
  name: parkertron
  version: PTDL_v2
  game: ark
  author: parker@parkervcp.com
  description: "The stupid chatbot parkertron by Parkervcp.\r\n\r\nhttps://github.com/parkervcp/parkertron"
container:
  image: ghcr.io/parkervcp/yolks:bot_parkertron
  environment: {}
resources:
  cpu:
    min: 4000
    max: 6000
    shares: 1024
  memory:
    min: 8Gi
    max: 16Gi
    swap: 512Mi
  disk:
    min: 50Gi
    io_priority: normal
startup:
  command: ./parkertron
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: shutdown
      timeout: 30s
variables: []
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
