metadata:
  id: nodemon
  name: nodemon
  version: PTDL_v2
  game: generic
  author: nick@blackforthosting.com
  description: "Nodemon javascript egg that automatically restarts the node application when file changes in the directory are detected\r\n\r\nThis will clone a git repo for a bot. it defaults to master if no branch is specified.\r\n\r\nInstalls the node_modules on install. If you set user_upload, then I assume you know what you are doing."
container:
  image: ghcr.io/parkervcp/yolks:nodejs_17
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - npm install nodemon; if [[ -d .git ]] && [[ {{AUTO_UPDATE}} == "1" ]]; then git pull; fi; if [[ ! -z ${NODE_PACKAGES} ]]; then /usr/local/bin/npm install ${NODE_PACKAGES}; fi; if [[ ! -z ${UNNODE_PACKAGES} ]]; then /usr/local/bin/npm uninstall ${UNNODE_PACKAGES}; fi; if [ -f /home/container/package.json ]; then /usr/local/bin/npm install --production; fi; /home/container/node_modules/nodemon/bin/nodemon.js /home/container/{{BOT_JS_FILE}}
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: GIT_ADDRESS
  description: "GitHub Repo to clone\r\n\r\nI.E. https://github.com/nickdevnl/repo_name"
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: BRANCH
  description: The branch of the bot to install.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: USER_UPLOAD
  description: "Skip all the install stuff if you are letting a user upload files.\r\n\r\n0 = false (default)\r\n1 = true"
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: AUTO_UPDATE
  description: Pull the latest files on startup when using a GitHub repo. You must have .git folder, reinstall if you are missing it.
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BOT_JS_FILE
  description: The file that starts the bot.
  default: index.js
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: NODE_PACKAGES
  description: "Install additional node packages.\r\n\r\nUse spaces to separate."
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: UNNODE_PACKAGES
  description: "Uninstall node packages.\r\n\r\nUse spaces to separate."
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: USERNAME
  description: Username to auth with git.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: ACCESS_TOKEN
  description: "Password to use with git.\r\n\r\nIt's best practice to use a Personal Access Token.\r\nhttps://github.com/settings/tokens\r\nhttps://gitlab.com/-/profile/personal_access_tokens"
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
