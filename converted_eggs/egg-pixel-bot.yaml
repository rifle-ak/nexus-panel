metadata:
  id: pixel-bot
  name: pixel-bot
  version: PTDL_v2
  game: generic
  author: parker@parkervcp.com
  description: "A Discord bot written in Python using discord.py\r\n\r\nhttps://github.com/Ispira/pixel-bot"
container:
  image: ghcr.io/parkervcp/yolks:python_3.7
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: /usr/local/bin/python
  args:
  - bot.py
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: OWNER_UID
  description: The Discord UID of the bot owner.
  default: copy from discord
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BOT_TOKEN
  description: Get the app token from https://discordapp.com/developers/applications/me
  default: get from discord developers
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: BOT_NAME
  description: The name that you want set for the bot
  default: Ispyra
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: IMGUR_KEY
  description: "Add your Imgur API client_id if you want. \r\n\r\nhttps://api.imgur.com/oauth2/addclient"
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: IMGUR_SECRET
  description: "Add your Imgur API client_secret if you want. \r\n\r\nhttps://api.imgur.com/oauth2/addclient"
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
