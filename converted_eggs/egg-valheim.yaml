metadata:
  id: valheim
  name: Valheim
  version: PTDL_v2
  game: valheim
  author: magi1053@outlook.com
  description: A brutal exploration and survival game for 1-10 players, set in a procedurally-generated purgatory inspired by viking culture.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/games:valheim
  environment: {}
resources:
  cpu:
    min: 2000
    max: 4000
    shares: 1024
  memory:
    min: 4Gi
    max: 8Gi
    swap: 512Mi
  disk:
    min: 10Gi
    io_priority: normal
startup:
  command: bash
  args:
  - -c
  - ./valheim_server.x86_64 -nographics -batchmode -name "{{SERVER_NAME}}" -port {{SERVER_PORT}} -world "{{WORLD}}" -password "{{PASSWORD}}" -public {{PUBLIC_SERVER}} -saveinterval {{BACKUP_INTERVAL}} -backups {{BACKUP_COUNT}} -backupshort {{BACKUP_SHORTTIME}} -backuplong {{BACKUP_LONGTIME}} $( [[ {{ENABLE_CROSSPLAY}} -eq 1 ]] && echo " -crossplay ") > >(sed -uE "{{CONSOLE_FILTER}}") & trap "{{STOP}}" 15; wait $!
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# steamcmd Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n# Image to install with is 'ghcr.io/parkervcp/installers:debian'\r\n\r\n##\r\n#\r\n# Variables\r\n# STEAM_USER, STEAM_PASS, STEAM_AUTH - Steam user setup. If a user has 2fa enabled it will most likely fail due to timeout. Leave blank for anon install.\r\n# WINDOWS_INSTALL - if it's a windows server you want to install set to 1\r\n# SRCDS_APPID - steam app id found here - https://developer.valvesoftware.com/wiki/Dedicated_Servers_List\r\n# SRCDS_BETAID - beta branch of a steam app. Leave blank to install normal branch\r\n# SRCDS_BETAPASS - password for a beta branch should one be required during private or closed testing phases.. Leave blank for no password.\r\n# INSTALL_FLAGS - Any additional SteamCMD  flags to pass during install.. Keep in mind that steamcmd auto update process in the docker image might overwrite or ignore these when it performs update on server boot.\r\n# AUTO_UPDATE - Adding this variable to the egg allows disabling or enabling automated updates on boot. Boolean value. 0 to disable and 1 to enable.\r\n#\r\n ##\r\n\r\n# Install packages. Default packages below are not required if using our existing install image thus speeding up the install process.\r\napt -y update\r\napt -y --no-install-recommends install curl lib32gcc-s1 ca-certificates\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit ## other flags may be needed depending on install. looking at you cs 1.6\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so"
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: SERVER_NAME
  description: Name that appears in server browser.
  default: My Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: PASSWORD
  description: Server password.
  default: secret
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: WORLD
  description: Name to load if switching between multiple saved worlds.
  default: Dedicated
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: PUBLIC_SERVER
  description: Public visibility of your server. Set it to false to make the server invisible and only joinable via the 'Join IP'-button.
  default: '1'
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_APPID
  description: Valheim steam app id for auto updates.
  default: '896660'
  required: false
  secret: false
  user_editable: false
  user_viewable: true
- name: LD_LIBRARY_PATH
  description: Required to load server libraries.
  default: ./linux64
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: STOP
  description: Commands to trigger a server shutdown.
  default: kill -2 $!; wait;
  required: true
  secret: false
  user_editable: false
  user_viewable: false
- name: AUTO_UPDATE
  description: Enable automatic updates.
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: ENABLE_CROSSPLAY
  description: Enable crossplay support.
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BACKUP_INTERVAL
  description: 'Change how often the world will save in seconds. Default: 1800 (30 minutes).'
  default: '1800'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BACKUP_COUNT
  description: 'Sets how many automatic backups will be kept. The first is the ''short'' backup length, and the rest are the ''long'' backup length. When default values are used means one backup that is 2 hours old, and 3 backups that are 12 hours apart. Default: 4.'
  default: '4'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BACKUP_SHORTTIME
  description: 'Sets the interval between the first automatic backups in seconds. Default: 7200 (2 hours).'
  default: '7200'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BACKUP_LONGTIME
  description: 'Sets the interval between the subsequent automatic backups in seconds. Default: 43200 (12 hours).'
  default: '43200'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_BETAID
  description: Beta branch of a steam app. Leave blank to install normal branch.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_BETAPASS
  description: Password for a beta branch should one be required during private or closed testing phases. Leave blank for no password.
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: CONSOLE_FILTER
  description: Remove unwanted outputs from the console.
  default: /^\(Filename:.*Line:[[:space:]]+[[:digit:]]+\)$/d; /^([[:space:]]+)?$/d
  required: false
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
