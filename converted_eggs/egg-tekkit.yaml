metadata:
  id: tekkit
  name: Tekkit
  version: PTDL_v2
  game: minecraft
  author: contact@zennodes.dk
  description: Tekkit is set to reignite the same sort of wonder and awe that we all received from booting up Minecraft for the first time. With the skies open, the moon ready to be colonized (by force if need be) and dimensional mysteries to be plied, with tesseracts to be networked, “meat” to be processed, items to be digitized, and power suits to be manufactured, there is virtually limitless engineering projects to be assembled.
  tags:
  - eula
  - java_version
  - pid_limit
container:
  image: ghcr.io/parkervcp/yolks:java_8
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 2Gi
    max: 4Gi
    swap: 512Mi
  disk:
    min: 10Gi
    io_priority: normal
startup:
  command: java
  args:
  - -Xms128M
  - -Xmx{{SERVER_MEMORY}}M
  - -jar
  - Tekkit.jar
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: MODPACK_VERSION
  description: ''
  default: v1.2.9g-2
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
