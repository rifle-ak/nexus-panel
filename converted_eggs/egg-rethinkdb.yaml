metadata:
  id: rethinkdb
  name: rethinkdb
  version: PTDL_v2
  game: generic
  author: josdekurk@gmail.com
  description: The open-source database for the realtime web
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./rethinkdb
  args:
  - --bind
  - 0.0.0.0
  - --cluster-port
  - '{{SERVER_PORT}}'
  - --driver-port
  - '{{DRIVER_PORT}}'
  - --http-port
  - '{{HTTP_PORT}}'
  - --initial-password
  - auto
  - --no-http-admin
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^C
      timeout: 30s
variables:
- name: VERSION
  description: ''
  default: 2.4.4
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: DRIVER_PORT
  description: ''
  default: '25568'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: HTTP_PORT
  description: ''
  default: '25569'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
networking:
  ports:
  - name: Driver port
    internal: '{{DRIVER_PORT}}'
    protocol: udp
    required: true
  - name: Http port
    internal: '{{HTTP_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{DRIVER_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
