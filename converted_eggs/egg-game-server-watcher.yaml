metadata:
  id: game-server-watcher
  name: Game Server Watcher
  version: PTDL_v2
  game: generic
  author: a-sync@devs.space
  description: A simple discord/telegram/slack bot that can be hosted on a free service to monitor your game servers and players in style. 😎
container:
  image: ghcr.io/parkervcp/yolks:nodejs_20
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: env
  args:
  - PORT={{SERVER_PORT}}
  - /usr/local/bin/node
  - /home/container/dist/server.js
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: SECRET
  description: Admin secret
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: DATA_PATH
  description: Writable folder for data storage
  default: ./data/
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: REFRESH_TIME_MINUTES
  description: Game server info refresh interval in minutes
  default: '2'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: DISCORD_BOT_TOKEN
  description: Discord bot token
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: TELEGRAM_BOT_TOKEN
  description: Telegram bot token
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: STEAM_WEB_API_KEY
  description: Steam web API key
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: DBG
  description: Enable or disable debug mode.
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - '0'
    - '1'
- name: SLACK_BOT_TOKEN
  description: Slack bot token
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: SLACK_APP_TOKEN
  description: Slack app token
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
