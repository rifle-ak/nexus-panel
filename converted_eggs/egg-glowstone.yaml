metadata:
  id: glowstone
  name: Glowstone
  version: PTDL_v2
  game: minecraft
  author: support@pterodactyl.io
  description: 'Glowstone is an open-source server implementation for Minecraft: Java Edition 1.12.2 and up.'
container:
  image: ghcr.io/pterodactyl/yolks:java_17
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 2Gi
    max: 4Gi
    swap: 512Mi
  disk:
    min: 10Gi
    io_priority: normal
startup:
  command: java
  args:
  - -Xms768M
  - -Xmx{{SERVER_MEMORY}}M
  - -XX:+UseG1GC
  - -jar
  - '{{SERVER_JARFILE}}'
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: SERVER_JARFILE
  description: The name of the server jarfile to run the server with.
  default: glowstone.jar
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: regex
    pattern: /^([\w\d._-]+)(\.jar)$/
- name: VERSION
  description: The version of Glowstone to download. If it ends in SNAPSHOT, it will attempt to download from the maven repository.
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: GITHUB_USER
  description: "GitHub user to use for api calls.\r\n\r\nThis only needs to be set if you hit the GitHub API too often across multiple servers."
  default: ''
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: GITHUB_OAUTH_TOKEN
  description: "This can be either an OAuth or a Personal Access Token.\r\n\r\nThis is required for the install is you set a user."
  default: ''
  required: false
  secret: true
  user_editable: false
  user_viewable: false
- name: GITHUB_PACKAGE
  description: The repository to download from.
  default: GlowstoneMC/Glowstone
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: MATCH
  description: ''
  default: glowstone.jar
  required: true
  secret: false
  user_editable: false
  user_viewable: false
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
