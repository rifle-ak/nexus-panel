metadata:
  id: beammp-servers
  name: BeamMP Servers
  version: PTDL_v2
  game: generic
  author: noah@noahserver.online
  description: This is the server for the multiplayer mod BeamMP for the game BeamNG.drive. The server is the point through which all clients communicate. You can write lua mods for the server, detailed instructions on the BeamMP Wiki.
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./BeamMP-Server
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: exit
      timeout: 30s
variables:
- name: NAME
  description: The name of your server. This is what appears on the server list.
  default: BeamMP Server
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: DESCRIPTION
  description: Sets the server description
  default: BeamMP Default Description
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: VERSION
  description: "The BeamMP server version to be installed. Latest or invalid versions will default to latest. See all available versions at https://github.com/BeamMP/BeamMP-Server/releases\r\n\r\nexample: v3.1.0 or  v2.2.0 or latest"
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: AUTHKEY
  description: The authentication key for your server. A key can be obtained from the BeamMP keymaster at https://keymaster.beammp.com
  default: ''
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: MAX_PLAYERS
  description: The maximum number of players allowed on the server.
  default: '6'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: PRIVATE
  description: Should the server be private?
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: MAX_CARS
  description: The maximum number of cars allowed to be spawned per player.
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MAP
  description: "The map for your server. Stock maps are listed below.\r\n\r\n/levels/gridmap_v2/info.json\r\n/levels/automation_test_track/info.json\r\n/levels/east_coast_usa/info.json\r\n/levels/hirochi_raceway/info.json\r\n/levels/italy/info.json\r\n/levels/jungle_rock_island/info.json\r\n/levels/industrial/info.json\r\n/levels/small_island/info.json\r\n/levels/smallgrid/info.json\r\n/levels/utah/info.json\r\n/levels/west_coast_usa/info.json\r\n/levels/driver_training/info.json\r\n/levels/derby/info.json"
  default: /levels/gridmap_v2/info.json
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: LOGCHAT
  description: Enable chat logging by the server
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
