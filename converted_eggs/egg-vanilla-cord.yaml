metadata:
  id: vanillacord
  name: VanillaCord
  version: PTDL_v2
  game: minecraft
  author: support@pterodactyl.io
  description: "Minecraft is a game about placing blocks and going on adventures. Explore randomly generated worlds and build amazing things from the simplest of homes to the grandest of castles. Play in Creative Mode with unlimited resources or mine deep in Survival Mode, crafting weapons and armor to fend off dangerous mobs. Do all this alone or with friends.\r\n\r\nVanillaCord adds support for BungeeCord's ip_forward setting."
  tags:
  - eula
  - java_version
  - pid_limit
container:
  image: ghcr.io/pterodactyl/yolks:java_17
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 2Gi
    max: 4Gi
    swap: 512Mi
  disk:
    min: 10Gi
    io_priority: normal
startup:
  command: java
  args:
  - -Xms128M
  - -Xmx{{SERVER_MEMORY}}M
  - -jar
  - '{{SERVER_JARFILE}}'
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: stop
      timeout: 30s
variables:
- name: SERVER_JARFILE
  description: The name of the server jarfile to run the server with.
  default: server.jar
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: regex
    pattern: /^([\w\d._-]+)(\.jar)$/
- name: VANILLA_VERSION
  description: The version of Minecraft Vanilla to install. Use "latest" to install the latest version.
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 3
    - 15
networking:
  ports: []
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
