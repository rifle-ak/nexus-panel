metadata:
  id: american-truck-simulator-dedicated-server
  name: American Truck Simulator Dedicated Server
  version: PTDL_v2
  game: generic
  author: chase@cstmgames.com
  description: This will set up SteamCMD and all the required files for the newly released American Truck Simulator Dedicated server.  Simply placed the exported server config from your ATS instance to the .local/share/American Truck Simulator/ folder and select start.  Make sure that auto start is off on server creation to allow you to upload your config files.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/steamcmd:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./bin/linux_x64/amtrucks_server
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n\r\n## just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} +app_update ${SRCDS_APPID} validate +quit\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n\r\n## add below your custom commands if needed\r\nmkdir -p /mnt/server/.local/share/\"American Truck Simulator\"/\r\n\r\nCONFIG_FILE=/mnt/server/.local/share/\"American Truck Simulator\"/server_config.sii\r\nif [ ! -f \"$CONFIG_FILE\" ]; then\r\n    cd /mnt/server/.local/share/\"American Truck Simulator\"/\r\n    echo \"a config file does not yet exist making one!\"\r\n    curl -sSL -o server_config.sii https://raw.githubusercontent.com/parkervcp/eggs/master/game_eggs/steamcmd_servers/truck-simulator/server_config.sii\r\nfi\r\n\r\nPACKAGE_FILE=/mnt/server/.local/share/\"American Truck Simulator\"/server_packages.sii\r\nif [ ! -f \"$PACKAGE_FILE\" ]; then\r\n    cd /mnt/server/.local/share/\"American Truck Simulator\"/\r\n    echo \"a server_packages.sii file does not yet exist making one!\"\r\n    curl -sSL -o server_packages.sii https://raw.githubusercontent.com/parkervcp/eggs/master/game_eggs/steamcmd_servers/truck-simulator/american-truck-simulator/ats-files/server_packages.sii\r\nfi\r\n\r\nDATA_FILE=/mnt/server/.local/share/\"American Truck Simulator\"/server_packages.dat\r\nif [ ! -f \"$DATA_FILE\" ]; then\r\n    cd /mnt/server/.local/share/\"American Truck Simulator\"/\r\n    echo \"a server_packages.dat file does not yet exist making one!\"\r\n    curl -sSL -o server_packages.dat https://raw.githubusercontent.com/parkervcp/eggs/master/game_eggs/steamcmd_servers/truck-simulator/american-truck-simulator/ats-files/server_packages.dat\r\nfi\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: AUTO_UPDATE
  description: ''
  default: '1'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: SRCDS_APPID
  description: ''
  default: '2239530'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '2239530'
- name: QUERY_PORT
  description: By there readme of the game the query port must be between 27015-27020, but from our testing this port can be any port
  default: '27016'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: STEAM_TOKEN
  description: By default, whenever a dedicated server is launched it is using an anonymous account. For such an account non-persistent server id is generated (used for direct search). To avoid this you can acquire a logon token on https://steamcommunity.com/dev/managegameservers (game ownership is required)
  default: ''
  required: false
  secret: true
  user_editable: true
  user_viewable: true
- name: LOBBY_NAME
  description: ''
  default: American Truck Simulator
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: Query port
    internal: '{{QUERY_PORT}}'
    protocol: tcp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{QUERY_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
