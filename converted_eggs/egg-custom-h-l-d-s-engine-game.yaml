metadata:
  id: custom-hlds-engine-game
  name: Custom HLDS Engine Game
  version: PTDL_v2
  game: generic
  author: parker@parkervcp.com
  description: This option allows modifying the startup arguments and other details to run a custom HLDS based game on the panel.
  tags:
  - steam_disk_space
container:
  image: ghcr.io/parkervcp/games:source
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./hlds_run
  args:
  - -console
  - -game
  - '{{HLDS_GAME}}'
  - -port
  - '{{SERVER_PORT}}'
  - -sport
  - '{{VAC_PORT}}'
  - +map
  - '{{SRCDS_MAP}}'
  - +ip
  - 0.0.0.0
  - -strictportbind
  - -norestart
  working_dir: /home/container
  lifecycle:
    pre_start:
    - type: execute
      command: "#!/bin/bash\r\n# SRCDS Base Installation Script\r\n#\r\n# Server Files: /mnt/server\r\n\r\n# just in case someone removed the defaults.\r\nif [[ \"${STEAM_USER}\" == \"\" ]] || [[ \"${STEAM_PASS}\" == \"\" ]]; then\r\n    echo -e \"steam user is not set.\\n\"\r\n    echo -e \"Using anonymous user.\\n\"\r\n    STEAM_USER=anonymous\r\n    STEAM_PASS=\"\"\r\n    STEAM_AUTH=\"\"\r\nelse\r\n    echo -e \"user set to ${STEAM_USER}\"\r\nfi\r\n\r\n## download and install steamcmd\r\ncd /tmp\r\nmkdir -p /mnt/server/steamcmd\r\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\r\ntar -xzvf steamcmd.tar.gz -C /mnt/server/steamcmd\r\nmkdir -p /mnt/server/steamapps # Fix steamcmd disk write error when this folder is missing\r\ncd /mnt/server/steamcmd\r\n\r\n# SteamCMD fails otherwise for some reason, even running as root.\r\n# This is changed at the end of the install process anyways.\r\nchown -R root:root /mnt\r\nexport HOME=/mnt/server\r\n\r\n\r\n## install game using steamcmd\r\n./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH}  +app_set_config 90 mod ${HLDS_GAME} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' ) +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s \"-beta ${SRCDS_BETAID}\" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s \"-betapassword ${SRCDS_BETAPASS}\" ) ${INSTALL_FLAGS} validate +quit\r\n\r\n\r\n## set up 32 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk32\r\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\r\n\r\n## set up 64 bit libraries\r\nmkdir -p /mnt/server/.steam/sdk64\r\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\r\n\r\n## install end\r\necho \"-----------------------------------------\"\r\necho \"Installation completed...\"\r\necho \"-----------------------------------------\""
      condition: first_start
      timeout: 300s
    post_start: []
    pre_stop:
    - type: execute
      command: quit
      timeout: 30s
variables:
- name: SRCDS_APPID
  description: "The ID corresponding to the game to download and run using HLDS.\r\n\r\nThe HLDS server ID is 90. This should not be changed."
  default: '90'
  required: true
  secret: false
  user_editable: false
  user_viewable: false
  rules:
  - type: enum
    values:
    - '90'
- name: HLDS_GAME
  description: "The name corresponding to the game to download and run using HLDS.\r\n\r\nall the HLDS server names are here - https://developer.valvesoftware.com/wiki/Dedicated_Server_Name_Enumeration"
  default: cstrike
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: port
    range:
    - 1
    - 100
- name: SRCDS_MAP
  description: The default map for the server.
  default: de_dust2
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: VAC_PORT
  description: Specifies the VAC port the server should use. Default is 26900.
  default: '26900'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: STEAM_USER
  description: Steam account used to download files (Defaults to anonymous)
  default: ''
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: STEAM_PASS
  description: Password for Steam account
  default: ''
  required: false
  secret: true
  user_editable: false
  user_viewable: false
- name: STEAM_AUTH
  description: Steam Guard 2FA code for account
  default: ''
  required: false
  secret: false
  user_editable: false
  user_viewable: false
- name: SRCDS_BETAID
  description: Leave empty for the public branch, for the legacy version select steam_legacy.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - ''
    - steam_legacy
- name: AUTO_UPDATE
  description: Auto update on restart
  default: '0'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: VAC port
    internal: '{{VAC_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{VAC_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
