metadata:
  id: bastion
  name: Bastion
  version: PTDL_v2
  game: generic
  author: parker@parkervcp.com
  description: Bastion is a multi-purpose Discord Bot that can help you automate most tasks in your server, from administration and moderation to keeping the members active through various incentives, games and other fun activities
container:
  image: ghcr.io/parkervcp/yolks:bot_bastion
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: '{{STARTUP_CMD}}'
  args: []
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: BOT_TOKEN
  description: The Bot Token you get from https://discordapp.com/developers/applications/
  default: GETABOTTOKEN
  required: true
  secret: true
  user_editable: true
  user_viewable: true
- name: BOT_ID
  description: The Bot ID you get from https://discordapp.com/developers/applications/
  default: ''
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: MONGO_URI
  description: use `mongodb://127.0.0.1:27017/bastion` for using the build in mongodb server
  default: mongodb://127.0.0.1:27017/bastion
  required: true
  secret: false
  user_editable: true
  user_viewable: true
- name: BASTION_MUSIC_ACTIVITY
  description: When enabled, Bastion updates the activity to the currently playing track
  default: 'true'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: BASTION_RELAY_DMS
  description: When enabled, Bastion will relay any direct messages it receives to the owner of the bot application / team.
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: UNSAFE_MODE
  description: When enabled, this disables usage of unsafe commands like `exec` and `eval`.
  default: 'false'
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: BASTION_API_PORT
  description: Port used for Bastion API Server
  default: '8377'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
- name: BASTION_API_AUTH
  description: Auth for accessing the Bastion API Server.
  default: ''
  required: false
  secret: false
  user_editable: true
  user_viewable: true
- name: STARTUP_CMD
  description: "set to `npm start` if you just want to start the bot.\r\nset to `npm run commands` to activate the slash commands"
  default: npm start
  required: true
  secret: false
  user_editable: true
  user_viewable: true
  rules:
  - type: enum
    values:
    - npm start
    - npm run commands
networking:
  ports:
  - name: Bastion API Port
    internal: '{{BASTION_API_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{BASTION_API_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
