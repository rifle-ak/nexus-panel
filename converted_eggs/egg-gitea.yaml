metadata:
  id: gitea
  name: Gitea
  version: PTDL_v2
  game: generic
  author: mario.franze@gmail.com
  description: Gitea is a community managed lightweight code hosting solution written in Go. It is published under the MIT license.
container:
  image: ghcr.io/parkervcp/yolks:debian
  environment: {}
resources:
  cpu:
    min: 1000
    max: 2000
    shares: 1024
  memory:
    min: 1Gi
    max: 2Gi
    swap: 512Mi
  disk:
    min: 5Gi
    io_priority: normal
startup:
  command: ./gitea
  args:
  - web
  - -p
  - '{{SERVER_PORT}}'
  - -c
  - ./app.ini
  working_dir: /home/container
  lifecycle:
    pre_start: []
    post_start: []
    pre_stop:
    - type: execute
      command: ^^C
      timeout: 30s
variables:
- name: DISABLE_SSH
  description: Disable SSH feature when it’s not available
  default: 'false'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
  rules:
  - type: enum
    values:
    - 'true'
    - 'false'
- name: SSH_PORT
  description: SSH port displayed in clone URL.
  default: '2020'
  required: true
  secret: false
  user_editable: false
  user_viewable: true
  rules:
  - type: port
    range:
    - 1024
    - 65535
- name: VERSION
  description: you can use latest, nightly or version (e.g. 1.18.1)
  default: latest
  required: true
  secret: false
  user_editable: true
  user_viewable: true
networking:
  ports:
  - name: SSH Port
    internal: '{{SSH_PORT}}'
    protocol: udp
    required: true
  dns:
  - 1.1.1.1
  - 1.0.0.1
security:
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
  - type: connection_rate
    name: rate_limit_connections
    limit: 100/s
    action: drop
  - type: packet_size
    name: block_amplification
    max_size: 1500
    action: drop
monitoring:
  health_check:
    type: tcp
    port: '{{SSH_PORT}}'
    interval: 30s
    timeout: 5s
    failure_threshold: 3
  metrics: []
