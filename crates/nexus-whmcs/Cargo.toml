[package]
name = "nexus-whmcs"
version = "0.1.0"
edition = "2021"
description = "WHMCS integration for Nexus Panel - Provisioning, billing, and client area"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP client/server
reqwest = { version = "0.11", features = ["json"] }
axum = { version = "0.7", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
url = "2"
urlencoding = "2"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
