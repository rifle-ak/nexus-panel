[package]
name = "nexus-node"
version = "0.1.1"
edition = "2021"

[dependencies]
# Local crates
nexus-config = { path = "../nexus-config" }
nexus-marketplace = { path = "../nexus-marketplace" }
egg-importer = { path = "../egg-importer" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tokio-stream = "0.1"

# gRPC framework
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"

# Containerd client
containerd-client = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus = { version = "0.13", features = ["process"] }

# HTTP server for metrics
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
http = "1.0"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
bytes = "1.9"
futures = "0.3"
async-trait = "0.1"
hostname = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# Enterprise features - Authentication
jsonwebtoken = "9.3"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"

# Enterprise features - Rate limiting
governor = "0.6"

# Enterprise features - TLS
rustls = "0.23"
rustls-pemfile = "2.1"
tokio-rustls = "0.26"
webpki-roots = "0.26"

# Enterprise features - Configuration hot reload
notify = { version = "6.1", features = ["serde"] }
arc-swap = "1.7"
parking_lot = "0.12"

# Enterprise features - Distributed tracing
opentelemetry = { version = "0.24", features = ["trace"] }
opentelemetry-otlp = { version = "0.17", features = ["tonic"] }
tracing-opentelemetry = "0.25"
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"] }

# Enterprise features - Cloudflare integration
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Enterprise features - XDP firewall
nix = { version = "0.29", features = ["net", "fs"] }
libc = "0.2"

# File management
flate2 = "1.0"
tar = "0.4"
zip = "2.1"
mime_guess = "2.0"

# Scheduling
cron = "0.12"

# Directory traversal
walkdir = "2.5"

# Random number generation
rand = "0.8"

# System information
sysinfo = "0.31"

# Semantic version comparison (update checks)
semver = "1.0"
chrono-tz = "0.9"
argon2 = "0.5"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
russh = "0.45"
russh-sftp = "2"
russh-keys = "0.45"
object_store = { version = "0.11", features = ["aws"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3.14"
