name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # protoc is required: the containerd-client build script generates gRPC
      # bindings at compile time and fails without it.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      # Install only if not already restored from cache: the cache includes
      # ~/.cargo/bin, and `cargo install` errors ("binary already exists")
      # when the tool is already present.
      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings
        continue-on-error: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all --all-features --workspace

      # Coverage runs on stable only and is reported, not gated: a hard
      # percentage gate would flake the build without improving correctness.
      - name: Install cargo-tarpaulin
        if: matrix.rust == 'stable'
        run: command -v cargo-tarpaulin >/dev/null || cargo install cargo-tarpaulin --version 0.27.0 --locked

      - name: Generate test coverage
        if: matrix.rust == 'stable'
        run: cargo tarpaulin --all-features --workspace --timeout 180 --out Xml
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: matrix.rust == 'stable'
        uses: codecov/codecov-action@v4
        with:
          file: ./cobertura.xml
          fail_ci_if_error: false

  integration:
    name: Integration (containerd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install protoc and containerd
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler containerd
          sudo systemctl enable --now containerd
          # Wait for the containerd socket to appear.
          for _ in $(seq 1 30); do
            [ -S /run/containerd/containerd.sock ] && break
            sleep 1
          done
          sudo ctr version
          # Let the (unprivileged) test process reach the root-owned socket.
          sudo chmod 666 /run/containerd/containerd.sock

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Run containerd integration test
        env:
          NEXUS_IT_CONTAINERD: "1"
        run: cargo test -p nexus-node --test containerd_integration -- --nocapture

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: command -v cargo-deny >/dev/null || cargo install cargo-deny --locked

      # cargo-deny is the single advisory gate: it uses the RustSec database
      # (so it still fails on real vulnerabilities) and is configurable via
      # deny.toml. The previous, redundant `rustsec/audit-check` step is
      # intentionally not run — being unconfigurable, it hard-failed on purely
      # informational "unmaintained"/"unsound" advisories, which are not
      # vulnerabilities and should not block CI.
      - name: Run cargo-deny check
        run: cargo deny check

  build:
    name: Build
    needs: [test, security]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Sets up the cross linker / C toolchain and the CC/AR/linker env vars
      # needed to cross-compile C-backed dependencies (e.g. ring) for musl
      # and aarch64 targets.
      - name: Set up cross toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-panel-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nexus-panel
          if-no-files-found: error

  whmcs:
    name: WHMCS module (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest PHP current WHMCS releases support, and a current one.
        php: ['8.1', '8.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          tools: none

      - name: Lint
        run: find whmcs -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test
        run: php whmcs/tests/run.php

  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs

      - name: Check documentation
        run: cargo doc --no-deps --all --all-features

      # Link checking is reported but not gated — it depends on generated docs
      # and is prone to false positives that would block unrelated changes.
      - name: Check for broken links
        run: |
          command -v cargo-deadlinks >/dev/null || cargo install cargo-deadlinks --locked
          cargo deadlinks
        continue-on-error: true
