# Clippy configuration for Nexus Panel

# Deny all warnings in CI
# Allow some pedantic lints that are too strict

# Allow some common patterns
allow = [
    "module_name_repetitions",  # Sometimes module names are repeated in types
    "too_many_lines",          # Some files are legitimately long
    "too_many_arguments",       # Some functions need many args
    "type_complexity",         # Some types are complex by nature
    "missing_errors_doc",      # Not all errors need docs
    "must_use_candidate",     # Some functions return Result but don't need must_use
]

# Warn about common issues
warn = [
    "clippy::all",
    "clippy::pedantic",
    "clippy::nursery",
    "clippy::cargo",
]

# Deny these specific issues
deny = [
    "clippy::unwrap_used",           # Prefer expect or proper error handling
    "clippy::expect_used",           # Prefer proper error handling
    "clippy::panic",                 # No panics in production code
    "clippy::todo",                  # No TODOs in production code
    "clippy::unimplemented",         # No unimplemented in production code
    "clippy::print_stdout",          # Use tracing instead
    "clippy::print_stderr",          # Use tracing instead
    "clippy::dbg_macro",             # No dbg! in production
]


