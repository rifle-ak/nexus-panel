# Clippy configuration for Nexus Panel
#
# Lint levels are configured via CLI flags in CI (cargo clippy -- -D warnings)
# and per-crate #![allow/warn/deny] attributes. This file only contains
# clippy configuration knobs (thresholds, allowed patterns, etc).

# Allow common patterns that are too strict under pedantic
msrv = "1.75.0"

# Complexity thresholds
cognitive-complexity-threshold = 30

# These types are allowed to be complex
type-complexity-threshold = 350

# Allow these in tests
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
