[package]
name = "game-panel"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "crates/egg-importer",
    "crates/game-config",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1.10"
url = "2.5"
reqwest = { version = "0.11", features = ["json"] }

[dependencies]
egg-importer = { path = "crates/egg-importer" }
game-config = { path = "crates/game-config" }
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
