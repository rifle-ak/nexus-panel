# DayZ Dedicated Server Blueprint
#
# DayZ has no third-party plugin site: every mod is distributed through the
# Steam Workshop, installed as an `@ModName` folder in the server root and
# listed in the server's `-mod=` argument. Install mods from the panel's
# Marketplace page with the `steam_workshop` provider, then add their folder
# names to the MODS variable below.
#
# Workshop downloads for DayZ require a Steam account that owns the game —
# anonymous SteamCMD logins are refused — so set STEAM_USERNAME on the node
# (see docs/DEPLOYMENT.md).
blueprint_version: "1.0"

metadata:
  id: dayz-dedicated
  name: DayZ Dedicated Server
  version: "1.28"
  game: dayz
  author: Nexus Panel
  description: DayZ dedicated server with Steam Workshop mod support
  tags:
    - dayz
    - survival
    - pvp
    - workshop
    - mods
  min_panel_version: "1.0.0"

container:
  image: ghcr.io/parkervcp/steamcmd:debian
  pull_policy: if_not_present
  environment:
    # Server app id. Workshop items are published against the *client* app
    # (221100), which is what the marketplace adapter downloads with.
    SRCDS_APPID: "223350"

resources:
  cpu:
    min: 2000
    max: 6000
    shares: 1024
  memory:
    min: 4Gi
    max: 8Gi
    swap: 2Gi
  disk:
    min: 30Gi
    io_priority: high

startup:
  command: ./DayZServer
  args:
    - -config={{SERVER_CONFIG}}
    - -port={{SERVER_PORT}}
    - -profiles=/home/container/profiles
    - -mod={{MODS}}
    - -serverMod={{SERVER_MODS}}
    - -cpuCount={{CPU_COUNT}}
    - -dologs
    - -adminlog
    - -netlog
    - -freezecheck
  working_dir: /home/container
  startup_grace_period: 90s
  startup_timeout: 600s
  lifecycle:
    pre_start:
      - type: execute
        command: |
          ./steamcmd/steamcmd.sh +force_install_dir /home/container \
            +login anonymous \
            +app_update 223350 validate \
            +quit
        condition: first_start
        timeout: 1800s

variables:
  - name: SERVER_PORT
    description: Game port
    default: "2302"
    required: true
    user_editable: true
    user_viewable: true
    category: Network

  - name: SERVER_CONFIG
    description: Server configuration file
    default: "serverDZ.cfg"
    required: true
    user_editable: true
    user_viewable: true
    category: Server

  - name: MODS
    description: >-
      Client-side mods, as semicolon-separated Workshop folder names
      (e.g. "@CF;@Community-Online-Tools"). The Marketplace installs each
      Workshop item under exactly this name.
    default: ""
    required: false
    user_editable: true
    user_viewable: true
    category: Mods

  - name: SERVER_MODS
    description: >-
      Server-only mods, semicolon-separated. These are not sent to connecting
      clients (admin tools, logging, anti-cheat).
    default: ""
    required: false
    user_editable: true
    user_viewable: true
    category: Mods

  - name: CPU_COUNT
    description: CPU cores the server may use
    default: "4"
    required: false
    user_editable: true
    user_viewable: true
    category: Performance

networking:
  ports:
    - name: Game Port
      internal: "{{SERVER_PORT}}"
      protocol: udp
      required: true

    - name: Steam Query
      internal: "27016"
      protocol: udp
      required: true
      description: Steam query port; required for server-browser listing

    - name: RCON
      internal: "2304"
      protocol: udp
      required: false
      description: BattlEye RCON

  dns:
    - 1.1.1.1
    - 1.0.0.1

security:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
  read_only_root: false
  no_new_privileges: true
  seccomp_profile: runtime/default
  firewall_rules:
    - type: connection_rate
      name: ddos_protection
      limit: 100/s
      action: drop

monitoring:
  health_check:
    type: game_query
    protocol: source
    port: "27016"
    interval: 30s
    timeout: 10s
    failure_threshold: 3

  ready_check:
    type: log_pattern
    pattern: "Mission DayZ read from bank"
    timeout: 900s

  metrics:
    - type: game_query
      name: players_online
      protocol: source
      field: players
      interval: 30s

backups:
  paths:
    - /mpmissions
    - /profiles
    - /serverDZ.cfg
  exclude:
    - "*.log"
    - "*.ADM"
    - "*.RPT"
  retention: 10
  schedule: "0 */6 * * *"

performance:
  kernel:
    sysctl:
      net.core.somaxconn: "65535"
      net.core.rmem_max: "26214400"
    ulimits:
      nofile: 65535

  nice: -5
  io_class: best-effort

mods:
  # DayZ loads `@ModName` folders from the server root and has no plugin
  # loader of its own, so the mods directory *is* the server directory.
  loader: generic
  mods_dir: /
  marketplaces:
    - steam_workshop
  auto_update: false

updates:
  check:
    type: steam_cmd
    app_id: 223350
  apply:
    type: steam_cmd
    app_id: 223350
  auto_update: false
